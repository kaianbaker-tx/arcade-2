<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Frog Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one blocky pond screen, chunky HUD on top, touch pad below on phones */
:root{
  --bg:#12261c; --panel:#1d3b2b; --ink:#eaf7d7; --dim:#9cc28a;
  --it:#ff4f3a; --gold:#ffd23f; --edge:#0a1710;
  --pixel:"Silkscreen", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--pixel);margin:0;padding-inline:16px;padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:700;letter-spacing:.06em;color:var(--gold);text-shadow:3px 3px 0 var(--edge)}
.wrap{position:relative;width:100%;max-width:800px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.hud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.chip{background:var(--panel);border:3px solid var(--edge);padding:4px 8px;font-size:13px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip i{display:inline-block;width:12px;height:12px;border:2px solid var(--edge)}
.chip.isit{background:var(--it);color:#fff}
.stage{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);max-width:100%;max-height:100%;background:#2f6b3a;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:var(--panel);border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);padding:18px 20px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;color:var(--gold);font-size:24px}
.card p{margin:0;font-size:12px;line-height:1.6;color:var(--dim)}
.card p b{color:var(--ink)}
button{font-family:var(--pixel);font-size:16px;background:var(--gold);color:var(--edge);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:8px 14px;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pad{display:none;width:100%;justify-content:space-between;align-items:center;gap:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad button{padding:0;font-size:20px;background:var(--panel);color:var(--ink)}
.hop{width:96px;height:96px;border-radius:0;font-size:18px}
@media (pointer:coarse){.pad{display:flex}}
</style>

<h1>FROG TAG</h1>
<div class="wrap">
  <div class="hud" id="hud"></div>
  <div class="stage">
    <canvas id="c" width="320" height="240"></canvas>
    <div class="overlay" id="ov">
      <div class="card">
        <h2 id="ovTitle">FROG TAG</h2>
        <p id="ovText">You are the <b>green frog</b>. Whoever has the <b style="color:var(--it)">red block</b> is IT. Tag a frog to pass it on. Every second you are <b>not</b> IT scores a point.<br><br><b>Move:</b> arrows / WASD &nbsp; <b>Hop:</b> space<br>Water slows you down. Rocks block you.</p>
        <button id="go">START</button>
      </div>
    </div>
  </div>
  <div class="pad">
    <div class="dpad">
      <span></span><button data-k="up" aria-label="Up">▲</button><span></span>
      <button data-k="left" aria-label="Left">◀</button><span></span><button data-k="right" aria-label="Right">▶</button>
      <span></span><button data-k="down" aria-label="Down">▼</button><span></span>
    </div>
    <button class="hop" data-k="hop">HOP</button>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),x=cv.getContext('2d');
const T=16,W=20,H=15,ROUND=60;
// map: . grass, ~ water, # rock, * flowers
const MAP=[
"####################",
"#....*.......~~~...#",
"#..##......~~~~~~..#",
"#..#.......~~~~~~..#",
"#......*....~~~....#",
"#.~~~..........##..#",
"#.~~~~....#....#...#",
"#..~~.....#.....*..#",
"#.........##.......#",
"#..*..~~.......~~..#",
"#....~~~~.....~~~~.#",
"#.##..~~...*...~~..#",
"#.#............#...#",
"#......*......##...#",
"####################"];
const tile=(c,r)=>(MAP[r]||'#')[c]||'#';
const solid=(px,py)=>tile(Math.floor(px/T),Math.floor(py/T))==='#';
const wet=(px,py)=>tile(Math.floor(px/T),Math.floor(py/T))==='~';

const SPR=[
"..ee....ee..",
".eWWe..eWWe.",
".eWKe..eWKe.",
"GGGGGGGGGGGG",
"GGGGGGGGGGGG",
"GGMMMMMMMMGG",
"GGBBBBBBBBGG",
".GGBBBBBBGG.",
"GG.GG..GG.GG",
"G..........G"];
const FROGS=[
 {name:'YOU',body:'#4fd04a',dark:'#2a8a2e',belly:'#b7f08a'},
 {name:'BLU',body:'#3fa8f5',dark:'#1e5f9e',belly:'#a9dcff'},
 {name:'SUN',body:'#f2c230',dark:'#a37a10',belly:'#fff0a0'},
 {name:'PIP',body:'#f06aa8',dark:'#a8346a',belly:'#ffc4e0'}];
const STARTS=[[3,7],[16,2],[17,12],[9,12]];

let frogs,it,timeLeft,running=false,last=0,tagCool=0,flash=0;
const keys={};

function reset(){
  frogs=FROGS.map((f,i)=>({...f,x:STARTS[i][0]*T+8,y:STARTS[i][1]*T+8,vx:0,vy:0,score:0,hop:0,hopCd:0,bob:0,face:1,wander:Math.random()*6,tx:0,ty:0}));
  it=1+Math.floor(Math.random()*3);
  timeLeft=ROUND;tagCool=1.5;flash=0;
}

function tryMove(f,dx,dy){
  const r=5;
  const nx=f.x+dx;
  if(!solid(nx-r,f.y-r)&&!solid(nx+r,f.y-r)&&!solid(nx-r,f.y+r)&&!solid(nx+r,f.y+r))f.x=nx;
  const ny=f.y+dy;
  if(!solid(f.x-r,ny-r)&&!solid(f.x+r,ny-r)&&!solid(f.x-r,ny+r)&&!solid(f.x+r,ny+r))f.y=ny;
}

function steer(f,i,dt){
  let ax=0,ay=0,wantHop=false;
  if(i===0){
    ax=(keys.right?1:0)-(keys.left?1:0);
    ay=(keys.down?1:0)-(keys.up?1:0);
    wantHop=keys.hop;
  }else{
    if(i===it){
      let best=null,bd=1e9;
      frogs.forEach((g,j)=>{if(j===i)return;const d=Math.hypot(g.x-f.x,g.y-f.y);if(d<bd){bd=d;best=g}});
      ax=best.x-f.x;ay=best.y-f.y;
      wantHop=bd<40&&Math.random()<.05;
    }else{
      const c=frogs[it];const dx=f.x-c.x,dy=f.y-c.y,d=Math.hypot(dx,dy);
      f.wander-=dt;
      if(f.wander<=0){f.wander=1+Math.random()*2;f.tx=Math.random()*2-1;f.ty=Math.random()*2-1}
      if(d<90){ax=dx/d+f.tx*.4;ay=dy/d+f.ty*.4;wantHop=d<35&&Math.random()<.04}
      else{ax=f.tx*.5;ay=f.ty*.5}
    }
    // slide around rocks
    const l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;
    if(solid(f.x+ax*10,f.y+ay*10)){const t=ax;ax=-ay;ay=t;if(Math.random()<.5){ax=-ax;ay=-ay}}
  }
  const l=Math.hypot(ax,ay);if(l>0){ax/=l;ay/=l}
  let sp=(i===0?62:(i===it?60:54));
  if(wet(f.x,f.y))sp*=.5;
  if(wantHop&&f.hopCd<=0&&l>0){f.hop=.28;f.hopCd=1.6}
  if(f.hop>0)sp*=2.6;
  if(ax)f.face=ax>0?1:-1;
  tryMove(f,ax*sp*dt,ay*sp*dt);
  f.moving=l>0;
}

function update(dt){
  timeLeft-=dt;tagCool-=dt;flash-=dt;
  frogs.forEach((f,i)=>{
    f.hop=Math.max(0,f.hop-dt);f.hopCd=Math.max(0,f.hopCd-dt);
    if(i===it&&tagCool>0){f.moving=false;return} // IT freezes briefly after a tag
    steer(f,i,dt);
    if(f.moving)f.bob+=dt*14;
    if(i!==it)f.score+=dt;
  });
  if(tagCool<=0){
    const c=frogs[it];
    for(let j=0;j<frogs.length;j++){
      if(j===it)continue;const g=frogs[j];
      if(Math.hypot(g.x-c.x,g.y-c.y)<12){it=j;tagCool=1.2;flash=.25;break}
    }
  }
  if(timeLeft<=0)end();
}

function drawMap(){
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const t=tile(c,r),px=c*T,py=r*T,ck=(c+r)%2;
    if(t==='#'){
      x.fillStyle='#3a4a3e';x.fillRect(px,py,T,T);
      x.fillStyle='#5d6f60';x.fillRect(px+1,py+1,T-4,T-4);
      x.fillStyle='#7f9381';x.fillRect(px+2,py+2,5,3);
      x.fillStyle='#26332a';x.fillRect(px,py+T-2,T,2);
    }else if(t==='~'){
      x.fillStyle=ck?'#2b7fb8':'#2a76ab';x.fillRect(px,py,T,T);
      const w=Math.floor(performance.now()/300+c+r)%4;
      x.fillStyle='#6fc2ee';x.fillRect(px+2+w*2,py+5,4,1);x.fillRect(px+8-w,py+11,3,1);
      if((c*7+r*3)%5===0){x.fillStyle='#2f9a44';x.fillRect(px+3,py+3,9,8);x.fillStyle='#2a76ab';x.fillRect(px+9,py+6,3,2)}
    }else{
      x.fillStyle=ck?'#5bb04e':'#55a648';x.fillRect(px,py,T,T);
      x.fillStyle='#478e3c';x.fillRect(px+3,py+4,1,2);x.fillRect(px+11,py+10,1,2);
      if(t==='*'){x.fillStyle='#fff';x.fillRect(px+6,py+6,3,3);x.fillStyle='#ffd23f';x.fillRect(px+7,py+7,1,1)}
    }
  }
}

function drawFrog(f,i){
  const lift=f.hop>0?Math.sin((f.hop/.28)*Math.PI)*7:(f.moving?Math.abs(Math.sin(f.bob))*2:0);
  const ox=Math.round(f.x-6),oy=Math.round(f.y-8-lift);
  x.fillStyle='rgba(0,0,0,.28)';x.fillRect(Math.round(f.x-5),Math.round(f.y+1),10,3);
  const col={G:f.body,e:f.body,W:'#fff',K:'#111',M:f.dark,B:f.belly};
  SPR.forEach((row,ry)=>{for(let rx=0;rx<12;rx++){
    const ch=row[f.face>0?rx:11-rx];if(ch==='.')continue;
    x.fillStyle=col[ch];x.fillRect(ox+rx,oy+ry,1,1);
  }});
  // outline-ish dark edge at feet
  if(i===it){
    const blink=tagCool>0&&Math.floor(tagCool*10)%2;
    if(!blink){x.fillStyle='#ff4f3a';x.fillRect(ox+3,oy-6,6,4);x.fillStyle='#fff';x.fillRect(ox+4,oy-5,1,1)}
  }
  if(i===0){x.fillStyle='#ffd23f';x.fillRect(ox+5,oy+12+Math.round(lift),2,1)}
}

function draw(){
  drawMap();
  [...frogs.keys()].sort((a,b)=>frogs[a].y-frogs[b].y).forEach(i=>drawFrog(frogs[i],i));
  if(flash>0){x.fillStyle='rgba(255,255,255,.35)';x.fillRect(0,0,320,240)}
  // timer bar
  x.fillStyle='#0a1710';x.fillRect(0,0,320,4);
  x.fillStyle=timeLeft<10?'#ff4f3a':'#ffd23f';x.fillRect(0,0,320*Math.max(0,timeLeft)/ROUND,4);
}

const hud=document.getElementById('hud');
function renderHud(){
  hud.innerHTML=`<div class="chip">⏱ ${Math.max(0,Math.ceil(timeLeft))}s</div>`+
   frogs.map((f,i)=>`<div class="chip${i===it?' isit':''}"><i style="background:${f.body}"></i>${f.name} ${Math.floor(f.score)}${i===it?' · IT':''}</div>`).join('');
}

const ov=document.getElementById('ov'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),go=document.getElementById('go');
function end(){
  running=false;
  const order=[...frogs].sort((a,b)=>b.score-a.score);
  const won=order[0].name==='YOU';
  ovT.textContent=won?'YOU WIN!':`${order[0].name} WINS`;
  ovX.innerHTML=order.map((f,k)=>`${k+1}. <b style="color:${f.body}">${f.name}</b> ${Math.floor(f.score)} pts`).join('<br>');
  go.textContent='PLAY AGAIN';ov.hidden=false;go.focus();
}
function start(){reset();ov.hidden=true;running=true;last=performance.now()}
go.addEventListener('click',start);

function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(running)update(dt);
  draw();renderHud();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(t=>{last=t;loop(t)});

const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'hop'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){keys[k]=true;if(running)e.preventDefault()}
  if((e.code==='Enter'||e.code==='Space')&&!running&&document.activeElement!==go){start();e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{keys[k]=true;e.preventDefault()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});
})();
</script>

</body></html>
