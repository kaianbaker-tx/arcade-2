<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: game-show stage — big wheel on the left, choices panel on the right; stacks on phones */
:root {
  --bg: #dff1fb;
  --stage: #ffffff;
  --ink: #17324a;
  --muted: #557089;
  --line: #bcd7e8;
  --accent: #ff4d4d;
  --accent-ink: #ffffff;
  --gold: #ffc23d;
  --field: #f4fafd;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12193a; --stage: #1c2552; --ink: #eef3ff; --muted: #a3b0d8;
    --line: #34407a; --accent: #ff5e5e; --accent-ink: #ffffff; --gold: #ffcb52;
    --field: #161e45; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12193a; --stage: #1c2552; --ink: #eef3ff; --muted: #a3b0d8;
  --line: #34407a; --accent: #ff5e5e; --accent-ink: #ffffff; --gold: #ffcb52;
  --field: #161e45; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px;
  padding-inline: 16px; padding-block: 24px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
header h1 {
  font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 6vw, 3.2rem);
  margin: 0; letter-spacing: .5px; line-height: 1; text-wrap: balance;
}
header h1 span { color: var(--accent); }
header p { margin: 6px 0 0; color: var(--muted); font-weight: 700; }

.board { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .board { grid-template-columns: 1fr; } }

.stage {
  background: var(--stage); border: 3px solid var(--line); border-radius: 24px;
  padding: 20px; display: grid; gap: 16px; justify-items: center; min-width: 0;
}
.wheel-box { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; }
canvas { width: 100%; height: 100%; display: block; }
.pointer {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 44px; height: 54px; pointer-events: none;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,.25));
}
.pointer.bump { animation: bump .12s ease-out; }
@keyframes bump { 50% { transform: translateX(-50%) rotate(-14deg); } }

.spin {
  font-family: var(--display); font-size: 1.7rem; letter-spacing: 1px;
  background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 999px; padding: 12px 46px 14px; cursor: pointer;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000);
  transition: transform .08s, box-shadow .08s;
}
.spin:hover { transform: translateY(-1px); }
.spin:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.spin:disabled { opacity: .55; cursor: default; transform: none; }
.spin:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.result {
  min-height: 3.2rem; text-align: center; font-weight: 800; color: var(--muted);
  display: grid; place-items: center;
}
.result strong {
  display: block; font-family: var(--display); font-weight: 400; color: var(--ink);
  font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.1; overflow-wrap: anywhere;
}
.result.win strong { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.panel {
  background: var(--stage); border: 3px solid var(--line); border-radius: 24px;
  padding: 20px; display: grid; gap: 14px; min-width: 0;
}
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; }
.panel label { font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; font: 700 1.05rem var(--body); color: var(--ink);
  background: var(--field); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.add input:focus { border-color: var(--accent); outline: none; }
.add-btn {
  font-family: var(--display); font-size: 1.15rem; letter-spacing: .5px; color: var(--accent-ink);
  background: var(--accent); border: 0; border-radius: 14px; padding: 0 20px; cursor: pointer;
}
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 340px; overflow-y: auto; }
.list li {
  display: flex; align-items: center; gap: 8px; background: var(--field);
  border: 2px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 10px;
}
.list .pick {
  appearance: none; -webkit-appearance: none; flex: none; margin: 0; cursor: pointer;
  width: 26px; height: 26px; border-radius: 8px; border: 3px solid var(--dot);
  background: var(--stage); display: grid; place-items: center;
}
.list .pick:checked { background: var(--dot); }
.list .pick:checked::after { content: ""; width: 7px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
.list .pick:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.list li.off { opacity: .6; }
.list li.off .name { text-decoration: line-through; }
.chip:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.list .name {
  flex: 1; min-width: 0; font: 700 1rem var(--body); color: var(--ink);
  background: transparent; border: 0; padding: 6px 2px;
}
.list .del {
  flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
  background: transparent; color: var(--muted); font: 800 1.3rem/1 var(--body);
}
.list .del:hover { background: var(--accent); color: var(--accent-ink); }
.list .empty-msg { justify-content: center; color: var(--muted); font-weight: 700; padding: 14px; border-style: dashed; }
.list input:disabled, .add input:disabled { opacity: .6; }
.count { color: var(--muted); font-weight: 700; font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 800 .9rem var(--body); color: var(--ink); background: var(--field);
  border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.history { display: grid; gap: 6px; }
.history ol { margin: 0; padding-left: 1.4rem; color: var(--muted); font-weight: 700; display: grid; gap: 2px; }
.history ol li:first-child { color: var(--ink); }
.history .empty { color: var(--muted); font-size: .9rem; margin: 0; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
@media (prefers-reduced-motion: reduce) {
  .result.win strong, .pointer.bump { animation: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>Spin the <span>Wheel</span></h1>
    <p>Add your own choices in the "Your choices" box, then hit spin and let the wheel decide.</p>
  </header>

  <div class="board">
    <section class="stage">
      <div class="wheel-box">
        <canvas id="wheel" width="1040" height="1040" aria-label="Spinning wheel"></canvas>
        <svg class="pointer" id="pointer" viewBox="0 0 44 54" aria-hidden="true">
          <path d="M22 52 L4 14 A18 18 0 1 1 40 14 Z" fill="var(--accent)" stroke="var(--stage)" stroke-width="3"/>
          <circle cx="22" cy="18" r="6" fill="var(--stage)"/>
        </svg>
      </div>
      <button class="spin" id="spin">SPIN!</button>
      <div class="result" id="result" aria-live="polite"><span>Ready when you are</span></div>
    </section>

    <aside class="panel">
      <h2>Your choices</h2>
      <form class="add" id="add-form" autocomplete="off">
        <input id="new-choice" type="text" maxlength="40" placeholder="Type a choice…" aria-label="New choice">
        <button type="submit" class="add-btn">Add</button>
      </form>
      <div class="row">
        <button class="chip" id="select-all" type="button">✓ Select all</button>
        <button class="chip" id="select-none" type="button">Select none</button>
      </div>
      <ul class="list" id="list"></ul>
      <div class="count" id="count"></div>
      <div class="row">
        <button class="chip" id="clear">Clear all</button>
        <button class="chip" id="shuffle">Shuffle</button>
        <button class="chip" id="sample-food">Food ideas</button>
        <button class="chip" id="sample-yes">Yes / No</button>
        <button class="chip" id="sample-num">Numbers 1–10</button>
      </div>
      <label class="toggle"><input type="checkbox" id="remove"> Remove the winner after each spin</label>
      <label class="toggle"><input type="checkbox" id="sound" checked> Sound</label>
      <div class="history">
        <label>Past spins</label>
        <p class="empty" id="hist-empty">No spins yet.</p>
        <ol id="hist"></ol>
      </div>
    </aside>
  </div>
</div>
<canvas class="confetti" id="confetti"></canvas>

<script>
const COLORS = ["#ff4d4d","#ff9f1c","#ffc23d","#2ec4b6","#3a86ff","#8338ec","#ff5fa2","#06d6a0","#118ab2","#ef6c2f"];
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const listEl = document.getElementById("list");
const addForm = document.getElementById("add-form");
const newInput = document.getElementById("new-choice");
const selAll = document.getElementById("select-all");
const selNone = document.getElementById("select-none");
const spinBtn = document.getElementById("spin");
const resultEl = document.getElementById("result");
const pointer = document.getElementById("pointer");
const histEl = document.getElementById("hist");
const histEmpty = document.getElementById("hist-empty");
const countEl = document.getElementById("count");
const SIZE = canvas.width, C = SIZE / 2, R = C - 14;

let angle = 0;          // current rotation (radians)
let spinning = false;
let history = [];
const FOOD = ["Pizza", "Tacos", "Burgers", "Sushi", "Pasta", "Ramen", "Mac & cheese", "Chicken nuggets"];
const mk = t => ({ text: String(t), on: true });
let choices = FOOD.map(mk);
try {
  const saved = JSON.parse(localStorage.getItem("wheel-choices"));
  if (Array.isArray(saved)) choices = saved.map(c => typeof c === "string" ? mk(c) : { text: String(c.text || ""), on: c.on !== false });
} catch (e) {}

function save() { try { localStorage.setItem("wheel-choices", JSON.stringify(choices)); } catch (e) {} }

function entries() {
  return choices.filter(c => c.on).map(c => c.text.trim()).filter(Boolean);
}

function renderList() {
  listEl.innerHTML = "";
  if (choices.length === 0) {
    const li = document.createElement("li"); li.className = "empty-msg";
    li.textContent = "No choices yet. Type one above and press Add!";
    listEl.append(li);
  }
  const n = entries().length;
  let k = 0;
  choices.forEach((c, i) => {
    const li = document.createElement("li");
    if (!c.on) li.classList.add("off");
    const box = document.createElement("input");
    box.type = "checkbox"; box.className = "pick"; box.checked = c.on; box.id = "pick-" + i;
    box.setAttribute("aria-label", "Put " + (c.text || "choice") + " on the wheel");
    box.disabled = spinning;
    const used = c.on && c.text.trim();
    box.style.setProperty("--dot", used ? colorFor(k++, n) : "var(--line)");
    box.addEventListener("change", () => { c.on = box.checked; angle = 0; save(); renderList(); draw(); });
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "name"; inp.value = c.text; inp.maxLength = 40; inp.id = "choice-" + i;
    inp.setAttribute("aria-label", "Choice " + (i + 1));
    inp.disabled = spinning;
    inp.addEventListener("input", () => { c.text = inp.value; save(); draw(); });
    inp.addEventListener("change", () => { if (!inp.value.trim()) remove(i); else renderList(); });
    const del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "×";
    del.setAttribute("aria-label", "Delete " + (c.text || "choice"));
    del.disabled = spinning;
    del.addEventListener("click", () => remove(i));
    li.append(box, inp, del);
    listEl.append(li);
  });
  const total = choices.length, on = choices.filter(c => c.on).length;
  selAll.disabled = spinning || total === 0 || on === total;
  selNone.disabled = spinning || on === 0;
}

function remove(i) { choices.splice(i, 1); save(); renderList(); draw(); }

function setChoices(arr) { choices = arr.map(c => typeof c === "string" ? mk(c) : c); angle = 0; save(); renderList(); draw(); }

function setLocked(on) {
  spinBtn.disabled = on; newInput.disabled = on;
  listEl.querySelectorAll("input, button").forEach(el => el.disabled = on);
  if (!on) renderList(); else { selAll.disabled = true; selNone.disabled = true; }
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function colorFor(i, n) {
  // avoid the last slice matching the first
  let c = COLORS[i % COLORS.length];
  if (i === n - 1 && n > 1 && n % COLORS.length === 1) c = COLORS[(i + 3) % COLORS.length];
  return c;
}

function draw() {
  const items = entries();
  const n = items.length;
  ctx.clearRect(0, 0, SIZE, SIZE);
  const stage = cssVar("--stage") || "#fff";

  // outer rim
  ctx.beginPath(); ctx.arc(C, C, R + 10, 0, Math.PI * 2);
  ctx.fillStyle = cssVar("--ink") || "#17324a"; ctx.fill();

  if (n === 0) {
    ctx.beginPath(); ctx.arc(C, C, R, 0, Math.PI * 2);
    ctx.fillStyle = cssVar("--field") || "#eee"; ctx.fill();
    ctx.fillStyle = cssVar("--muted") || "#888";
    ctx.font = "800 44px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(choices.length ? "Tick some choices!" : "Add some choices!", C, C);
    countEl.textContent = choices.length ? `0 of ${choices.length} on the wheel` : "0 choices";
    return;
  }

  const slice = Math.PI * 2 / n;
  for (let i = 0; i < n; i++) {
    const a0 = angle + i * slice - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(C, C);
    ctx.arc(C, C, R, a0, a0 + slice); ctx.closePath();
    ctx.fillStyle = colorFor(i, n); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 4; ctx.stroke();

    // label
    ctx.save();
    ctx.translate(C, C); ctx.rotate(a0 + slice / 2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    let fs = Math.max(22, Math.min(54, 520 / Math.max(n, 4) * 1.1));
    ctx.font = `400 ${fs}px "Lilita One", sans-serif`;
    let label = items[i];
    const maxW = R - 110;
    while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -1);
    if (label !== items[i]) label = label.slice(0, -1) + "…";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.fillText(label, R - 34, 0);
    ctx.restore();
  }

  // rim pegs
  for (let i = 0; i < n; i++) {
    const a = angle + i * slice - Math.PI / 2;
    ctx.beginPath(); ctx.arc(C + Math.cos(a) * (R + 1), C + Math.sin(a) * (R + 1), 9, 0, Math.PI * 2);
    ctx.fillStyle = "#ffc23d"; ctx.fill();
  }

  // hub
  ctx.beginPath(); ctx.arc(C, C, 70, 0, Math.PI * 2);
  ctx.fillStyle = stage; ctx.fill();
  ctx.lineWidth = 10; ctx.strokeStyle = cssVar("--ink") || "#17324a"; ctx.stroke();
  ctx.fillStyle = cssVar("--accent") || "#ff4d4d";
  ctx.font = '400 40px "Lilita One", sans-serif'; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("GO", C, C + 2);

  countEl.textContent = `${n} of ${choices.length} on the wheel`;
}

/* --- sound --- */
let audio;
function tick() {
  if (!document.getElementById("sound").checked) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "square"; o.frequency.value = 900 + Math.random() * 200;
    g.gain.setValueAtTime(0.06, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.05);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.05);
  } catch (e) {}
}
function fanfare() {
  if (!document.getElementById("sound").checked || !audio) return;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    const t = audio.currentTime + i * 0.11;
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.3);
  });
}

/* --- spin --- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function spin() {
  const items = entries();
  if (spinning || items.length < 2) {
    if (items.length < 2) resultEl.innerHTML = "<span>Tick at least 2 choices to spin.</span>";
    return;
  }
  spinning = true; setLocked(true);
  resultEl.className = "result"; resultEl.innerHTML = "<span>Spinning…</span>";
  tick(); // unlock audio inside click

  const n = items.length, slice = Math.PI * 2 / n;
  const start = angle;
  const turns = reduceMotion ? 1 : 5 + Math.random() * 3;
  const target = start + turns * Math.PI * 2 + Math.random() * Math.PI * 2;
  const dur = reduceMotion ? 1200 : 4600 + Math.random() * 1200;
  const t0 = performance.now();
  let lastSeg = Math.floor(start / slice);

  function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 4);
    angle = start + (target - start) * e;
    const seg = Math.floor(angle / slice);
    if (seg !== lastSeg) {
      lastSeg = seg; tick();
      pointer.classList.remove("bump"); void pointer.offsetWidth; pointer.classList.add("bump");
    }
    draw();
    if (t < 1) requestAnimationFrame(frame); else finish(items);
  }
  requestAnimationFrame(frame);
}

function finish(items) {
  const n = items.length, slice = Math.PI * 2 / n;
  // pointer sits at top (-90°); slice i spans angle + i*slice from top
  const norm = ((-angle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const idx = Math.floor(norm / slice) % n;
  const winner = items[idx];

  resultEl.className = "result win";
  resultEl.innerHTML = "";
  const s = document.createElement("span"); s.textContent = "The wheel says…";
  const st = document.createElement("strong"); st.textContent = winner;
  resultEl.append(s, st);

  history.unshift(winner); history = history.slice(0, 8);
  renderHistory();
  fanfare(); burst(colorFor(idx, n));

  spinning = false; setLocked(false);

  if (document.getElementById("remove").checked) {
    setTimeout(() => {
      const i = choices.findIndex(c => c.on && c.text.trim() === winner);
      if (i >= 0) choices.splice(i, 1);
      angle = 0; save(); renderList(); draw();
    }, 1400);
  }
}

function renderHistory() {
  histEl.innerHTML = "";
  history.forEach(h => { const li = document.createElement("li"); li.textContent = h; histEl.append(li); });
  histEmpty.hidden = history.length > 0;
}

/* --- confetti --- */
const cf = document.getElementById("confetti"), cx = cf.getContext("2d");
let bits = [];
function burst(main) {
  if (reduceMotion) return;
  cf.width = innerWidth; cf.height = innerHeight;
  const r = canvas.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height * 0.35;
  for (let i = 0; i < 140; i++) {
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    bits.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6,
      s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: i % 3 === 0 ? main : COLORS[i % COLORS.length], life: 1 });
  }
  if (bits.length === 140) requestAnimationFrame(animConfetti);
}
function animConfetti() {
  cx.clearRect(0, 0, cf.width, cf.height);
  bits.forEach(b => {
    b.vy += 0.28; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= 0.008;
    cx.save(); cx.globalAlpha = Math.max(0, b.life); cx.translate(b.x, b.y); cx.rotate(b.r);
    cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore();
  });
  bits = bits.filter(b => b.life > 0 && b.y < cf.height + 40);
  if (bits.length) requestAnimationFrame(animConfetti); else cx.clearRect(0, 0, cf.width, cf.height);
}

/* --- controls --- */
spinBtn.addEventListener("click", spin);
canvas.addEventListener("click", spin);
addForm.addEventListener("submit", e => {
  e.preventDefault();
  const v = newInput.value.trim();
  if (!v || spinning) return;
  choices.push(mk(v)); newInput.value = ""; save(); renderList(); draw();
  listEl.scrollTop = listEl.scrollHeight;
  newInput.focus();
});
document.getElementById("shuffle").addEventListener("click", () => {
  const a = choices.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  setChoices(a);
});
selAll.addEventListener("click", () => { choices.forEach(c => c.on = true); angle = 0; save(); renderList(); draw(); });
selNone.addEventListener("click", () => { choices.forEach(c => c.on = false); angle = 0; save(); renderList(); draw(); });

document.getElementById("sample-yes").addEventListener("click", () => setChoices(["Yes", "No", "Yes", "No"]));
document.getElementById("sample-num").addEventListener("click", () =>
  setChoices(Array.from({ length: 10 }, (_, i) => String(i + 1))));
document.getElementById("clear").addEventListener("click", () => { setChoices([]); newInput.focus(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !e.target.closest("button, input, textarea")) { e.preventDefault(); spin(); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
renderList(); draw(); renderHistory();
</script>
