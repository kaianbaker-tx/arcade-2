function spr(rows,pal){let m=cache.get(rows);if(!m){m=new Map();cache.set(rows,m);}let c=m.get(pal);
 if(!c){c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');

 return c;}

let AC=null,master,musicG,sfxG,muted=false,song=null,songName='',step=0,nextT=0,noiseBuf;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
 master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
 musicG=AC.createGain();musicG.gain.value=.09;musicG.connect(master);
 sfxG=AC.createGain();sfxG.gain.value=.28;sfxG.connect(master);
 noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 nextT=AC.currentTime+.05;setInterval(sched,25);}
function nf(n){const m=n.match(/^([A-G])(#?)(\d)$/);const idx={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,((+m[3]+1)*12+idx-69)/12);}

 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+.05);}

function sched(){if(!AC)return;if(!song){nextT=AC.currentTime+.05;return;}
 while(nextT<AC.currentTime+.12){const sl=60/song.bpm/2,i=step%song.lead.length,L=song.lead[i],B=song.bass[i%song.bass.length];
  if(L)tone(nf(L),nextT,sl*song.ld,song.lt,song.lv,musicG);
  if(B)tone(nf(B),nextT,sl*song.bd,'triangle',.9,musicG);
  if(song.drums){if(i%4===0)tone(120,nextT,.15,'sine',.9,musicG,40);if(i%2===1)noise(nextT,.05,.4,musicG,8000,1);}
  step++;nextT+=sl;}}

  case 'clink':tone(1800,t,.06,'square',.25,g,1400);break;
  case 'poof':noise(t,.25,.7,g,900,1,200);tone(600,t,.15,'square',.18,g,100);break;
  case 'coin':tone(988,t,.06,'square',.22,g);tone(1319,t+.06,.12,'square',.22,g);break;
  case 'jingle':['C6','E6','G6','C7'].forEach((x,i)=>tone(nf(x),t+i*.08,.18,'square',.22,g));break;
  case 'hurt':tone(320,t,.25,'sawtooth',.4,g,80);break;
  case 'roar':tone(95,t,1.2,'sawtooth',.6,g,40);tone(70,t,1.2,'square',.3,g,35);noise(t,1.2,.9,g,300,.7,80);break;
  case 'boom':noise(t,.5,1,g,220,.7,50);tone(85,t,.4,'sine',.9,g,30);break;
  case 'jump':tone(150,t,.3,'square',.25,g,400);break;
  case 'door':tone(200,t,.1,'square',.3,g);tone(150,t+.1,.15,'square',.3,g);break;
  case 'spore':noise(t,.4,.25,g,3000,1,1200);break;
  case 'talk':tone(660,t,.04,'square',.12,g);break;
 }}

function updParts(){for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vx*=.92;q.vy*=.92;q.l--;}parts=parts.filter(q=>q.l>0);}
function updDialog(){const line=dialog.lines[dialog.i];const before=dialog.c|0;dialog.c=Math.min(line.length,dialog.c+1.2);if((dialog.c|0)!==before&&(before%3===0))sfx('talk');
 if(pressA){if(dialog.c<line.length)dialog.c=line.length;else{dialog.i++;dialog.c=0;if(dialog.i>=dialog.lines.length){const f=dialog.onDone;dialog=null;if(f)f();}}}}

// ================= RENDER =================
function tile(ch,x,y,area){const X=x*TS,Y=y*TS;
 if(area==='over'){ctx.fillStyle=((x*7+y*3)%5===0)?'#4a9a50':'#43914a';ctx.fillRect(X,Y,TS,TS);if((x+y*2)%3===0){ctx.fillStyle='#5cb062';ctx.fillRect(X+4,Y+6,2,2);ctx.fillRect(X+11,Y+11,2,2);}}
 else if(area==='shop'){ctx.fillStyle=y%2?'#8a5a34':'#946238';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#6e4426';ctx.fillRect(X,Y+15,TS,1);ctx.fillRect(X+((y*5+x*3)%16),Y,1,15);}
 else{ctx.fillStyle=(x+y)%2?'#2a2638':'#2f2a40';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#221f2f';ctx.fillRect(X,Y,TS,1);ctx.fillRect(X,Y,1,TS);}
 switch(ch){
  case 'T':ctx.fillStyle='#1f5427';ctx.fillRect(X+1,Y+3,14,9);ctx.fillRect(X+3,Y+1,10,13);ctx.fillStyle='#2f7a38';ctx.fillRect(X+3,Y+3,9,7);ctx.fillStyle='#46a050';ctx.fillRect(X+4,Y+3,4,3);ctx.fillStyle='#6b4226';ctx.fillRect(X+6,Y+13,4,3);break;
  case '#':case 't':
   if(area==='shop'){ctx.fillStyle='#5e3a22';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#4a2c18';ctx.fillRect(X,Y+5,TS,1);ctx.fillRect(X,Y+11,TS,1);}
   else{ctx.fillStyle='#4a4466';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#2c283e';ctx.fillRect(X,Y+7,TS,1);ctx.fillRect(X,Y+15,TS,1);ctx.fillRect(X+(y%2?4:11),Y,1,7);ctx.fillRect(X+(y%2?11:4),Y+8,1,7);ctx.fillStyle='#5c5678';ctx.fillRect(X,Y,TS,1);}
   if(ch==='t'){ctx.fillStyle='#5a3a24';ctx.fillRect(X+6,Y+8,4,7);const f=(frame>>3)%2;ctx.fillStyle=f?'#ffd23a':'#f07a2a';ctx.fillRect(X+5,Y+3,6,5);ctx.fillStyle=f?'#f07a2a':'#ffd23a';ctx.fillRect(X+7,Y+1+f,2,3);}
   break;
  case 'R':if(area==='over'){ctx.fillStyle='#6d6458';ctx.fillRect(X+1,Y+2,14,13);ctx.fillStyle='#8f8576';ctx.fillRect(X+2,Y+3,8,5);ctx.fillStyle='#4f483f';ctx.fillRect(X+1,Y+13,14,2);}
   else{ctx.fillStyle='#3a3552';ctx.fillRect(X+1,Y+1,14,14);ctx.fillStyle='#5c5678';ctx.fillRect(X+1,Y+1,14,3);ctx.fillRect(X+1,Y+1,3,14);ctx.fillStyle='#24203a';ctx.fillRect(X+5,Y+6,6,6);}break;
  case 'W':{ctx.fillStyle='#2f6fb3';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#5a9ae0';const o=(frame>>4)%4;ctx.fillRect(X+((o*4)%14),Y+4,4,1);ctx.fillRect(X+((o*4+7)%14),Y+11,4,1);break;}
  case 'C':ctx.fillStyle='#6d6458';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#000';ctx.fillRect(X+2,Y+5,12,11);ctx.fillRect(X+4,Y+3,8,2);break;
  case 'S':ctx.fillStyle='#b07a44';ctx.fillRect(X,Y+2,TS,14);ctx.fillStyle='#d9a066';ctx.fillRect(X,Y+2,TS,3);ctx.fillStyle='#7a4f2a';ctx.fillRect(X,Y+15,TS,1);break;
  case 'D':ctx.fillStyle='#4a4466';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#7a4a22';ctx.fillRect(X+1,Y+1,14,14);ctx.fillStyle='#5a3418';ctx.fillRect(X+7,Y+1,2,14);ctx.fillStyle='#ffd23a';ctx.fillRect(X+5,Y+6,6,5);ctx.fillStyle='#000';ctx.fillRect(X+7,Y+7,2,3);break;
  case 'B':ctx.fillStyle='#4a4466';ctx.fillRect(X,Y,TS,TS);ctx.fillStyle='#8e1f24';ctx.fillRect(X+1,Y+1,14,14);ctx.fillStyle='#ff5a3a';ctx.fillRect(X+4,Y+4,3,3);ctx.fillRect(X+9,Y+4,3,3);ctx.fillStyle='#ffd23a';ctx.fillRect(X+5,Y+9,6,5);break;
 }}
function drawRoom(){for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)tile(room.grid[y][x],x,y,room.area);
 if(roomId==='shop')text("MO'S SHOP",128,4,8,'#ffd23a','center');}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(Math.round(x-w/2),Math.round(y),w,2);}
function drawEnt(e){
 const fl=e.inv&&(e.inv>>1)%2;
 switch(e.type){
  case 'gloop':{const cyc=e.mini?36:50,ph=e.t%cyc,hop=ph<18?Math.sin(ph/18*Math.PI)*4:0;const pal=fl?flash(S.gloop.pal):S.gloop.pal;
   if(e.mini){shadow(e.x+8,e.y+14,8);ctx.imageSmoothingEnabled=false;ctx.drawImage(spr(S.gloop.rows,pal),Math.round(e.x+3),Math.round(e.y+5-hop),10,10);}
   else{shadow(e.x+8,e.y+15,10);draw(S.gloop.rows,pal,e.x,e.y-hop);}break;}
  case 'flap':shadow(e.x+8,e.y+18,6);draw(S.flap.frames[(e.t>>3)%2],fl?flash(S.flap.pal):S.flap.pal,e.x,e.y);break;
  case 'rattle':if(e.bones){const sh=e.bones<25?(e.bones%4<2?1:-1):0;ctx.imageSmoothingEnabled=false;ctx.drawImage(spr(S.rattle.rows,S.rattle.pal),Math.round(e.x+sh),Math.round(e.y+10),16,6);}
   else{shadow(e.x+8,e.y+15,10);draw(S.rattle.rows,fl?flash(S.rattle.pal):e.rebuilt?REB:S.rattle.pal,e.x,e.y-((e.t>>4)%2));}break;
  case 'spore':{const near=Math.hypot(P.x-e.x,P.y-e.y)<72,sh=near&&(e.t%110)>95?((e.t>>1)%2?1:-1):0;shadow(e.x+8,e.y+15,10);draw(S.spore.rows,fl?flash(S.spore.pal):S.spore.pal,e.x+sh,e.y);break;}
  case 'cloud':ctx.fillStyle='rgba(235,190,255,'+(e.l/100+.2)+')';ctx.fillRect(Math.round(e.x-3),Math.round(e.y-3),6,6);ctx.fillRect(Math.round(e.x-4),Math.round(e.y-1),8,2);break;
  case 'boss':{if(e.state==='dying'&&(e.t>>2)%2)break;
   ctx.fillStyle='rgba(0,0,0,.4)';const sw=Math.max(16,44-e.z/2);ctx.fillRect(Math.round(e.x+32-sw/2),Math.round(e.y+58),Math.round(sw),4);
   let pal=S.boss.pal;if(e.state==='stuck'&&(frame>>3)%2)pal=S.boss.palB;if(fl)pal=flash(S.boss.pal);
   draw(S.boss.rows,pal,e.x,e.y-e.z,2);
   if(e.state==='stuck'){for(let k=0;k<3;k++){const a=frame/10+k*2.1;ctx.fillStyle='#ffe066';ctx.fillRect(Math.round(e.x+32+Math.cos(a)*22),Math.round(e.y+4+Math.sin(a)*4),3,3);}}
   break;}
 }}
const REB=Object.assign({},S.rattle.pal,{w:'#c9c0a6'});
function drawPlayer(){
 if(P.inv&&(P.inv>>2)%2&&state==='play')return;
 shadow(P.x+8,P.y+15,10);
 const sword=()=>{if(P.atk)SW[P.dir].forEach(([a,b,c])=>{ctx.fillStyle=SWPAL[c];ctx.fillRect(Math.round(P.x+a),Math.round(P.y+b),1,1);});};
 if(P.dir==='up')sword();
 draw(HERO[P.dir][P.atk?1:P.step],HERO_PAL,P.x,P.y);
 if(P.dir!=='up')sword();
 if(P.sleepy)text('z',P.x+12,P.y-8-((frame>>4)%2)*2,8,'#ebbeff');
 if(P.pipShow){const a=frame/8;draw(S.pip.rows,S.pip.pal,P.x+Math.cos(a)*14,P.y-6+Math.sin(a)*6);}
}
function drawPick(p){if(p.life&&p.t>p.life-100&&(p.t>>2)%2)return;const bob=Math.sin(p.t/12)*1.5;
 if(p.kind==='shop'){const it=p.item==='refill'?ITEM.heart:p.item==='pip'?ITEM.jar:ITEM.container;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(p.x-4,p.y+12,18,3);draw(it.rows,it.pal,p.x+1,p.y+bob);text(String(p.price),p.x+5,p.y+18,8,P.coins>=p.price?'#ffd23a':'#bbb','center');return;}
 const it=ITEM[p.kind];const big=p.kind==='bigkey'||p.kind==='container';
 if(big){for(let k=0;k<2;k++){const a=frame/12+k*3.14;ctx.fillStyle='#fff7b0';ctx.fillRect(Math.round(p.x+8+Math.cos(a)*12),Math.round(p.y+8+Math.sin(a)*12),2,2);}}
 draw(it.rows,it.pal,p.x,p.y+bob,big?2:1);}
function drawNpc(n){const bob=(frame>>5)%2;shadow(n.x+8,n.y+15,10);draw(S[n.who].rows,S[n.who].pal,n.x,n.y-bob);
 if(n.who==='ori'&&!P.hasSword){const b=(frame>>4)%2;ctx.fillStyle='#fff';ctx.fillRect(n.x+5,n.y-14-b,7,10);text('!',n.x+5,n.y-13-b,8,'#d8322f');}}
function hud(){ctx.fillStyle='#0b0a10';ctx.fillRect(0,0,W,TOP);ctx.fillStyle='#33304a';ctx.fillRect(0,TOP-1,W,1);
 for(let i=0;i<P.maxHp/2;i++){const v=P.hp-i*2,x=4+i*9,y=4;draw(ITEM.heartE.rows,ITEM.heartE.pal,x,y);
  if(v>=2)draw(ITEM.heart.rows,ITEM.heart.pal,x,y);else if(v===1){ctx.drawImage(spr(ITEM.heart.rows,ITEM.heart.pal),0,0,4,8,x,y,4,8);}}
 draw(ITEM.coin.rows,ITEM.coin.pal,112,4);text(String(P.coins),122,4,8,'#fff');
 draw(ITEM.key.rows,ITEM.key.pal,152,4);text(String(P.keys),162,4,8,'#fff');
 if(P.bigKey)draw(ITEM.bigkey.rows,ITEM.bigkey.pal,180,4);
 if(P.hasPip)draw(ITEM.jar.rows,ITEM.jar.pal,194,4);
 if(P.hasSword){ctx.fillStyle='#e8edf6';ctx.fillRect(214,5,1,6);ctx.fillStyle='#ffd23a';ctx.fillRect(212,10,5,1);ctx.fillStyle='#5a3a24';ctx.fillRect(214,11,1,2);}
 const boss=ents.find(e=>e.type==='boss');
 if(boss&&state==='play'){ctx.fillStyle='#000';ctx.fillRect(222,5,30,6);ctx.fillStyle='#ff5a2a';ctx.fillRect(223,6,Math.max(0,28*boss.hp/12),4);}
}
function wrap(t,max){ctx.font='8px '+FONT;const words=t.split(' '),lines=[];let cur='';for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>max&&cur){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);return lines;}
function drawDialog(){const line=dialog.lines[dialog.i].slice(0,dialog.c|0);const y=TOP+112;
 ctx.fillStyle='#0b0a10';ctx.fillRect(8,y,240,58);ctx.strokeStyle='#ece6d6';ctx.lineWidth=2;ctx.strokeRect(9,y+1,238,56);
 wrap(line,224).forEach((l,i)=>text(l,16,y+8+i*12,8,'#fff'));
 if((dialog.c|0)>=dialog.lines[dialog.i].length&&(frame>>4)%2)text('v',236,y+46,8,'#ffd23a');}
function drawMsg(){if(!msgT||dialog)return;const lines=wrap(msg,220);const h=lines.length*11+8;const y=TOP+4;
 ctx.fillStyle='rgba(11,10,16,.85)';ctx.fillRect(14,y,228,h);lines.forEach((l,i)=>text(l,128,y+5+i*11,8,'#ffd23a','center'));}
function drawTitle(){
 for(let y=0;y<12;y++)for(let x=0;x<16;x++){ctx.fillStyle=(x+y)%2?'#1a1726':'#1f1b2d';ctx.fillRect(x*16,y*16,16,16);}
 ctx.globalAlpha=.35;draw(S.boss.rows,S.boss.pal,160,40,3);ctx.globalAlpha=1;
 text('SPHINX',128,20,24,'#ffd23a','center');text('and the Hollow Deep',128,52,8,'#ece6d6','center');
 draw(HERO.down[(frame>>4)%2],HERO_PAL,104,80,3);
 draw(S.gloop.rows,S.gloop.pal,40,120);draw(S.flap.frames[(frame>>3)%2],S.flap.pal,52,92);draw(S.rattle.rows,S.rattle.pal,200,124);
 if((frame>>5)%2)text('PRESS SPACE OR TAP A',128,150,8,'#fff','center');
 text('Arrows: walk   Space: sword',128,170,8,'#a49cb8','center');}
function drawOver(){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);text('OH NO!',128,70,16,'#d8322f','center');text('Sphinx needs a rest.',128,96,8,'#fff','center');
 if(overT>40&&(frame>>5)%2)text('PRESS SPACE TO TRY AGAIN',128,130,8,'#ffd23a','center');}
function drawWin(){ctx.fillStyle='rgba(11,10,16,.88)';ctx.fillRect(0,0,W,H);text('YOU WIN!',128,30,16,'#ffd23a','center');
 draw(HERO.down[(frame>>4)%2],HERO_PAL,92,52,2);draw(S.pip.rows,S.pip.pal,130+Math.sin(frame/15)*6,50+Math.cos(frame/15)*4,2);
 text('Sphinx saved the Hollow Deep!',128,96,8,'#fff','center');
 const secs=Math.round((endF-startF)/60);text('Time: '+Math.floor(secs/60)+'m '+(secs%60)+'s',128,116,8,'#a49cb8','center');
 text('Coins: '+P.coins+'   Hearts: '+P.maxHp/2,128,130,8,'#a49cb8','center');
 if((frame>>5)%2)text('PRESS SPACE TO PLAY AGAIN',128,160,8,'#ffd23a','center');}
function render(){
 ctx.save();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 if(state==='title'){drawTitle();ctx.restore();return;}
 const sx=shake?((Math.random()*4|0)-2):0,sy=shake?((Math.random()*4|0)-2):0;
 ctx.save();ctx.translate(sx,TOP+sy);
 drawRoom();
 picks.forEach(drawPick);
 for(const w of waves){ctx.strokeStyle='rgba(255,155,46,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(w.x,w.y,w.r,w.r*.55,0,0,Math.PI*2);ctx.stroke();}
 const list=[];npcs.forEach(n=>list.push({y:n.y+16,f:()=>drawNpc(n)}));
 ents.forEach(e=>list.push({y:e.type==='boss'?e.y+60:e.type==='cloud'?999:e.y+16,f:()=>drawEnt(e)}));
 list.push({y:P.y+16,f:drawPlayer});list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),2,2);}
 ctx.restore();
 hud();
 if(fadeT){ctx.fillStyle='rgba(0,0,0,'+(fadeT/10)+')';ctx.fillRect(0,TOP,W,H-TOP);}
 if(dialog)drawDialog();drawMsg();
 if(state==='over')drawOver();
 if(state==='win')drawWin();
 ctx.restore();}

// ================= LOOP =================
function tick(){frame++;if(msgT)msgT--;if(shake)shake--;if(fadeT)fadeT--;
 if(state==='title'){if(pressA){initAudio();newGame();}}
 else if(state==='play'){
  if(dialog)updDialog();
  else{updPlayer();if(state==='play'){updEnemies();updPicks();updWaves();}
   if(winT){winT++;if(winT>220&&state==='play'){state='win';endF=frame;playSong('over');}}}
  updParts();}
 else if(state==='over'){overT++;if(overT>40&&pressA)respawn();}
 else if(state==='win'){if(pressA)newGame();}
 pressA=false;}
let acc=0,last=performance.now();
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){tick();acc-=1000/60;}render();requestAnimationFrame(loop);}

// ================= INPUT =================
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function aDown(){initAudio();if(!holdA)pressA=true;holdA=true;}
function aUp(){holdA=false;}
addEventListener('keydown',e=>{
 if(KMAP[e.code]){KEY[KMAP[e.code]]=1;e.preventDefault();}
 if(e.code==='Space'||e.code==='Enter'||e.code==='KeyJ'||e.code==='KeyZ'){if(e.target.tagName!=='BUTTON'||e.code==='Space'){aDown();e.preventDefault();}}
 if(e.code==='KeyM'){initAudio();setMute(!muted);}});
addEventListener('keyup',e=>{if(KMAP[e.code])KEY[KMAP[e.code]]=0;if(e.code==='Space'||e.code==='Enter'||e.code==='KeyJ'||e.code==='KeyZ')aUp();});
addEventListener('blur',()=>{for(const k in KEY)KEY[k]=0;holdA=false;});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();KEY[k]=1;});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{KEY[k]=0;}));});
const ab=document.getElementById('abtn');
ab.addEventListener('pointerdown',e=>{e.preventDefault();aDown();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>ab.addEventListener(ev,aUp));
cv.addEventListener('pointerdown',()=>{cv.focus();if(state!=='play'){aDown();setTimeout(aUp,50);}});
document.getElementById('mute').addEventListener('click',()=>{initAudio();setMute(!muted);});

requestAnimationFrame(loop);
</script>
