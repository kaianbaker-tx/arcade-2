<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HamMan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a game-show screen — chunky white header card, the board in a puffy card, big candy buttons below. Single bright look on purple. */
:root{
  --grape:#7b4bf0;
  --grape-deep:#5a2fc9;
  --card:#ffffff;
  --card-edge:#d9ccff;
  --ink:#2c1a5e;
  --muted:#7a68ad;
  --coin:#ffc53d;
  --mint:#27d69a;
  --rose:#ff5c8a;
  --sky:#38b6ff;
  --display:"Titan One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;box-sizing:border-box;padding-inline:16px;padding-block:14px;
  background-color:var(--grape);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 22px,transparent 22px 44px);
  color:var(--ink);font-family:var(--body);font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-user-select:none;user-select:none;overflow:hidden}
.bar{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--card);border-radius:16px;padding:8px 14px;box-shadow:0 6px 0 var(--grape-deep);box-sizing:border-box}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--ink)}
.stat.r{align-items:flex-end}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--grape);text-align:center;line-height:1;
  text-shadow:0 3px 0 var(--card-edge);letter-spacing:.01em}
#lives{display:flex;gap:4px;height:16px;align-items:center;justify-content:center;margin-top:3px}
#lives i{width:14px;height:14px;background:var(--rose);display:block;border-radius:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.stage{position:relative;width:100%;max-width:520px;flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:flex-start}
canvas{display:block;touch-action:none;border-radius:18px;background:var(--card);box-shadow:0 0 0 6px var(--card),0 12px 0 var(--grape-deep)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;pointer-events:none}
.overlay .big{font-family:var(--display);font-size:clamp(26px,8vw,40px);color:#fff;background:var(--grape);
  padding:10px 22px;border-radius:18px;box-shadow:0 6px 0 var(--grape-deep);-webkit-text-stroke:0}
.overlay .small{font-size:13px;letter-spacing:.04em;color:var(--ink);background:var(--card);padding:8px 14px;border-radius:12px;box-shadow:0 4px 0 var(--card-edge)}
[hidden]{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font-family:var(--display);font-size:15px;color:#fff;background:var(--sky);border:0;border-radius:12px;padding:9px 16px 11px;cursor:pointer;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);transition:transform .08s,filter .12s}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#pauseBtn{background:var(--coin);color:var(--ink)}
#soundBtn{background:var(--mint)}
#restartBtn{background:var(--rose)}
.pad{display:none;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,54px);gap:8px}
.pad button{font-size:22px;padding:0;touch-action:manipulation;background:var(--card);color:var(--grape);box-shadow:inset 0 -5px 0 var(--card-edge)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .rr{grid-column:3;grid-row:2}
@media (pointer:coarse){.pad{display:grid}.keys{display:none}}
.keys{font-size:14px;color:#efe8ff;text-align:center;max-width:52ch;margin:0;font-weight:700}
.keys b{color:#fff;font-weight:900}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>

<div class="bar">
  <div class="stat"><span class="k">Score</span><span class="v" id="score">0</span></div>
  <div class="stat" style="align-items:center"><h1>HamMan</h1><div id="lives"></div></div>
  <div class="stat r"><span class="k">Best · Lvl <span id="lvl">1</span></span><span class="v" id="best">0</span></div>
</div>

<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="overlay" id="ov"><div class="big" id="ovBig">Ready?</div><div class="small" id="ovSmall">Press an arrow or tap to start</div></div>
</div>

<div class="pad" id="pad">
  <button class="u" data-d="up" aria-label="Up">▲</button>
  <button class="l" data-d="left" aria-label="Left">◀</button>
  <button class="d" data-d="down" aria-label="Down">▼</button>
  <button class="rr" data-d="right" aria-label="Right">▶</button>
</div>
<div class="row">
  <button id="pauseBtn">Pause</button>
  <button id="soundBtn">Sound: on</button>
  <button id="restartBtn">Restart</button>
</div>
<p class="keys"><b>Arrows / WASD</b> to move · <b>P</b> to pause · Swipe on the maze works too. Help HamMan collect every coin, grab a gem to scare the fox, frog, panda and bunny, then catch them for bonus points.</p>

<script>
(()=>{
const MAP=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#.......#....#",
"####.### # ###.####",
"   #.#       #.#   ",
"####.# ##-## #.####",
"    .  #   #  .    ",
"####.# ##### #.####",
"   #.#       #.#   ",
"####.# ##### #.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const ROWS=MAP.length, COLS=MAP[0].length;
const DIRS={up:{x:0,y:-1},left:{x:-1,y:0},down:{x:0,y:1},right:{x:1,y:0}};
const ORDER=['up','left','down','right'];
const OPP={up:'down',down:'up',left:'right',right:'left'};
const BOTS=[
  {name:'Rivet',kind:'fox',color:'#ff8a3d',shade:'#dd6517',home:[9,7],corner:[COLS-2,-2],release:0},
  {name:'Sprocket',kind:'bunny',color:'#ffb3d1',shade:'#f07aa8',home:[9,9],corner:[1,-2],release:1.5},
  {name:'Gizmo',kind:'frog',color:'#5fd35a',shade:'#3aa83a',home:[8,9],corner:[COLS-1,ROWS],release:5},
  {name:'Bolt',kind:'panda',color:'#ffffff',shade:'#cfc8e6',home:[10,9],corner:[0,ROWS],release:9}
];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let T=20, grid, pelletsLeft, score=0, best=0, lives=3, level=1;
let hero, bots, mode, modeTimer, modeIdx, fright=0, frightCombo=0, state='ready', stateTimer=0, elapsed=0, popups=[];
let want=null, sound=true, audio=null;
try{best=+localStorage.getItem('blokchase-best')||0}catch(e){}

function tile(c,r){ if(r<0||r>=ROWS) return '#'; c=((c%COLS)+COLS)%COLS; return MAP[r][c]; }
function cell(c,r){ if(r<0||r>=ROWS) return '#'; c=((c%COLS)+COLS)%COLS; return grid[r][c]; }

function resetGrid(){
  grid=MAP.map(r=>r.split('').map(ch=>ch==='P'?' ':ch));
  pelletsLeft=0; grid.forEach(r=>r.forEach(ch=>{if(ch==='.'||ch==='o')pelletsLeft++}));
}
function speeds(){ const b=Math.min(level-1,6)*0.35; return {hero:6.6+b*0.6, bot:6.0+b, fright:3.6, eyes:13, frightTime:Math.max(2.2,7-level*0.8)}; }
function resetActors(){
  hero={x:9,y:15,dir:null,face:'left',mouth:0};
  bots=BOTS.map((b,i)=>({...b,x:b.home[0],y:b.home[1],dir:i===0?'left':null,state:i===0?'active':'house',wait:b.release,bob:i}));
  want=null; mode='scatter'; modeIdx=0; modeTimer=7; fright=0;
}
function newGame(){ score=0;lives=3;level=1;resetGrid();resetActors();state='ready';show('Ready?','Press an arrow or tap to start');hud(); }

function passableHero(c,r){ const t=tile(c,r); return t!=='#'&&t!=='-'; }
function passableBot(b,c,r){ const t=tile(c,r); if(t==='#')return false; if(t==='-')return b.state==='leaving'||b.state==='eyes'; return true; }

function advance(e,d,choose){
  let guard=0;
  while(d>1e-6&&guard++<20){
    const rx=Math.round(e.x), ry=Math.round(e.y);
    if(Math.abs(e.x-rx)<1e-6&&Math.abs(e.y-ry)<1e-6){
      e.x=rx;e.y=ry;
      if(e.x<-0.5)e.x+=COLS; if(e.x>COLS-0.5)e.x-=COLS;
      if(choose(e)===false||!e.dir) return;
    }
    const v=DIRS[e.dir];
    let rem = v.x ? (v.x>0? Math.ceil(e.x+1e-9)-e.x : e.x-Math.floor(e.x-1e-9)) : (v.y>0? Math.ceil(e.y+1e-9)-e.y : e.y-Math.floor(e.y-1e-9));
    if(rem<1e-6) rem=1;
    const s=Math.min(d,rem); e.x+=v.x*s; e.y+=v.y*s; d-=s;
    if(e.x<-0.5)e.x+=COLS; if(e.x>COLS-0.5)e.x-=COLS;
  }
}

function heroChoose(e){
  const c=Math.round(e.x),r=Math.round(e.y);
  eat(c,r);
  if(want&&passableHero(c+DIRS[want].x,r+DIRS[want].y)) e.dir=want;
  else if(e.dir&&!passableHero(c+DIRS[e.dir].x,r+DIRS[e.dir].y)) e.dir=null;
  if(e.dir) e.face=e.dir;
}

function botTarget(b){
  const hx=Math.round(hero.x),hy=Math.round(hero.y);
  if(b.state==='eyes') return [9,9];
  if(b.state==='leaving') return [9,7];
  if(mode==='scatter') return b.corner;
  const hd=DIRS[hero.face]||{x:0,y:0};
  switch(b.name){
    case 'Rivet': return [hx,hy];
    case 'Sprocket': return [hx+hd.x*4,hy+hd.y*4];
    case 'Gizmo': { const r=bots[0]; const px=hx+hd.x*2,py=hy+hd.y*2; return [px*2-Math.round(r.x),py*2-Math.round(r.y)]; }
    default: { const dd=Math.hypot(b.x-hx,b.y-hy); return dd>7?[hx,hy]:b.corner; }
  }
}
function botChoose(b){
  const c=Math.round(b.x),r=Math.round(b.y);
  if(b.state==='leaving'&&c===9&&r===7){ b.state='active'; b.dir='left'; }
  if(b.state==='eyes'&&c===9&&r===9){ b.state='leaving'; }
  const allowRev = b.state==='leaving'||b.state==='eyes'||!b.dir;
  let opts=ORDER.filter(k=>(allowRev||k!==OPP[b.dir])&&passableBot(b,c+DIRS[k].x,r+DIRS[k].y));
  if(!opts.length) opts=ORDER.filter(k=>passableBot(b,c+DIRS[k].x,r+DIRS[k].y));
  if(!opts.length){ b.dir=null; return false; }
  if(fright>0&&b.state==='active'&&!b.eaten){ b.dir=opts[Math.floor(Math.random()*opts.length)]; return; }
  const [tx,ty]=botTarget(b);
  let bestK=opts[0],bd=Infinity;
  for(const k of opts){ const nx=c+DIRS[k].x,ny=r+DIRS[k].y; const dd=(nx-tx)**2+(ny-ty)**2; if(dd<bd){bd=dd;bestK=k;} }
  b.dir=bestK;
}

function eat(c,r){
  const ch=cell(c,r);
  if(ch==='.'){ grid[r][((c%COLS)+COLS)%COLS]=' '; score+=10; pelletsLeft--; beep(520+(pelletsLeft%2)*90,.04,'square',.03); }
  else if(ch==='o'){ grid[r][((c%COLS)+COLS)%COLS]=' '; score+=50; pelletsLeft--; startFright(); }
  if(ch==='.'||ch==='o'){ hud(); if(pelletsLeft<=0){ state='clear'; stateTimer=2; show('Level Clear!',''); beep(880,.25,'triangle',.06);} }
}
function startFright(){
  fright=speeds().frightTime; frightCombo=0;
  bots.forEach(b=>{ b.eaten=false; if(b.state==='active'&&b.dir){ b.dir=OPP[b.dir]; } });
  beep(220,.2,'sawtooth',.04);
}

function update(dt){
  elapsed+=dt;
  popups=popups.filter(p=>(p.t-=dt)>0);
  if(state==='dying'){ stateTimer-=dt; if(stateTimer<=0){ if(lives<=0){ state='over'; saveBest(); show('Game Over','Tap or press an arrow to play again'); } else { resetActors(); state='ready'; show('Ready?','Press an arrow or tap'); } } return; }
  if(state==='clear'){ stateTimer-=dt; if(stateTimer<=0){ level++; resetGrid(); resetActors(); hud(); state='ready'; show('Level '+level,'Press an arrow or tap'); } return; }
  if(state!=='play') return;
  const sp=speeds();
  if(fright>0){ fright-=dt; if(fright<=0){ fright=0; bots.forEach(b=>b.eaten=false); } }
  else { modeTimer-=dt; if(modeTimer<=0){ modeIdx++; const sched=[7,20,7,20,5,9999]; mode=modeIdx%2?'chase':'scatter'; modeTimer=sched[Math.min(modeIdx,sched.length-1)]; bots.forEach(b=>{ if(b.state==='active'&&b.dir) b.dir=OPP[b.dir]; }); } }

  // hero: allow instant reverse mid-tile
  if(want&&hero.dir&&want===OPP[hero.dir]){ hero.dir=want; hero.face=want; }
  if(!hero.dir) heroChoose(hero);
  const moving=!!hero.dir;
  advance(hero,sp.hero*dt,heroChoose);
  hero.mouth = moving ? (hero.mouth+dt*10)%(Math.PI*2) : hero.mouth;

  for(const b of bots){
    if(b.state==='house'){ b.wait-=dt; if(b.wait<=0){ b.state='leaving'; b.dir=null; } else continue; }
    const tunnel = Math.round(b.y)===9&&(b.x<4||b.x>14);
    let s = b.state==='eyes'?sp.eyes : (fright>0&&!b.eaten&&b.state==='active')?sp.fright : sp.bot;
    if(tunnel&&b.state!=='eyes') s*=0.55;
    if(b.state==='leaving') s=sp.bot*0.7;
    advance(b,s*dt,botChoose);
  }
  // collisions
  for(const b of bots){
    if(b.state!=='active') continue;
    let dx=Math.abs(b.x-hero.x); dx=Math.min(dx,COLS-dx);
    if(dx+Math.abs(b.y-hero.y)<0.7){
      if(fright>0&&!b.eaten){
        frightCombo++; const pts=200*2**(frightCombo-1); score+=pts; hud();
        popups.push({x:b.x,y:b.y,t:1,txt:pts});
        b.state='eyes'; b.eaten=true; b.x=Math.round(b.x); b.y=Math.round(b.y); b.dir=null;
        beep(660,.12,'square',.05); setTimeout(()=>beep(990,.12,'square',.05),90);
      } else {
        lives--; hud(); state='dying'; stateTimer=1.4; beep(160,.5,'sawtooth',.06); return;
      }
    }
  }
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function isWall(c,r){ return r>=0&&r<ROWS&&c>=0&&c<COLS&&MAP[r][c]==='#'; }
function wallLayer(dy,color,inset){
  ctx.fillStyle=color;
  const p=T*inset, rad=T*0.32;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!isWall(c,r)) continue;
    const x=c*T, y=r*T+dy;
    rr(x+p,y+p,T-2*p,T-2*p,rad); ctx.fill();
    if(isWall(c+1,r)) ctx.fillRect(x+T/2,y+p,T,T-2*p);
    if(isWall(c,r+1)) ctx.fillRect(x+p,y+T/2,T-2*p,T);
  }
}
function drawMaze(){
  // board floor with a soft checker
  ctx.fillStyle='#f4efff'; ctx.fillRect(0,0,COLS*T,ROWS*T);
  ctx.fillStyle='#ece4ff';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if((r+c)%2===0) ctx.fillRect(c*T,r*T,T,T);
  // chunky 3D walls: shadow lip, then face, then shine
  wallLayer(T*0.14,'#5a2fc9',0.1);
  wallLayer(0,'#8e5cff',0.1);
  ctx.globalAlpha=.35; wallLayer(-T*0.02,'#c4a6ff',0.26); ctx.globalAlpha=1;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=grid[r][c], x=c*T+T/2, y=r*T+T/2;
    if(ch==='-'){
      ctx.fillStyle='#ff5c8a'; rr(c*T,r*T+T*0.4,T,T*0.2,T*0.1); ctx.fill();
    } else if(ch==='.'){
      const rad=Math.max(2,T*0.15);
      ctx.fillStyle='#e0a100'; circ(x,y+rad*0.25,rad);
      ctx.fillStyle='#ffc53d'; circ(x,y,rad);
      ctx.fillStyle='#fff3c4'; circ(x-rad*0.35,y-rad*0.35,rad*0.3);
    } else if(ch==='o'){
      const bob=Math.sin(elapsed*5+c)*T*0.06, s=T*0.34;
      ctx.save(); ctx.translate(x,y+bob);
      ctx.fillStyle='#1e8fd6'; ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,-s*0.2); ctx.lineTo(0,s*1.1); ctx.lineTo(-s,-s*0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#38b6ff'; ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,-s*0.2); ctx.lineTo(0,s*0.5); ctx.lineTo(-s,-s*0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#d8f1ff'; ctx.beginPath(); ctx.moveTo(-s*0.2,-s*0.75); ctx.lineTo(s*0.25,-s*0.75); ctx.lineTo(0,-s*0.3); ctx.closePath(); ctx.fill();
      const tw=(Math.sin(elapsed*7+r)+1)/2; ctx.globalAlpha=tw; ctx.fillStyle='#fff';
      ctx.fillRect(s*0.7,-s*1.05,T*0.06,T*0.2); ctx.fillRect(s*0.62,-s*0.97,T*0.2,T*0.06); ctx.globalAlpha=1;
      ctx.restore();
    }
  }
}
function eyes(lx,rx,y,size,d,pupilColor){
  ctx.fillStyle='#fff'; circ(lx,y,size); circ(rx,y,size);
  const px=d.x*size*0.35, py=d.y*size*0.35;
  ctx.fillStyle=pupilColor||'#2c1a5e'; circ(lx+px,y+py,size*0.55); circ(rx+px,y+py,size*0.55);
  ctx.fillStyle='#fff'; circ(lx+px-size*0.18,y+py-size*0.2,size*0.18); circ(rx+px-size*0.18,y+py-size*0.2,size*0.18);
}
function drawHero(){
  const cx=hero.x*T+T/2, cy=hero.y*T+T/2, s=T*0.9, h=s/2;
  ctx.save(); ctx.translate(cx,cy);
  let scale=1; if(state==='dying'){ scale=Math.max(0,stateTimer/1.4); ctx.rotate((1-scale)*6); }
  const squish = state==='play'&&hero.dir ? 1+Math.sin(hero.mouth*2)*0.04 : 1;
  ctx.scale(scale*squish,scale/squish);
  const fur='#f5a742', furDark='#d27a1c', cream='#fff1dc', ink='#2c1a5e';
  // round ears
  ctx.fillStyle=furDark; circ(-h*0.62,-h*0.78,h*0.3); circ(h*0.62,-h*0.78,h*0.3);
  ctx.fillStyle='#ffb3c6'; circ(-h*0.62,-h*0.78,h*0.16); circ(h*0.62,-h*0.78,h*0.16);
  // chubby body
  ctx.fillStyle=furDark; rr(-h,-h+T*0.08,s,s-T*0.02,[T*0.42,T*0.42,T*0.3,T*0.3]); ctx.fill();
  ctx.fillStyle=fur; rr(-h,-h,s,s-T*0.08,[T*0.42,T*0.42,T*0.3,T*0.3]); ctx.fill();
  // cream face patch
  ctx.fillStyle=cream; ctx.beginPath(); ctx.ellipse(0,h*0.25,h*0.78,h*0.55,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(-s*0.22,-s*0.32,T*0.1,T*0.05,-0.4,0,Math.PI*2); ctx.fill();
  const d=DIRS[hero.face]||{x:-1,y:0};
  const fx=d.x*T*0.05, fy=d.y*T*0.04;
  eyes(-T*0.16+fx,T*0.16+fx,-T*0.1+fy,T*0.11,d);
  // puffy cheeks grow as it chomps
  const chomp=Math.abs(Math.sin(hero.mouth));
  ctx.fillStyle='rgba(255,120,150,.5)'; circ(-h*0.62+fx,h*0.2+fy,T*0.07+chomp*T*0.02); circ(h*0.62+fx,h*0.2+fy,T*0.07+chomp*T*0.02);
  // nose + mouth + buck teeth
  ctx.fillStyle='#f0507f'; ctx.beginPath(); ctx.ellipse(fx,h*0.1+fy,T*0.05,T*0.035,0,0,Math.PI*2); ctx.fill();
  const open=chomp*T*0.09+T*0.02;
  ctx.fillStyle='#8a2b3d'; ctx.beginPath(); ctx.ellipse(fx,h*0.34+fy+open*0.4,T*0.09,open,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; rr(fx-T*0.05,h*0.22+fy,T*0.1,T*0.08,T*0.02); ctx.fill();
  ctx.strokeStyle='rgba(44,26,94,.35)'; ctx.lineWidth=Math.max(1,T*0.02); ctx.beginPath(); ctx.moveTo(fx,h*0.22+fy); ctx.lineTo(fx,h*0.22+fy+T*0.08); ctx.stroke();
  // little paws
  ctx.fillStyle=furDark; rr(-s*0.36,h-T*0.08,T*0.2,T*0.1,T*0.05); ctx.fill(); rr(s*0.36-T*0.2,h-T*0.08,T*0.2,T*0.1,T*0.05); ctx.fill();
  ctx.restore();
}
function tri(x1,y1,x2,y2,x3,y3){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); ctx.fill(); }
function drawBot(b){
  const bobY = b.state==='house'? Math.sin(elapsed*5+b.bob)*T*0.12 : Math.sin(elapsed*9+b.bob)*T*0.03;
  const cx=b.x*T+T/2, cy=b.y*T+T/2+bobY, s=T*0.88, h=s/2;
  const scared=fright>0&&!b.eaten&&(b.state==='active');
  const flash=scared&&fright<1.8&&Math.floor(elapsed*8)%2===0;
  const d=DIRS[b.dir]||{x:0,y:0};
  const k=b.kind;
  const body = scared?(flash?'#ffffff':'#8fd3ff'):b.color;
  const shade = scared?(flash?'#d9ccff':'#4aa8e6'):b.shade;
  const ink='#2c1a5e';
  ctx.save(); ctx.translate(cx,cy);
  if(b.state!=='eyes'){
    // ears behind the head
    if(k==='fox'){
      ctx.fillStyle=shade; tri(-h*0.95,-h*0.2,-h*0.75,-h*1.35,-h*0.1,-h*0.75); tri(h*0.95,-h*0.2,h*0.75,-h*1.35,h*0.1,-h*0.75);
      ctx.fillStyle=scared?'#d8f1ff':'#fff1e6'; tri(-h*0.72,-h*0.5,-h*0.66,-h*1.05,-h*0.3,-h*0.72); tri(h*0.72,-h*0.5,h*0.66,-h*1.05,h*0.3,-h*0.72);
    } else if(k==='bunny'){
      const wig=Math.sin(elapsed*6+b.bob)*0.12;
      for(const sd of [-1,1]){ ctx.save(); ctx.translate(sd*h*0.38,-h*0.7); ctx.rotate(sd*(0.15+wig));
        ctx.fillStyle=shade; ctx.beginPath(); ctx.ellipse(0,-h*0.55,h*0.24,h*0.62,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=scared?'#d8f1ff':'#ffe3ee'; ctx.beginPath(); ctx.ellipse(0,-h*0.5,h*0.11,h*0.42,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    } else if(k==='panda'){
      ctx.fillStyle=scared?shade:'#2c2640'; circ(-h*0.68,-h*0.78,h*0.3); circ(h*0.68,-h*0.78,h*0.3);
    } else if(k==='frog'){
      ctx.fillStyle=shade; circ(-h*0.45,-h*0.8,h*0.36); circ(h*0.45,-h*0.8,h*0.36);
      ctx.fillStyle=body; circ(-h*0.45,-h*0.86,h*0.33); circ(h*0.45,-h*0.86,h*0.33);
    }
    // head/body blob
    ctx.fillStyle=shade; rr(-h,-h+T*0.08,s,s-T*0.02,[T*0.4,T*0.4,T*0.2,T*0.2]); ctx.fill();
    ctx.fillStyle=body; rr(-h,-h,s,s-T*0.08,[T*0.4,T*0.4,T*0.2,T*0.2]); ctx.fill();
    // markings
    if(!scared){
      if(k==='fox'){ ctx.fillStyle='#fff1e6'; ctx.beginPath(); ctx.ellipse(0,h*0.35,h*0.6,h*0.42,0,0,Math.PI*2); ctx.fill(); }
      if(k==='panda'){ ctx.fillStyle='#2c2640'; ctx.save(); ctx.translate(-h*0.36,-h*0.12); ctx.rotate(0.5); ctx.beginPath(); ctx.ellipse(0,0,h*0.24,h*0.32,0,0,Math.PI*2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(h*0.36,-h*0.12); ctx.rotate(-0.5); ctx.beginPath(); ctx.ellipse(0,0,h*0.24,h*0.32,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
      if(k==='frog'){ ctx.fillStyle='#b8f0a8'; ctx.beginPath(); ctx.ellipse(0,h*0.45,h*0.55,h*0.3,0,0,Math.PI*2); ctx.fill(); }
    }
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-s*0.22,-s*0.3,T*0.1,T*0.05,-0.4,0,Math.PI*2); ctx.fill();
    // feet
    const step=Math.floor(elapsed*8)%2;
    ctx.fillStyle=k==='panda'&&!scared?'#2c2640':shade;
    rr(-s*0.38,h-T*0.1+(step?T*0.03:0),T*0.22,T*0.12,T*0.06); ctx.fill();
    rr(s*0.38-T*0.22,h-T*0.1+(step?0:T*0.03),T*0.22,T*0.12,T*0.06); ctx.fill();
  }
  if(scared){
    ctx.fillStyle=ink; circ(-T*0.15,-T*0.06,T*0.06); circ(T*0.15,-T*0.06,T*0.06);
    ctx.strokeStyle=ink; ctx.lineWidth=Math.max(1.5,T*0.05); ctx.lineCap='round'; ctx.beginPath();
    for(let i=0;i<=4;i++){ const x=-T*0.2+i*T*0.1, y=T*0.16+(i%2?-1:1)*T*0.04; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
    ctx.fillStyle='#d8f1ff'; ctx.beginPath(); ctx.ellipse(h*0.75,-h*0.55,T*0.04,T*0.07,0,0,Math.PI*2); ctx.fill(); // sweat drop
  } else {
    // eyes: frogs keep theirs up in the bumps
    if(k==='frog'&&b.state!=='eyes') eyes(-h*0.45,h*0.45,-h*0.86,T*0.1,d);
    else eyes(-T*0.15,T*0.15,-T*0.06,T*0.11,d);
    if(b.state!=='eyes'){
      ctx.fillStyle=ink;
      if(k==='fox'){ circ(0,h*0.2,T*0.055); ctx.strokeStyle=ink; ctx.lineWidth=Math.max(1.2,T*0.035); ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(-T*0.06,h*0.3,T*0.06,0.2,Math.PI-0.4); ctx.stroke(); ctx.beginPath(); ctx.arc(T*0.06,h*0.3,T*0.06,0.4,Math.PI-0.2); ctx.stroke(); }
      else if(k==='bunny'){ ctx.fillStyle='#f0507f'; tri(-T*0.05,h*0.14,T*0.05,h*0.14,0,h*0.24);
        ctx.fillStyle='#fff'; rr(-T*0.05,h*0.3,T*0.1,T*0.08,T*0.02); ctx.fill();
        ctx.fillStyle='rgba(240,80,127,.45)'; circ(-h*0.6,h*0.2,T*0.06); circ(h*0.6,h*0.2,T*0.06); }
      else if(k==='frog'){ ctx.strokeStyle=ink; ctx.lineWidth=Math.max(1.4,T*0.04); ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(0,-h*0.05,h*0.5,0.35,Math.PI-0.35); ctx.stroke();
        ctx.fillStyle='rgba(255,92,138,.5)'; circ(-h*0.62,h*0.15,T*0.06); circ(h*0.62,h*0.15,T*0.06); }
      else if(k==='panda'){ ctx.beginPath(); ctx.ellipse(0,h*0.22,T*0.07,T*0.045,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=ink; ctx.lineWidth=Math.max(1.2,T*0.035); ctx.beginPath(); ctx.moveTo(0,h*0.25); ctx.lineTo(0,h*0.38); ctx.stroke(); }
    }
  }
  ctx.restore();
}
function draw(){
  drawMaze();
  for(const b of bots) drawBot(b);
  if(state!=='over') drawHero();
  ctx.font=`${Math.round(T*0.7)}px "Titan One", system-ui, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round';
  for(const p of popups){ const y=p.y*T+T/2-(1-p.t)*T*0.9; ctx.lineWidth=T*0.18; ctx.strokeStyle='#5a2fc9'; ctx.strokeText('+'+p.txt,p.x*T+T/2,y); ctx.fillStyle='#ffc53d'; ctx.fillText('+'+p.txt,p.x*T+T/2,y); }
}

/* ---------- loop, sizing, ui ---------- */
let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(frame); }
function fit(){
  const st=$('stage'); const w=st.clientWidth, h=Math.max(200,st.clientHeight||window.innerHeight*0.6);
  T=Math.max(10,Math.floor(Math.min(w/COLS,h/ROWS)));
  const dpr=window.devicePixelRatio||1;
  cv.width=COLS*T*dpr; cv.height=ROWS*T*dpr; cv.style.width=COLS*T+'px'; cv.style.height=ROWS*T+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function hud(){
  $('score').textContent=score; if(score>best){best=score;saveBest();} $('best').textContent=best; $('lvl').textContent=level;
  $('lives').innerHTML='<i></i>'.repeat(Math.max(0,lives));
}
function saveBest(){ try{localStorage.setItem('blokchase-best',best)}catch(e){} }
function show(big,small){ $('ov').hidden=false; $('ovBig').textContent=big; $('ovSmall').textContent=small; $('ovSmall').hidden=!small; }
function hide(){ $('ov').hidden=true; }
function go(dir){
  initAudio();
  if(dir) want=dir;
  if(state==='over'){ newGame(); want=dir||null; }
  if(state==='ready'){ state='play'; hide(); }
  else if(state==='paused'){ state='play'; hide(); $('pauseBtn').textContent='Pause'; }
}
function togglePause(){
  if(state==='play'){ state='paused'; show('Paused','Press P or tap to resume'); $('pauseBtn').textContent='Resume'; }
  else if(state==='paused'){ go(null); }
}
const KEY={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{
  if(KEY[e.key]){ e.preventDefault(); go(KEY[e.key]); }
  else if(e.key==='p'||e.key==='P'||e.key==='Escape'){ togglePause(); }
  else if((e.key===' '||e.key==='Enter')&&(state==='ready'||state==='over')&&e.target===document.body){ e.preventDefault(); go(null); }
});
let t0=null;
cv.addEventListener('pointerdown',e=>{ t0={x:e.clientX,y:e.clientY}; if(state!=='play') go(null); });
cv.addEventListener('pointermove',e=>{
  if(!t0) return; const dx=e.clientX-t0.x, dy=e.clientY-t0.y;
  if(Math.hypot(dx,dy)>18){ go(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); t0={x:e.clientX,y:e.clientY}; }
});
addEventListener('pointerup',()=>t0=null);
$('pad').querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();go(b.dataset.d);}));
$('pauseBtn').onclick=togglePause;
$('restartBtn').onclick=()=>{ saveBest(); newGame(); };
$('soundBtn').onclick=()=>{ sound=!sound; $('soundBtn').textContent='Sound: '+(sound?'on':'off'); };

function initAudio(){ if(audio||!sound) return; try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f,dur,type,vol){
  if(!sound||!audio) return;
  try{ const o=audio.createOscillator(),g=audio.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+dur); }catch(e){}
}

addEventListener('resize',fit);
fit(); newGame(); requestAnimationFrame(frame);
})();
</script>
