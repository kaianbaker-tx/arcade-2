<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carrot Patch Pull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen garden — scoreboard sign on top, 4x4 soil patch, single committed daytime-farm look */
:root{
  --sky:#bfe3f2; --grass:#6fb043; --grass-dark:#4e8a2c;
  --soil:#7a4a2b; --soil-dark:#5a331b; --soil-light:#9a6440;
  --carrot:#f07a1a; --carrot-dark:#c95a08; --leaf:#3f9a2e;
  --gold:#f5c518; --wood:#d9a066; --wood-dark:#a8713f; --ink:#3b2414; --paper:#fff6e6;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky) 0 22%, var(--grass) 22% 100%);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);margin:0;color:var(--paper);text-shadow:0 3px 0 var(--carrot-dark),0 5px 0 var(--ink);letter-spacing:.5px;text-wrap:balance;text-align:center}
.sign{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.board{background:var(--wood);border:3px solid var(--wood-dark);border-radius:10px;padding:6px 14px;min-width:78px;text-align:center;box-shadow:0 4px 0 var(--wood-dark)}
.board small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink);opacity:.75}
.board b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
.hearts{font-size:22px;line-height:32px;letter-spacing:2px}
.patch{position:relative;width:min(92vw,58vh,460px);aspect-ratio:1;max-width:100%;background:var(--soil-dark);border-radius:22px;padding:12px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;box-shadow:inset 0 0 0 4px var(--soil),0 8px 0 var(--grass-dark)}
.hole{position:relative;border-radius:50%/42%;background:radial-gradient(ellipse at 50% 62%,#2e1a0c 0 34%,var(--soil) 36% 62%,var(--soil-light) 64% 70%,transparent 72%);cursor:pointer;overflow:hidden;border:none;padding:0;-webkit-tap-highlight-color:transparent}
.hole:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.thing{position:absolute;left:50%;bottom:30%;width:62%;transform:translate(-50%,40%);transition:transform .18s ease-out;pointer-events:none}
.thing svg{width:100%;height:auto;display:block}
.hole.up .thing{transform:translate(-50%,0)}
.hole.wilt .thing{filter:saturate(.25) brightness(.85);transform:translate(-50%,40%) rotate(-14deg)}
.hole.pulled .thing{transition:transform .35s cubic-bezier(.3,1.6,.6,1),opacity .35s;transform:translate(-50%,-90%) rotate(18deg);opacity:0}
.pop{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-family:var(--display);font-size:22px;color:var(--paper);text-shadow:0 2px 0 var(--ink);pointer-events:none;animation:pop .7s ease-out forwards}
.pop.bad{color:#ffb3a8}
@keyframes pop{to{transform:translate(-50%,-40px);opacity:0}}
.overlay{position:absolute;inset:0;border-radius:22px;background:rgba(59,36,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;color:var(--paper)}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,36px);margin:0;color:var(--gold)}
.overlay p{margin:0;max-width:30ch;line-height:1.45;font-size:15px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:800}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:26px;height:26px}
.btn{font-family:var(--display);font-size:22px;background:var(--carrot);color:var(--paper);border:3px solid var(--carrot-dark);border-radius:14px;padding:10px 28px;cursor:pointer;box-shadow:0 5px 0 var(--carrot-dark);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--carrot-dark)}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.basket{font-weight:800;font-size:14px;color:var(--paper);text-shadow:0 1px 0 var(--grass-dark)}
@media (prefers-reduced-motion:reduce){.thing,.hole.pulled .thing{transition:none}.pop{animation-duration:.01s}}
</style>

<div class="wrap">
  <h1>Carrot Patch Pull</h1>
  <div class="sign">
    <div class="board"><small>Carrots</small><b id="score">0</b></div>
    <div class="board"><small>Time</small><b id="time">60</b></div>
    <div class="board"><small>Lives</small><div class="hearts" id="lives">🥕🥕🥕</div></div>
    <div class="board"><small>Best</small><b id="best">0</b></div>
  </div>
  <div class="patch" id="patch">
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Harvest time!</h2>
      <p id="ovText">Tap carrots to pull them before they wilt. Golden carrots are worth 5. Don't bonk the gopher!</p>
      <div class="legend" id="legend"></div>
      <button class="btn" id="start" type="button">Start picking</button>
    </div>
  </div>
  <div class="basket" id="combo">Pull carrots in a row for a combo bonus</div>
</div>

<script>
const SVG={
 carrot:`<svg viewBox="0 0 60 90"><g fill="#3f9a2e"><path d="M30 34 C22 18 14 10 10 2 C20 6 27 16 30 30Z"/><path d="M30 34 C30 18 30 8 30 0 C34 10 34 22 30 34Z" fill="#57b843"/><path d="M30 34 C38 18 46 10 50 2 C40 6 33 16 30 30Z"/></g><path d="M14 34 Q30 26 46 34 L33 86 Q30 92 27 86Z" fill="#f07a1a"/><g stroke="#c95a08" stroke-width="2.5" stroke-linecap="round"><path d="M20 46h8"/><path d="M33 58h7"/><path d="M24 70h6"/></g></svg>`,
 gold:`<svg viewBox="0 0 60 90"><g fill="#3f9a2e"><path d="M30 34 C22 18 14 10 10 2 C20 6 27 16 30 30Z"/><path d="M30 34 C30 18 30 8 30 0 C34 10 34 22 30 34Z" fill="#57b843"/><path d="M30 34 C38 18 46 10 50 2 C40 6 33 16 30 30Z"/></g><path d="M14 34 Q30 26 46 34 L33 86 Q30 92 27 86Z" fill="#f5c518"/><g stroke="#c99a00" stroke-width="2.5" stroke-linecap="round"><path d="M20 46h8"/><path d="M33 58h7"/></g><path d="M44 20l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff6a0"/></svg>`,
 gopher:`<svg viewBox="0 0 60 70"><ellipse cx="30" cy="42" rx="24" ry="28" fill="#9b6b43"/><circle cx="10" cy="20" r="7" fill="#9b6b43"/><circle cx="50" cy="20" r="7" fill="#9b6b43"/><circle cx="10" cy="20" r="3.5" fill="#e8a7a0"/><circle cx="50" cy="20" r="3.5" fill="#e8a7a0"/><ellipse cx="30" cy="48" rx="14" ry="11" fill="#d9b48a"/><circle cx="21" cy="32" r="4" fill="#2a1a0e"/><circle cx="39" cy="32" r="4" fill="#2a1a0e"/><circle cx="22" cy="31" r="1.3" fill="#fff"/><circle cx="40" cy="31" r="1.3" fill="#fff"/><ellipse cx="30" cy="42" rx="4" ry="3" fill="#3b2414"/><rect x="26" y="49" width="8" height="7" rx="1" fill="#fff"/><path d="M30 49v7" stroke="#ccc"/></svg>`
};
const $=id=>document.getElementById(id);
const patch=$('patch'),overlay=$('overlay');
$('legend').innerHTML=`<span>${SVG.carrot} 1</span><span>${SVG.gold} 5</span><span>${SVG.gopher} ouch!</span>`;
let best=0; try{best=+localStorage.getItem('carrotBest')||0}catch(e){} $('best').textContent=best;

const holes=[];
for(let i=0;i<16;i++){
  const h=document.createElement('button');h.className='hole';h.type='button';h.id='hole'+i;
  h.setAttribute('aria-label','Garden hole '+(i+1));
  h.innerHTML='<div class="thing"></div>';
  h.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)});
  h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(i)}});
  patch.insertBefore(h,overlay);
  holes.push({el:h,kind:null,until:0,timer:null});
}

let score=0,lives=3,time=60,combo=0,playing=false,spawnT=null,clockT=null;
function draw(){
  $('score').textContent=score;$('time').textContent=time;
  $('lives').textContent=lives>0?'🥕'.repeat(lives):'—';
  $('combo').textContent=combo>=3?`Combo x${combo}! +${Math.floor(combo/3)} bonus each pull`:'Pull carrots in a row for a combo bonus';
}
function popText(el,txt,bad){const p=document.createElement('div');p.className='pop'+(bad?' bad':'');p.textContent=txt;el.appendChild(p);setTimeout(()=>p.remove(),700)}

function clear(h){clearTimeout(h.timer);h.kind=null;h.el.className='hole';h.el.querySelector('.thing').innerHTML=''}

function spawn(){
  if(!playing)return;
  const free=holes.filter(h=>!h.kind);
  if(free.length){
    const h=free[Math.floor(Math.random()*free.length)];
    const r=Math.random(), level=(60-time)/60;
    h.kind = r<0.08?'gold' : r<0.08+0.14+level*0.12?'gopher' : 'carrot';
    h.el.querySelector('.thing').innerHTML=SVG[h.kind];
    h.el.className='hole';
    requestAnimationFrame(()=>requestAnimationFrame(()=>h.el.classList.add('up')));
    const stay=(h.kind==='gold'?900:1700)-level*600;
    h.timer=setTimeout(()=>{
      if(h.kind==='carrot'||h.kind==='gold'){
        h.el.classList.add('wilt');combo=0;popText(h.el,'wilted',true);draw();
        h.kind='wilting';h.timer=setTimeout(()=>clear(h),350);
      } else clear(h);
    },stay);
  }
  const gap=Math.max(320,850-(60-time)*9);
  spawnT=setTimeout(spawn,gap);
}

function hit(i){
  if(!playing)return;const h=holes[i];
  if(h.kind==='carrot'||h.kind==='gold'){
    clearTimeout(h.timer);combo++;
    const wasGold=h.kind==='gold';
    const pts=(wasGold?5:1)+Math.floor(combo/3);
    score+=pts;popText(h.el,'+'+pts);
    h.kind='pulled';h.el.classList.add('pulled');h.timer=setTimeout(()=>clear(h),360);
    beep(wasGold?880:660);
  } else if(h.kind==='gopher'){
    clearTimeout(h.timer);lives--;combo=0;popText(h.el,'ouch!',true);beep(160);clear(h);
    if(lives<=0){draw();return end('The gopher got grumpy!')}
  }
  draw();
}

let ac=null;
function beep(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}catch(e){}}

function start(){
  holes.forEach(clear);score=0;lives=3;time=60;combo=0;playing=true;overlay.hidden=true;draw();
  spawn();
  clockT=setInterval(()=>{time--;draw();if(time<=0)end('Time’s up!')},1000);
  holes[0].el.focus({preventScroll:true});
}
function end(title){
  playing=false;clearTimeout(spawnT);clearInterval(clockT);holes.forEach(clear);
  let msg=`You pulled ${score} carrot point${score===1?'':'s'}.`;
  if(score>best){best=score;try{localStorage.setItem('carrotBest',best)}catch(e){}msg+=' New best!'}
  $('best').textContent=best;
  $('ovTitle').textContent=title;$('ovText').textContent=msg;$('legend').hidden=true;$('start').textContent='Pick again';
  overlay.hidden=false;$('start').focus();
}
$('start').addEventListener('click',start);
draw();
</script>

</body></html>
