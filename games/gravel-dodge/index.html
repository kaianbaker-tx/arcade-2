<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gravel Dodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one portrait pixel playfield, letterboxed in the middle of a dark dirt background, framed like a grass block */
:root{--bg:#1b140e;--bg-2:#21180f;--frame:#3f8a26;--ink:#1f1a14;--cream:#fff8e6;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg) repeating-conic-gradient(var(--bg-2) 0 25%,var(--bg) 0 50%) 0 0/32px 32px;color:var(--cream);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Pixelify Sans","Trebuchet MS",sans-serif}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#c{display:block;image-rendering:pixelated;touch-action:none;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--frame),0 10px 0 4px rgba(0,0,0,.4)}
#c:focus-visible{outline:3px solid #ffd23f;outline-offset:6px}
</style>
<div id="wrap"><canvas id="c" width="360" height="560" tabindex="0" aria-label="Gravel Dodge game. Tap or press Space to play."></canvas></div>
<script>
'use strict';
const W=360,H=560,ID='gravel-dodge',TITLE='Gravel Dodge',BEAT=.3,MOCT=1;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SC=2;cv.width=W*SC;cv.height=H*SC;
function fit(){const s=Math.max(.3,Math.min((innerWidth-24)/W,(innerHeight-24)/H));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mixc(a,b,k){const A=hexRgb(a),B=hexRgb(b);return`rgb(${Math.round(A[0]+(B[0]-A[0])*k)},${Math.round(A[1]+(B[1]-A[1])*k)},${Math.round(A[2]+(B[2]-A[2])*k)})`;}
let t=0,state='title',score=0,best=0,overT=0,newBest=false,shake=0;
try{best=+localStorage.getItem('naiak-best-'+ID)||0;}catch(e){}

/* ---- pixel textures ---- */
let _s=7;const sr=()=>{_s=(_s*16807)%2147483647;return _s/2147483647;};
function mk(fn){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');fn(g);return c;}
function P(g,x,y,c){g.fillStyle=c;g.fillRect(x,y,1,1);}
function nz(g,cols){for(let y=0;y<16;y++)for(let x=0;x<16;x++)P(g,x,y,cols[Math.floor(sr()*cols.length)]);}
const STC=['#8b8b90','#7e7e84','#98989d','#74747a'];
function ore(col,hi){return mk(g=>{nz(g,STC);[[2,3],[9,2],[5,9],[11,10],[3,13]].forEach(([x,y])=>{g.fillStyle=col;g.fillRect(x,y,3,2);g.fillRect(x+1,y-1,1,1);P(g,x,y,hi);});});}
function wool(a,b){return mk(g=>{nz(g,[a,a,b]);for(let i=0;i<10;i++)P(g,Math.floor(sr()*16),Math.floor(sr()*16),b);});}
function solidB(a,b,c){return mk(g=>{g.fillStyle=a;g.fillRect(0,0,16,16);g.fillStyle=c;g.fillRect(0,0,16,2);g.fillRect(0,0,2,16);g.fillStyle=b;g.fillRect(0,14,16,2);g.fillRect(14,0,2,16);g.fillStyle=c;g.fillRect(4,4,3,3);g.fillStyle=b;g.fillRect(9,9,3,3);});}
const TX={
 grass:mk(g=>{nz(g,['#8a5a32','#7a4e2b','#98663a']);for(let x=0;x<16;x++){const h=3+Math.floor(sr()*2);for(let y=0;y<h;y++)P(g,x,y,['#6fbf3b','#5ea832','#82d14a'][Math.floor(sr()*3)]);P(g,x,h,'#4f8f2a');}}),
 dirt:mk(g=>nz(g,['#8a5a32','#7a4e2b','#98663a','#6e4626'])),
 stone:mk(g=>nz(g,STC)),
 cobble:mk(g=>{nz(g,STC);g.fillStyle='#55555b';[[0,5,16,1],[0,11,16,1],[6,0,1,5],[11,5,1,6],[4,11,1,5]].forEach(r=>g.fillRect(r[0],r[1],r[2],r[3]));}),
 log:mk(g=>{for(let x=0;x<16;x++){const b=['#6b4a2a','#7d5733','#5d3f23','#83603a'][x%4];for(let y=0;y<16;y++)P(g,x,y,sr()<.15?'#4e341c':b);}}),
 planks:mk(g=>{nz(g,['#c8955a','#bb8a50','#d4a066']);g.fillStyle='#8e6234';for(let r=0;r<4;r++){g.fillRect(0,r*4+3,16,1);g.fillRect((r*5+3)%16,r*4,1,3);}}),
 leaves:mk(g=>{nz(g,['#3f8f2e','#4fa436','#357a27','#5cb43f']);for(let i=0;i<24;i++)P(g,Math.floor(sr()*16),Math.floor(sr()*16),'#2a5e1f');}),
 sand:mk(g=>nz(g,['#e8d79a','#dccb8a','#f0e0a8'])),
 gravel:mk(g=>nz(g,['#8a817c','#6f6763','#a39a94','#5c5552'])),
 brick:mk(g=>{g.fillStyle='#b8a898';g.fillRect(0,0,16,16);for(let r=0;r<4;r++){const o=r%2?4:0;for(let b=-1;b<2;b++){g.fillStyle=['#a4483a','#94402f','#b25444'][Math.floor(sr()*3)];g.fillRect(b*8+o,r*4,7,3);}}}),
 obsidian:mk(g=>{nz(g,['#1b1028','#24163a','#140b1e']);for(let i=0;i<8;i++)P(g,Math.floor(sr()*16),Math.floor(sr()*16),'#5b3b8c');}),
 lava:mk(g=>{nz(g,['#ff7a1a','#ff9a2a','#e8560e','#ffb43a']);for(let i=0;i<10;i++)P(g,Math.floor(sr()*16),Math.floor(sr()*16),'#fff07a');}),
 water:mk(g=>{nz(g,['#2f6fd8','#3a7ce6','#2860c4']);for(let i=0;i<10;i++)P(g,Math.floor(sr()*16),Math.floor(sr()*16),'#6fa8ff');}),
 boom:mk(g=>{g.fillStyle='#d8323a';g.fillRect(0,0,16,16);g.fillStyle='#a8222a';for(let x=0;x<16;x+=4)g.fillRect(x,0,1,16);g.fillStyle='#f4efe6';g.fillRect(0,6,16,4);g.fillStyle='#1f1a14';g.fillRect(3,7,2,2);g.fillRect(7,7,2,2);g.fillRect(11,7,2,2);}),
 coal:ore('#2a2a30','#4a4a54'),iron:ore('#d8a882','#f0d0b0'),gold:ore('#ffd23f','#fff4a0'),diamond:ore('#4ee6e0','#c8fffb'),emerald:ore('#2fd66a','#a8ffc4'),redstone:ore('#e0242a','#ff8a8a'),lapis:ore('#2a4fd8','#8aa8ff'),
 wwhite:wool('#ece8e2','#d8d4cc'),wred:wool('#c8343a','#a8282e'),wblue:wool('#3a4fc8','#2c3ea8'),wyellow:wool('#f0c43a','#d8a82a'),wgreen:wool('#5ea832','#4a8a26'),wpink:wool('#f08ab0','#d87098'),
 gblock:solidB('#ffd23f','#c99a1a','#fff4a0'),dblock:solidB('#4ee6e0','#2a9a9a','#c8fffb'),eblock:solidB('#2fd66a','#1f8a44','#a8ffc4'),rblock:solidB('#e0242a','#8a1418','#ff8a8a'),lblock:solidB('#2a4fd8','#1a2f8a','#8aa8ff'),ablock:solidB('#9b5de5','#5a2a9a','#d8b8ff'),iblock:solidB('#e4e4ea','#a8a8b0','#ffffff'),cblock:solidB('#2a2a30','#141418','#55555f')
};
const NAME={dirt:'Dirt',stone:'Stone',coal:'Coal ore',iron:'Iron ore',gold:'Gold ore',redstone:'Ruby ore',diamond:'Diamond ore',emerald:'Emerald ore',obsidian:'Obsidian'};
const PALS={};
for(const k in TX){const d=TX[k].getContext('2d').getImageData(0,0,16,16).data,c=[];for(let i=0;i<d.length&&c.length<8;i+=4*29)if(d[i+3]>200)c.push(`rgb(${d[i]},${d[i+1]},${d[i+2]})`);PALS[k]=c.length?c:['#888888'];}
[['coal','#2a2a30'],['iron','#d8a882'],['gold','#ffd23f'],['diamond','#4ee6e0'],['emerald','#2fd66a'],['redstone','#e0242a'],['lapis','#2a4fd8']].forEach(([k,c])=>PALS[k].push(c,c,c));
const CRACK=[];{let x=8,y=8;for(let i=0;i<30;i++){CRACK.push([x,y]);x=clamp(x+Math.round(sr()*2-1),1,14);y=clamp(y+Math.round(sr()*2-1),1,14);if(i===14){x=7;y=8;}}}
const BLOB=mk(g=>{for(let y=0;y<15;y++)for(let x=0;x<16;x++){const dx=(x-7.5)/7.8,dy=y<10?(y-10)/6.8:(y-10)/5,d=dx*dx+dy*dy;if(d>1)continue;let c='#3f9bff';if(d>.74)c='#1f4fae';else if(dx+dy>.5)c='#2f7be0';else if(dx+dy<-.6)c='#8fd0ff';P(g,x,y,c);}g.fillStyle='#1f4fae';g.fillRect(0,15,16,1);g.fillStyle='#2f7be0';g.fillRect(2,15,12,1);g.fillRect(1,14,2,1);g.fillRect(13,14,2,1);[[10,7],[12,11],[5,13],[8,12]].forEach(([x,y])=>P(g,x,y,'#6ab8ff'));[[3,7],[3,8],[4,6],[5,5]].forEach(([x,y])=>P(g,x,y,'#ffffff'));});
function drawBlob(x,y,s,face){const j=Math.sin(t*6)*.04,w=s*(1+j),h=s*(1-j);x-=(w-s)/2;y+=s-h;ctx.drawImage(BLOB,x,y,w,h);const u=w/16,v=h/16,f=face<0?-1:1,sp=(a,b,c,d,col)=>{ctx.fillStyle=col;ctx.fillRect(x+a*u,y+b*v,c*u,d*v);};for(const bx of [5,9]){const X=bx+f*.5+.5;sp(X,6.5,2,3,'#ffffff');sp(X+(f>0?1:0),7.5,1,2,'#1b1b22');}sp(3.5,10.5,2,1,'#ff9aa8');sp(10.5,10.5,2,1,'#ff9aa8');sp(7+f*.5,11.5,2,1,'#123a7a');}

/* ---- drawing helpers ---- */
function blk(n,x,y,s){ctx.drawImage(TX[n],x,y,s,s);}
function txt(s,x,y,size,col,align,font){ctx.font=font==='b'?`600 ${size}px "Pixelify Sans","Trebuchet MS",sans-serif`:`${size}px "Silkscreen","Courier New",monospace`;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillStyle='#000000';ctx.fillText(s,x+2,y+2);ctx.fillStyle=col||'#fff8e6';ctx.fillText(s,x,y);}
function panel(x,y,w,h){ctx.fillStyle='rgba(31,26,20,.9)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#6e5232';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);}
function sky(a,b){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a||'#6fb8ff');g.addColorStop(1,b||'#d8f0ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function tile(n,s,ox,oy){const sx=(((ox||0)%s)+s)%s-s,sy=(((oy||0)%s)+s)%s-s;for(let y=sy;y<H;y+=s)for(let x=sx;x<W;x+=s)ctx.drawImage(TX[n],x,y,s,s);}
function dim(a){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}

/* ---- effects ---- */
const parts=[],pops=[];
function burst(x,y,cols,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(60,220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,l:rnd(.4,.8),c:cols[i%cols.length],s:rnd(3,6)});}}
function pop(x,y,s,c){pops.push({x,y,s,c:c||'#fff8e6',l:1});}
function addScore(n){score+=n;}
function drawFX(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.l-=dt;if(p.l<=0){pops.splice(i,1);continue;}p.y-=40*dt;ctx.globalAlpha=Math.min(1,p.l*2);txt(p.s,p.x,p.y,16,p.c,'center','b');ctx.globalAlpha=1;}}

/* ---- sound ---- */
let AC=null,mg=null,muted=false;try{muted=localStorage.getItem('naiak-mute')==='1';}catch(e){}
function au(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=muted?0:.5;mg.connect(AC.destination);startMusic();}catch(e){AC=null;}}
function tone(f,d,type,v,w,sl){if(!AC)return;const t0=AC.currentTime+(w||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.2,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d+.05);}
function noise(d,f,v){if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=AC.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(mg);s.start();}
const S={tap:()=>tone(520,.06,'square',.12,0,760),good:()=>{tone(784,.1,'square',.14);tone(1046,.14,'square',.14,.07);},coin:()=>{tone(988,.08,'square',.12);tone(1318,.16,'square',.12,.06);},bad:()=>tone(220,.25,'sawtooth',.16,0,90),boom:()=>{noise(.5,600,.6);tone(90,.4,'sine',.4,0,40);},dig:()=>noise(.08,1200,.35),jump:()=>tone(300,.12,'square',.1,0,600),over:()=>[523,392,330,262].forEach((f,i)=>tone(f,.22,'triangle',.22,i*.15)),start:()=>[392,523,659,784].forEach((f,i)=>tone(f,.12,'square',.12,i*.07)),best:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.16,'triangle',.22,i*.08))};
function pl(f,t0,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v*.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d+.05);}
function startMusic(){const sc=[392,440,523.25,587.33,659.25,783.99],roots=[130.81,110,87.31,98];let nt=AC.currentTime+.2,st=0,mi=2;setInterval(()=>{if(nt<AC.currentTime-.1)nt=AC.currentTime+.05;while(nt<AC.currentTime+.4){const b=Math.floor(st/8)%4,s=st%8;if(s===0)pl(roots[b],nt,BEAT*7,.4);if(s===4)pl(roots[b]*2,nt,BEAT*3,.2);if(Math.random()<.5){mi=clamp(mi+ri(-2,2),0,5);pl(sc[mi]*MOCT,nt,BEAT*2,.16);}nt+=BEAT;st++;}},100);}

/* ---- screens ---- */
function titleScreen(){dim(.45);panel(24,86,312,388);const fs=Math.min(30,Math.floor(290/(TITLE.length*.82)));txt(TITLE,W/2,136,fs,'#7bd44a','center');txt('by Naiak Games',W/2,170,11,'#cbb48c','center');G.how.forEach((l,i)=>txt(l,W/2,218+i*30,16,'#fff8e6','center','b'));if(best)txt('Best: '+best,W/2,372,14,'#ffd23f','center');if(Math.floor(t*2)%2===0)txt('Tap to play',W/2,424,18,'#fff8e6','center');}
function overScreen(){dim(.5);panel(40,150,280,250);txt(G.overText||'Game over',W/2,196,G.overText&&G.overText.length>12?16:22,'#ff8a7a','center');txt('Score '+score,W/2,250,24,'#fff8e6','center');txt(newBest?'New best!':'Best '+best,W/2,292,16,'#ffd23f','center');if(overT>.7&&Math.floor(t*2)%2===0)txt('Tap to play again',W/2,350,14,'#fff8e6','center');}
function soundIcon(){ctx.fillStyle='rgba(31,26,20,.75)';ctx.fillRect(W-40,6,34,30);txt(muted?'x':'♪',W-23,21,16,muted?'#ff8a7a':'#fff8e6','center','b');}
function endGame(){if(state!=='play')return;state='over';overT=0;newBest=score>best&&score>0;if(newBest){best=score;try{localStorage.setItem('naiak-best-'+ID,String(best));}catch(e){}S.best();}else S.over();}
function begin(){score=0;state='play';parts.length=0;pops.length=0;shake=0;G.overText=null;G.start();S.start();}

/* ---- input ---- */
function lp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
let ptrDown=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();const p=lp(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}
 if(p.x>W-44&&p.y<44){muted=!muted;if(mg)mg.gain.value=muted?0:.5;try{localStorage.setItem('naiak-mute',muted?'1':'0');}catch(_){}return;}
 if(state==='title'){begin();return;}if(state==='over'){if(overT>.7)begin();return;}
 if(e.button===2&&G.right){G.right(p.x,p.y);return;}
 ptrDown=true;if(G.down)G.down(p.x,p.y);});
cv.addEventListener('pointermove',e=>{if(state!=='play'||!G.move)return;const p=lp(e);G.move(p.x,p.y,ptrDown);});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{if(!ptrDown)return;ptrDown=false;const p=lp(e);if(state==='play'&&G.up)G.up(p.x,p.y);}));
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();au();
 if(state!=='play'){if(!e.repeat&&(k===' '||k==='enter')&&(state==='title'||overT>.7))begin();return;}if(G.key)G.key(k,true,e.repeat);});
addEventListener('keyup',e=>{if(state==='play'&&G.key)G.key(e.key.toLowerCase(),false,false);});
addEventListener('blur',()=>{ptrDown=false;});

/* ---- game ---- */
const FY=520,PWD=30;
const G={how:['Gravel and anvils fall from the sky!','Move with arrows, or hold where','you want to go.','Shadows show where they land!'],
start(){this.x=180;this.f=[];this.next=1;this.el=0;this.bonus=0;this.kd={l:0,r:0};this.pd=0;this.face=1;},
key(k,d){if(k==='arrowleft'||k==='a')this.kd.l=d?1:0;if(k==='arrowright'||k==='d')this.kd.r=d?1:0;},
down(x){this.tx=x;this.pd=x<this.x?-1:1;},move(x,y,d){if(d)this.tx=x;},up(){this.pd=0;this.tx=null;},
update(dt){this.el+=dt;score=Math.floor(this.el)+this.bonus;if(this.tx!=null)this.pd=this.tx<this.x-6?-1:this.tx>this.x+6?1:0;const dir=(this.kd.r-this.kd.l)||this.pd;if(dir)this.face=dir;this.x=clamp(this.x+dir*250*dt,PWD/2,W-PWD/2);this.next-=dt;
 if(this.next<=0){this.next=Math.max(.17,.8-this.el*.013);const r=Math.random();this.f.push({c:ri(0,8),y:-44,vy:0,w:.75,t:r<.1?'emerald':r<.32?'anvil':'gravel',done:false});}
 for(const o of this.f){if(o.w>0){o.w-=dt;continue;}o.vy+=(o.t==='anvil'?1500:950)*dt;o.y+=o.vy*dt;const ox=o.c*40;
  if(!o.done&&o.y+36>FY-30&&o.y<FY&&ox+4<this.x+PWD/2&&ox+36>this.x-PWD/2){o.done=true;if(o.t==='emerald'){this.bonus+=5;S.coin();pop(this.x,FY-50,'+5','#2fd66a');}else{S.boom();shake=.4;burst(this.x,FY-15,['#8a817c','#3a3a40','#3f9bff'],22);G.overText='Bonk!';endGame();return;}}
  if(!o.done&&o.y+36>=FY){o.done=true;if(o.t!=='emerald'){burst(ox+20,FY,PALS.gravel,6);noise(.08,500,.15);}}}
 this.f=this.f.filter(o=>!o.done);},
obj(o,x,y){if(o.t==='gravel')blk('gravel',x+2,y,36);else if(o.t==='emerald')blk('eblock',x+8,y+8,24);else{ctx.fillStyle='#3a3a40';ctx.fillRect(x+2,y,36,12);ctx.fillRect(x+12,y+12,16,12);ctx.fillRect(x+6,y+24,28,12);ctx.fillStyle='#5a5a62';ctx.fillRect(x+4,y+2,32,3);}},
draw(){sky('#8ab8d8','#d8e8f0');ctx.fillStyle='#a8b8c0';ctx.fillRect(0,380,W,140);for(let x=0;x<W;x+=40){blk('stone',x,FY,40);}
 for(const o of this.f){const ox=o.c*40,k=o.w>0?1-o.w/.75:1;ctx.fillStyle=`rgba(0,0,0,${.15+.25*k})`;ctx.fillRect(ox+20-14*k-4,FY-5,28*k+8,5);
  if(o.w>0){ctx.fillStyle='#e0302a';ctx.fillRect(ox+17,50+Math.sin(t*20)*2,6,14);ctx.fillRect(ox+17,68,6,5);}else this.obj(o,ox,o.y);}
 drawBlob(this.x-PWD/2-1,FY-32,32,this.face);}};

let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;t+=dt;ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;
 if(state==='play')G.update(dt);else if(state==='over')overT+=dt;
 if(shake>0){shake-=dt;ctx.translate(rnd(-5,5),rnd(-5,5));}
 G.draw(dt);drawFX(dt);ctx.setTransform(SC,0,0,SC,0,0);
 if(state!=='title'&&!G.noHud)txt('Score '+score,12,22,16,'#fff8e6','left');
 soundIcon();if(state==='title')titleScreen();else if(state==='over')overScreen();
 requestAnimationFrame(frame);}
G.start();requestAnimationFrame(frame);

</script>
