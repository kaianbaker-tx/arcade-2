<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cereal Brawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one arcade cabinet screen, canvas centered, touch pad below on phones. Single deliberate dark arcade look. */
:root{
  --bg:#1a1030; --cab:#2a1a4a; --milk:#fff7e8; --sugar:#ffd23f; --berry:#ff4f8b; --sky:#3ec7ff; --ink:#0d0820;
  --display:"Bungee","Impact",system-ui,sans-serif;
  --shade:"Bungee Shade","Bungee","Impact",sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--milk);font-family:var(--body);margin:0;padding-inline:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cab{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:10px}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:var(--ink);box-shadow:0 0 0 4px var(--cab),0 0 0 7px var(--sugar),0 20px 60px #0008}
canvas{display:block;width:100%;height:100%}
.help{font-size:13px;color:#c9bde8;text-align:center;line-height:1.5}
.help b{color:var(--sugar);font-weight:800}
.pad{display:none;justify-content:space-between;gap:12px}
.pad .grp{display:flex;gap:8px;flex-wrap:wrap}
.pad button{font-family:var(--display);font-size:14px;color:var(--ink);background:var(--sugar);border:0;border-radius:12px;min-width:56px;height:56px;padding:0 10px;box-shadow:0 4px 0 #b8901a;touch-action:none}
.pad button.alt{background:var(--sky);box-shadow:0 4px 0 #1f86b0}
.pad button.sp{background:var(--berry);box-shadow:0 4px 0 #a62a57;color:var(--milk)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
button:focus-visible{outline:3px solid var(--milk);outline-offset:2px}
@media (pointer:coarse){.pad{display:flex}.help.keys{display:none}}
</style>

<div class="cab">
  <div class="screen"><canvas id="c" width="960" height="540" tabindex="0" aria-label="Cereal Brawl game screen"></canvas></div>
  <div class="pad" id="pad">
    <div class="grp">
      <button class="alt" data-k="left" aria-label="Move left">◀</button>
      <button class="alt" data-k="up" aria-label="Jump">▲</button>
      <button class="alt" data-k="right" aria-label="Move right">▶</button>
      <button class="alt" data-k="block" aria-label="Block">BLK</button>
    </div>
    <div class="grp">
      <button data-k="attack" aria-label="Attack: tap for punch, tap again for kick">ATTACK</button>
      <button class="sp" data-k="special">SPCL</button>
    </div>
  </div>
  <p class="help keys"><b>Player 1:</b> ← → move · ↑ jump · <b>Space</b> tap = punch, tap again fast = kick, <b>hold = special</b> · ↓ block &nbsp;|&nbsp; <b>Player 2:</b> A / D move · W jump · F attack (hold = special) · S block &nbsp;|&nbsp; <b>Enter</b> select · <b>Esc</b> menu</p>
</div>

<script>
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(960*DPR);cv.height=Math.round(540*DPR);
const W=960,H=540,GROUND=455;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Fighters (all original mascots) ---------- */
const ROSTER=[
  {id:'moose',name:'MAPLE MOOSE',cereal:'Syrup Swirls',box:['SYRUP','SWIRLS'],tag:'Slow, strong, sticky',col:'#a8642c',col2:'#e8b36a',bit:'#d9822b',speed:3.4,pow:1.2,special:'Syrup Loop'},
  {id:'croc',name:'CHOMPY CROC',cereal:'Chomp Crunch',box:['CHOMP','CRUNCH'],tag:'Fast jaws, fast feet',col:'#3fa34d',col2:'#b7e07a',bit:'#5a3420',speed:4.6,pow:0.95,special:'Cocoa Chomp'},
  {id:'yeti',name:'BERRY YETI',cereal:'Frost Bites',box:['FROST','BITES'],tag:'Big reach, frosty hits',col:'#d9e8ff',col2:'#7d6bff',bit:'#c23ad6',speed:3.9,pow:1.05,special:'Berry Blizzard'},
  {id:'walrus',name:'SIR WAFFLES',cereal:'Waddle Waffles',box:['WADDLE','WAFFLES'],tag:'The walrus of good taste',col:'#8a5a44',col2:'#ffd27a',bit:'#e8a530',speed:3.7,pow:1.1,special:'Waffle Disc'},
  {id:'octo',name:'OATIE OCTO',cereal:'Ink-O Oats',box:['INK-O','OATS'],tag:'Eight arms, zero chill',col:'#c99bd9',col2:'#f2dcb0',bit:'#4a2340',speed:3.8,pow:1.05,special:'Raisin Rain'},
  {id:'raccoon',name:'PUFFY RACCOON',cereal:'Sneaky Puffs',box:['SNEAKY','PUFFS'],tag:'Sneaky, speedy, snacky',col:'#8d8f9c',col2:'#e9e9ef',bit:'#f3e2b0',speed:4.8,pow:0.9,special:'Puff Pop'},
  {id:'dillo',name:'CRUNCHADILLO',cereal:'Knight Crunch',box:['KNIGHT','CRUNCH'],tag:'Armored and crunchy',col:'#b88a5a',col2:'#ffe0a3',bit:'#c98d3c',speed:3.3,pow:1.25,special:'Granola Bar Toss'},
  {id:'hippo',name:'HONEY HIPPO',cereal:'Honey Hoops',box:['HONEY','HOOPS'],tag:'Heavy hips, sweet drips',col:'#a98bd6',col2:'#ffc1d9',bit:'#ffb000',speed:3.5,pow:1.15,special:'Honey Blob'},
];
const N=ROSTER.length;

/* ---------- Input ---------- */
const keys={};
const MAP1={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'block',Space:'attack',ShiftLeft:'special',ShiftRight:'special'};
const MAP2={KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'block',KeyF:'attack',KeyG:'special'};
const in1={},in2={},touch={};
addEventListener('keydown',e=>{
  if(MAP1[e.code]||MAP2[e.code]||e.code==='Enter'||e.code==='Space')e.preventDefault();
  if(keys[e.code])return; keys[e.code]=true;
  if(MAP1[e.code])in1[MAP1[e.code]]=true;
  if(MAP2[e.code])in2[MAP2[e.code]]=true;
  menuKey(e.code);
});
addEventListener('keyup',e=>{keys[e.code]=false;if(MAP1[e.code]&&MAP1[e.code]!=='attack')in1[MAP1[e.code]]=false;if(MAP2[e.code]&&MAP2[e.code]!=='attack')in2[MAP2[e.code]]=false;});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();touch[k]=true;if(k==='attack')touch.attackHold=true;menuTouch(k);};
  const off=e=>{e.preventDefault();if(k!=='attack')touch[k]=false;else touch.attackHold=false;};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
function p1In(){return{left:in1.left||touch.left,right:in1.right||touch.right,up:in1.up||touch.up,block:in1.block||touch.block,attack:in1.attack||touch.attack,special:in1.special||touch.special};}

/* ---------- Audio (starts after a key/tap) ---------- */
let ac=null;
function beep(f,d=0.08,type='square',v=0.06){
  try{ if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
const sfx={hit:()=>{beep(180,.1,'square');beep(90,.12,'sawtooth',.05)},block:()=>beep(520,.05,'triangle'),swing:()=>beep(700,.03,'triangle',.03),special:()=>{beep(300,.2,'sawtooth');beep(600,.2,'square',.04)},ko:()=>{beep(220,.4,'sawtooth');setTimeout(()=>beep(110,.6,'sawtooth'),200)},sel:()=>beep(880,.05,'square',.04)};

/* ---------- Game state ---------- */
let scene='title', mode=0, sel=[0,1], selStage=0, menuIdx=0, cpuSel=0;
let team=[], cpuTeam=[], lineupT=0;
const TOTAL=()=>mode===2?5:3;
let hitStop=0, slow=0, flash=0;
let F=[], shots=[], parts=[], roundNo=1, wins=[0,0], timer=60, tick=0, banner='', bannerT=0, shake=0, winner=-1;

function newFighter(ch,x,face,side){return{ch,x,y:GROUND,vx:0,vy:0,face,side,hp:100,meter:0,st:'idle',t:0,atk:null,hitT:0,cool:0,blocking:false,won:false};}

function startMatch(){wins=[0,0];roundNo=1;startRound();}
function startRound(){
  if(mode===2){sel[0]=team[roundNo-1];sel[1]=cpuTeam[roundNo-1];}
  stage=ROSTER[roundNo%2===1?sel[1]:sel[0]].id;
  F=[newFighter(ROSTER[sel[0]],260,1,0),newFighter(ROSTER[sel[1]],700,-1,1)];
  in1.attack=in2.attack=touch.attack=false;
  hitStop=0;slow=0;
  shots=[];parts=[];timer=60;tick=0;winner=-1;scene='fight';banner=roundNo===TOTAL()?'FINAL ROUND':'ROUND '+roundNo+' OF '+TOTAL();bannerT=90;
}

/* ---------- Menus ---------- */
function menuKey(code){
  const up=code==='ArrowUp'||code==='KeyW',dn=code==='ArrowDown'||code==='KeyS',lf=code==='ArrowLeft'||code==='KeyA',rt=code==='ArrowRight'||code==='KeyD',ok=code==='Enter'||code==='Space'||code==='KeyF';
  if(code==='Escape'){scene='title';return;}
  if(scene==='title'){ if(up){menuIdx=(menuIdx+3)%4;sfx.sel();} if(dn){menuIdx=(menuIdx+1)%4;sfx.sel();} if(ok){mode=menuIdx;scene='select';selStage=0;team=[];sfx.sel();} }
  else if(scene==='lineup'){ if(ok)startMatch(); }
  else if(scene==='select'){
    if(lf&&sel[selStage]===0&&selStage===0){scene='title';team=[];sfx.sel();return;}
    if(lf){sel[selStage]=(sel[selStage]+N-1)%N;sfx.sel();}
    if(rt){sel[selStage]=(sel[selStage]+1)%N;sfx.sel();}
    if(up||dn){sel[selStage]=(sel[selStage]+4)%N;sfx.sel();}
    if(code==='Backspace'&&mode===2&&team.length){team.pop();sfx.sel();}
    if(ok&&mode===2){ addPick(sel[0]); }
    else if(ok){sfx.sel(); if(mode===0||mode===3){sel[1]=(sel[0]+1+Math.floor(Math.random()*(N-1)))%N;startMatch();} else if(selStage===0)selStage=1; else startMatch();}
  }
  else if(scene==='over'&&ok){scene='select';selStage=0;team=[];}
}
function menuTouch(k){
  const map={up:'ArrowUp',left:'ArrowLeft',right:'ArrowRight',block:'ArrowDown',attack:'Enter'};
  if(scene!=='fight'&&map[k])menuKey(map[k]);
}
cv.addEventListener('pointerdown',e=>{
  if(scene==='title'){const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*H; menuIdx=y<354?0:y<402?1:y<450?2:3; menuKey('Enter');}
  else if(scene==='lineup')menuKey('Enter');
  else if(scene==='select'){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
    if(x<56&&y>100&&y<265){scene='title';team=[];sfx.sel();return;}
    if(y>100&&y<430){const col=Math.floor((x-60)/210),row=y<265?0:1,i=row*4+col; if(col>=0&&col<4){ if(sel[selStage]===i)menuKey('Enter'); else {sel[selStage]=i;sfx.sel();} }}
    else if(y>=430){ if(mode===2&&y<512){const k=Math.floor((x-(W/2-203))/84); if(k>=0&&k<team.length&&x<W/2+203){team.splice(k,1);sfx.sel();return;}} menuKey('Enter'); }}
  else if(scene==='over')menuKey('Enter');
});

/* ---------- Fighting logic ---------- */
const MOVES={punch:{start:5,act:5,rec:10,range:118,dmg:6,kb:4,h:-90},kick:{start:9,act:6,rec:16,range:100,dmg:10,kb:7,h:-40}};

function cpu(me,op){
  const d=op.x-me.x,ad=Math.abs(d),i={};
  const ex=mode===3,lvl=ex?1.7+roundNo*0.1:0.55+roundNo*0.08;
  if(ex&&me.meter>=50&&ad>160&&Math.random()<0.05)i.special=true;
  if(op.atk&&op.atk.ph<2&&ad<130&&Math.random()<(ex?0.6:0.35*lvl))i.block=true;
  else if(ad>130){ if(Math.random()<0.9)i[d>0?'right':'left']=true; if(me.meter>=50&&Math.random()<0.02*lvl)i.special=true; }
  else if(ad<60&&Math.random()<0.05)i[d>0?'left':'right']=true;
  else { const r=Math.random(); if(r<0.06*lvl)i.punch=true; else if(r<0.1*lvl)i.kick=true; else if(r<0.115)i.up=true; }
  if(shots.some(s=>s.own!==me&&Math.abs(s.x-me.x)<160)&&Math.random()<(ex?0.6:0.25))i.up=true;
  return i;
}

function act(f,i,op){
  if(f.st==='ko'||f.won)return;
  if(f.cool>0)f.cool--;
  const held=f.held&&f.held();
  if(held&&!f.chargeLock&&f.meter>=50&&f.hitT===0){f.charge=(f.charge||0)+1;if(f.charge%6===0)beep(300+f.charge*12,.04,'triangle',.03);}
  else if(!held){f.charge=0;f.chargeLock=false;}
  else f.charge=0;
  const onG=f.y>=GROUND;
  if(f.hitT>0){f.hitT--;f.st='hit';return;}
  if(f.atk){
    const a=f.atk;a.t++;
    const m=MOVES[a.k];
    if(a.k==='special'){ if(a.t===12){ shots.push({x:f.x+f.face*50,y:f.y-80,vx:f.face*9,own:f,ch:f.ch,r:0,trail:[]}); sfx.special(); } if(a.t>26)f.atk=null; }
    else{
      a.ph=a.t<m.start?0:a.t<m.start+m.act?1:2;
      if(a.ph===1&&!a.hit){
        const dx=(op.x-f.x)*f.face;
        if(dx>0&&dx<m.range&&Math.abs(op.y-f.y)<110){a.hit=true;strike(f,op,Math.round(m.dmg*f.ch.pow),m.kb);}
      }
      if(a.t>=m.start+m.act+m.rec)f.atk=null;
    }
    if(onG)f.vx*=0.7;
    return;
  }
  f.blocking=!!i.block&&onG;
  if(f.blocking){f.vx=0;f.st='block';return;}
  const sp=f.ch.speed;
  if(i.left)f.vx=-sp;else if(i.right)f.vx=sp;else if(onG)f.vx*=0.6;
  if(i.up&&onG){f.vy=-15;sfx.swing();dust(f.x,GROUND,5);}
  if(f.combo>0)f.combo--;
  if(f.charge>=CHARGE&&f.cool===0){f.atk={k:'special',t:0};f.meter-=50;f.cool=20;f.charge=0;f.chargeLock=true;lineT=12;glitchT=Math.max(glitchT,3);P({k:'ring',x:f.x,y:f.y-90,l:18,c:'#bff3ff',r:80});return;}
  if(i.attack&&f.cool===0){ if(f.combo>0&&f.lastK==='punch')i.kick=true; else i.punch=true; if(f.ctl){f.ctl.attack=false;if(f.ctl===in1)touch.attack=false;} }
  if(i.punch&&f.cool===0){f.lastK='punch';f.combo=28;f.atk={k:'punch',t:0,ph:0};f.cool=4;sfx.swing();}
  else if(i.kick&&f.cool===0){f.lastK='kick';f.combo=0;f.atk={k:'kick',t:0,ph:0};f.cool=6;sfx.swing();}
  else if(i.special&&f.meter>=50&&f.cool===0){f.atk={k:'special',t:0};f.meter-=50;f.cool=20;}
  f.st=!onG?'jump':Math.abs(f.vx)>0.5?'walk':'idle';
}

function strike(a,b,dmg,kb){
  if(b.st==='ko')return;
  const blocked=b.blocking&&((a.x-b.x)*b.face>0);
  const hx=b.x-b.face*12,hy=b.y-95;
  if(blocked){dmg=Math.max(0,Math.round(dmg*0.1));kb*=0.4;sfx.block();burst(hx,hy,'#ffffff',4);impact(hx,hy,true);hitStop=3;}
  else{sfx.hit();b.hitT=14;b.atk=null;shake=reduce?0:(dmg>=10?10:6);burst(hx,hy,a.ch.bit,10);milk(hx,hy);impact(hx,hy,false,dmg>=10);hitStop=dmg>=10?7:4;if(dmg>=10)glitchT=Math.max(glitchT,4);}
  if(mode===3&&a.side===1)dmg=Math.round(dmg*1.25);
  b.hp=Math.max(0,b.hp-dmg);b.vx=(b.x>a.x?1:-1)*kb;
  a.meter=Math.min(100,a.meter+(blocked?3:10));b.meter=Math.min(100,b.meter+4);
  if(b.hp<=0)endRound(a);
}
function P(o){parts.push(Object.assign({vx:0,vy:0,g:0,fr:1,rot:0,vr:0,r:4},o,{L:o.l}));}
function burst(x,y,c,n){
  for(let k=0;k<n;k++)P({k:'bit',x,y,vx:(Math.random()-.5)*10,vy:-2-Math.random()*8,g:.42,l:45+Math.random()*15,r:4+Math.random()*4,type:k%4,c,rot:Math.random()*6,vr:(Math.random()-.5)*.4});
  for(let k=0;k<n;k++){const an=Math.random()*6.28,sp=5+Math.random()*7;P({k:'spark',x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,g:.15,fr:.9,l:14+Math.random()*8,c:k%2?'#fff3a0':'#ffffff'});}
}
function milk(x,y){for(let k=0;k<10;k++)P({k:'milk',x,y,vx:(Math.random()-.5)*7,vy:-1-Math.random()*6,g:.35,l:34,r:2.5+Math.random()*3});}
function dust(x,y,n){for(let k=0;k<n;k++)P({k:'dust',x:x+(Math.random()-.5)*30,y:y-4,vx:(Math.random()-.5)*2.5,vy:-.3-Math.random()*.8,fr:.94,l:26+Math.random()*10,r:5+Math.random()*5});}
const POPS=['POW!','CRUNCH!','SNAP!','BAM!','WHACK!','CRACKLE!','SPLOOSH!'];
function impact(x,y,blocked,big){
  if(blocked){P({k:'ring',x,y,l:16,c:'#bff3ff',r:50});P({k:'pop',x,y:y-40,vy:-.8,fr:.95,l:36,t:'BLOCK!',c:'#3ec7ff',r:26,rot:(Math.random()-.5)*.3});return;}
  P({k:'star',x,y,l:9,c:'rgba(255,250,210,.95)',rot:Math.random()});
  P({k:'ring',x,y,l:18,c:'#ffffff',r:big?90:60});
  P({k:'pop',x:x+(Math.random()-.5)*30,y:y-50,vy:-.9,fr:.95,l:44,t:POPS[Math.floor(Math.random()*POPS.length)],c:big?'#ff4f8b':'#ffd23f',r:big?42:32,rot:(Math.random()-.5)*.4});
}
function endRound(w){
  if(winner>=0)return;
  winner=w?w.side:-2;
  const l=F.find(f=>f!==w);
  if(w){wins[w.side]++;w.won=true;if(l){l.st='ko';l.vy=-8;l.vx=(l.x>w.x?1:-1)*6;}}
  sfx.ko();banner=w?'K.O.!':'DRAW';bannerT=120;lineT=30;glitchT=14;slow=60;flash=reduce?0:12;shake=reduce?0:14;if(l)burst(l.x,l.y-100,'#ffd23f',16);
  setTimeout(()=>{
    if(mode===2?roundNo>=5:(wins[0]>=2||wins[1]>=2||roundNo>=3)){scene='over';}
    else{roundNo++;startRound();}
  },2200);
}

function update(){
  if(scene!=='fight')return;
  if(hitStop>0){hitStop--;return;}
  if(slow>0){slow--;if(slow%3)return;}
  tick++;
  if(bannerT>0)bannerT--;
  const frozen=bannerT>40&&winner<0;
  if(!frozen&&winner<0&&tick%60===0&&timer>0){timer--; if(timer===0){const [a,b]=F; endRound(a.hp===b.hp?null:(a.hp>b.hp?a:b));}}
  const [a,b]=F;
  if(!frozen){
    a.ctl=in1;a.held=()=>keys.Space||touch.attackHold;act(a,p1In(),b);
    b.ctl=mode!==1?null:in2;b.held=mode===1?()=>keys.KeyF:null;act(b,mode!==1?cpu(b,a):{...in2},a);
  }
  for(const f of F){
    f.vy+=0.8;f.x+=f.vx;f.y+=f.vy;
    if(f.y>=GROUND){if(f.vy>6)dust(f.x,GROUND,7);f.y=GROUND;f.vy=0;}
    if(f.st==='walk'&&f.t%14===0)dust(f.x-f.face*14,GROUND,1);
    if(f.st==='ko')f.kt=(f.kt||0)+1;
    f.x=Math.max(50,Math.min(W-50,f.x));
    if(!f.atk&&f.st!=='ko'&&f.hitT===0){const o=f===a?b:a;f.face=o.x>f.x?1:-1;}
    f.t++;
  }
  // push apart
  const gap=Math.abs(a.x-b.x);if(gap<60&&Math.abs(a.y-b.y)<80){const p=(60-gap)/2*(a.x<b.x?-1:1);a.x+=p;b.x-=p;}
  for(const s of shots){s.trail.push({x:s.x,y:s.y});if(s.trail.length>7)s.trail.shift();s.x+=s.vx;s.r+=0.3;const o=s.own===a?b:a;

/* every mascot is drawn in the art style of their own universe */
const STYLE={moose:'paint',croc:'print',yeti:'sketch',walrus:'news',octo:'neon',raccoon:'pixel',dillo:'bold',hippo:'gloss'};

}
function buildStyleAssets(){

  hatchCan=maskShade(x=>{x.strokeStyle='#2a1a40';x.lineWidth=1.3;for(let k=-FH;k<FW;k+=5){x.beginPath();x.moveTo(k,FH);x.lineTo(k+FH,0);x.stroke();}});
  const [p,px]=mkCanvas(FW,FH);const r=srand(5);
  for(let k=0;k<2600;k++){px.fillStyle=r()<.5?'rgba(255,255,255,.22)':'rgba(90,40,10,.12)';px.fillRect(r()*p.width,r()*p.height,1+r()*3*DPR,1+r()*3*DPR);}

}
const SMALL=mkCanvasF(FW,FH);
function ring(cx,src,o,n,alpha,jit){cx.globalAlpha=alpha;for(let k=0;k<n;k++){const an=k*Math.PI*2/n,j=jit?(Math.random()-.5)*jit*FD:0;cx.drawImage(src,Math.cos(an)*o*FD+j,Math.sin(an)*o*FD+j);}cx.globalAlpha=1;}
function renderFighter(f,x,y,sc,key){
  if(!hatchCan)buildStyleAssets();
  const st='clean';
  let C=fcache.get(key);
  if(!C){C={c:mkCanvasF(FW,FH)[0],last:-9};fcache.set(key,C);}
  if(frameNo-C.last>=(STEP[st]||1)||f.hitT>10){
    C.last=frameNo;
    const [oc,ox]=S1;
    ox.setTransform(1,0,0,1,0,0);ox.globalCompositeOperation='source-over';ox.clearRect(0,0,oc.width,oc.height);ox.setTransform(FD,0,0,FD,0,0);
    const saved=ctx;ctx=ox;drawFighter({...f,x:FOX,y:FOY});ctx=saved;

    if(st==='news'){const m=tintInto(oc,'#000');ox.globalCompositeOperation='color';ox.fillStyle='rgba(160,110,60,.75)';ox.fillRect(0,0,FW,FH);ox.globalCompositeOperation='destination-in';ox.setTransform(1,0,0,1,0,0);ox.drawImage(m,0,0);ox.setTransform(FD,0,0,FD,0,0);}

    const g=ox.createLinearGradient(FOX-90,FOY-240,FOX+40,FOY-80);g.addColorStop(0,'rgba(255,255,255,.3)');g.addColorStop(1,'rgba(255,255,255,0)');ox.fillStyle=g;ox.fillRect(0,0,FW,FH);

function eye(x,y,r,look){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle='#0d0820';ctx.beginPath();ctx.arc(x+look*r*.35,y,r*.5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+look*r*.35-1,y-2,r*.18,0,7);ctx.fill();}

let curFace=1;
function drawFighter(f){
  const c=f.ch,s=f.face;curFace=s;
  ctx.save();ctx.translate(f.x,f.y);
  // shadow
  if(f.st==='ko'){ctx.rotate(-s*Math.min(1.4,(f.kt=(f.kt||0))*0.08));}
  ctx.scale(s,1);
  const bob=f.st==='idle'?Math.sin(f.t/8)*2:f.st==='walk'?Math.abs(Math.sin(f.t/4))*-4:0;
  const a=f.atk, ext=a&&a.k!=='special'?(a.ph===1?1:a.ph===0?a.t/MOVES[a.k].start*.4:.3):0;
  const stepA=f.st==='walk'?Math.sin(f.t/4)*12:0;
  ctx.lineCap='round';
  // legs
  ctx.strokeStyle=c.col;ctx.lineWidth=16;
  const kick=a&&a.k==='kick'?ext:0;
  ctx.beginPath();ctx.moveTo(-14,-40);ctx.lineTo(-14-stepA*.5,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(14,-40);ctx.lineTo(14+stepA*.5+kick*70,-kick*45);ctx.stroke();
  ctx.fillStyle='#0d0820';ctx.beginPath();ctx.ellipse(-12-stepA*.5,0,12,6,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(18+stepA*.5+kick*72,-kick*45,12,6,0,0,7);ctx.fill();

  ctx.fillStyle=c.col2;ctx.beginPath();ctx.ellipse(6,-74,24,34,0,0,7);ctx.fill();
  // cereal emblem on belly
  ctx.fillStyle=c.bit;ctx.beginPath();ctx.arc(8,-74,9,0,7);ctx.fill();
  if(c.id==='moose'||c.id==='yeti'){ctx.fillStyle=c.col2;ctx.beginPath();ctx.arc(8,-74,4,0,7);ctx.fill();}
  // back arm (shield hand)
  ctx.strokeStyle=c.col;ctx.lineWidth=13;
  ctx.beginPath();ctx.moveTo(-20,-100);ctx.lineTo(blk?24:-36,blk?-96:-90);ctx.stroke();
  // head
  const hx=10,hy=-142;

  const sp=a&&a.k==='special'?Math.min(1,a.t/12):0;
  const hxA=blk?20:28+punch*34+sp*26, hyA=blk?-128:-96-sp*10;
  ctx.strokeStyle=c.col;ctx.lineWidth=14;
  ctx.beginPath();ctx.moveTo(18,-102);ctx.lineTo(hxA,hyA);ctx.stroke();
  // spoon angle: raised when idle, slashes forward on attack
  let ang=-1.25;
  if(a&&a.k==='punch'){ang=a.ph===0?-1.25-a.t/MOVES.punch.start*.6:a.ph===1?0.35:0.1;}
  else if(a&&a.k==='kick'){ang=a.ph===1?-0.2:-1.4;}

  if(a&&a.k==='punch'&&a.ph===1){ // swoosh

  }

function drawHead(c,x,y,f){

function txt(t,x,y,size,fill,align='center',font='Bungee'){
  ctx.font=`${size}px ${font},Impact,sans-serif`;ctx.textAlign=align;ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/6);
  ctx.strokeStyle='rgba(22,10,38,.6)';ctx.strokeText(t,x,y+Math.max(2,size/14));
  ctx.strokeStyle='#160a26';ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y);
}
function bigText(t,x,y,size,c1,c2,font='Bungee',sc=1,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.font=`${size}px ${font},Impact,sans-serif`;ctx.textAlign='center';ctx.lineJoin='round';
  ctx.lineWidth=size/4.2;ctx.strokeStyle='rgba(22,10,38,.55)';ctx.strokeText(t,0,size*.1);
  ctx.strokeStyle='#160a26';ctx.strokeText(t,0,0);
  ctx.lineWidth=size/9;ctx.strokeStyle='#ffffff';ctx.strokeText(t,0,0);
  const g=ctx.createLinearGradient(0,-size*.75,0,0);g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.fillStyle=g;ctx.fillText(t,0,0);
  ctx.restore();
}

function drawShot(s){
  const c=s.ch;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let k=0;k<s.trail.length;k++){const p=s.trail[k],a=(k+1)/s.trail.length;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,26*a);g.addColorStop(0,hexA(c.bit,.35*a));g.addColorStop(1,hexA(c.bit,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,26*a,0,7);ctx.fill();}
  const g=ctx.createRadialGradient(s.x,s.y,4,s.x,s.y,48);g.addColorStop(0,'rgba(255,255,230,.8)');g.addColorStop(.4,hexA(c.bit,.45));g.addColorStop(1,hexA(c.bit,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,48,0,7);ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);
  if(c.id==='moose')drawBit(0,0,15,0,c.bit,0);
  else if(c.id==='croc'){for(let k=0;k<5;k++)drawBit(Math.cos(k*1.26)*13,Math.sin(k*1.26)*13,8,1,c.bit,k);}
  else if(c.id==='yeti'){ctx.fillStyle='#160a26';starPath(0,0,28,13,6,0);ctx.fill();ctx.fillStyle='#eaf4ff';starPath(0,0,24,10,6,0);ctx.fill();drawBit(0,0,7,1,c.bit,0);}
  else if(c.id==='octo'){for(let k=0;k<6;k++)drawBit(Math.cos(k*1.05)*13,Math.sin(k*1.05)*13,6,3,c.bit,k);}
  else if(c.id==='raccoon'){for(let k=0;k<5;k++)drawBit(Math.cos(k*1.26)*12,Math.sin(k*1.26)*12,8,1,c.bit,k);drawBit(0,0,7,1,'#ffffff',0);}
  else if(c.id==='dillo'){ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(-29,-13,58,26,8);ctx.fill();ctx.fillStyle=c.bit;ctx.beginPath();ctx.roundRect(-26,-10,52,20,6);ctx.fill();ctx.fillStyle='#7a4a1a';for(let k=0;k<6;k++){ctx.beginPath();ctx.arc(-18+k*7,(k%2?4:-3),3,0,7);ctx.fill();}}
  else if(c.id==='hippo'){ctx.fillStyle='#160a26';ctx.beginPath();ctx.arc(0,0,21,0,7);ctx.fill();ctx.fillStyle=c.bit;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(-6,-6,6,0,7);ctx.fill();}
  else drawBit(0,0,16,2,c.bit,0);
  ctx.restore();
}

function drawParts(){
  for(const p of parts){
    const g=(p.L-p.l)/p.L,a=Math.max(0,Math.min(1,p.l/(p.L*.45)));
    ctx.globalAlpha=a;
    if(p.k==='bit')drawBit(p.x,p.y,p.r,p.type,p.c,p.rot);
    else if(p.k==='milk'){ctx.fillStyle='#fffdf5';ctx.strokeStyle='#cfc4aa';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*1.3,Math.atan2(p.vy,p.vx)+1.57,0,7);ctx.fill();ctx.stroke();}
    else if(p.k==='spark'){ctx.globalCompositeOperation='lighter';ctx.strokeStyle=p.c;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.5,p.y-p.vy*2.5);ctx.stroke();ctx.globalCompositeOperation='source-over';}
    else if(p.k==='dust'){ctx.globalAlpha=a*.75;ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+g*1.6),0,7);ctx.fill();ctx.strokeStyle='rgba(180,160,130,.5)';ctx.lineWidth=1.5;ctx.stroke();}
    else if(p.k==='ring'){ctx.strokeStyle=p.c;ctx.lineWidth=7*(1-g)+1;ctx.beginPath();ctx.arc(p.x,p.y,12+g*(p.r||60),0,7);ctx.stroke();}
    else if(p.k==='star'){ctx.globalCompositeOperation='lighter';ctx.fillStyle=p.c;starPath(p.x,p.y,22+g*46,8+g*14,8,p.rot);ctx.fill();ctx.globalCompositeOperation='source-over';}
    else if(p.k==='pop'){const sc=g<.15?.4+g/.15*.75:1.15-Math.min(.15,(g-.15)*.3);bigText(p.t,p.x,p.y,p.r,'#ffffff',p.c,'Bungee',sc,p.rot);}
  }
  ctx.globalAlpha=1;
}

function hud(){
  for(const f of F){
    const L=f.side===0,s=L?1:-1,x0=L?22:W-22,c=f.ch;
    if(f.hpLag===undefined)f.hpLag=f.hp; if(f.hpLag>f.hp)f.hpLag=Math.max(f.hp,f.hpLag-.5); else f.hpLag=f.hp;
    // portrait
    const px=x0+s*38,py=52;
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.arc(px,py,38,0,7);ctx.fill();
    const rg=ctx.createLinearGradient(0,py-36,0,py+36);rg.addColorStop(0,'#fff1a8');rg.addColorStop(.5,'#ffc531');rg.addColorStop(1,'#d98a00');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(px,py,35,0,7);ctx.fill();
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.arc(px,py,29,0,7);ctx.fill();
    const bgp=ctx.createRadialGradient(px-8,py-10,4,px,py,30);bgp.addColorStop(0,hexA(c.col2,1));bgp.addColorStop(1,hexA(c.bit,1));
    ctx.fillStyle=bgp;ctx.beginPath();ctx.arc(px,py,27,0,7);ctx.fill();
    const oc=fcache.get('f'+f.side);
    if(oc){ctx.save();ctx.beginPath();ctx.arc(px,py,27,0,7);ctx.clip();
      const hx=FOX+10*f.face,hy=FOY-150,R=58;
      ctx.drawImage(oc.c,(hx-R)*FD,(hy-R)*FD,R*2*FD,R*2*FD,px-30,py-26,60,60);ctx.restore();}
    // health bar
    const bw=330,bh=26,bx=L?x0+80:x0-80-bw,by=24;
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(bx-4,by-4,bw+8,bh+8,10);ctx.fill();
    ctx.fillStyle='#3b1d48';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,7);ctx.fill();
    const lw=bw*f.hpLag/100,hw=bw*f.hp/100;
    ctx.save();ctx.beginPath();ctx.roundRect(bx,by,bw,bh,7);ctx.clip();
    ctx.fillStyle='#ff5a6e';ctx.fillRect(L?bx:bx+bw-lw,by,lw,bh);
    const low=f.hp<=30,pul=low?.75+Math.sin(tick/5)*.25:1;
    const hg=ctx.createLinearGradient(0,by,0,by+bh);
    if(low){hg.addColorStop(0,'#ffc2d6');hg.addColorStop(.5,'#ff4f8b');hg.addColorStop(1,'#b0175a');}
    else{hg.addColorStop(0,'#fff6b0');hg.addColorStop(.5,'#ffd23f');hg.addColorStop(1,'#ef8f12');}
    ctx.globalAlpha=pul;ctx.fillStyle=hg;ctx.fillRect(L?bx:bx+bw-hw,by,hw,bh);ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(bx,by+3,bw,6);
    ctx.fillStyle='rgba(22,10,38,.25)';for(let k=1;k<10;k++)ctx.fillRect(bx+bw*k/10,by,2,bh);
    ctx.restore();
    ctx.lineWidth=2;ctx.strokeStyle='#ffd23f';ctx.beginPath();ctx.roundRect(bx-1,by-1,bw+2,bh+2,8);ctx.stroke();
    // name + wins
    txt(c.name,L?bx:bx+bw,by+bh+26,17,'#fff7e8',L?'left':'right');
    const nw=mode===2?5:2,sp=mode===2?20:26;for(let k=0;k<nw;k++){const wx=L?bx+bw-12-k*sp:bx+12+k*sp;drawBit(wx,by+bh+18,mode===2?6:7,0,k<wins[f.side]?'#ffd23f':'#4a3a66',0);}
    // special meter
    const mw=200,mx=L?bx:bx+bw-mw,my=by+bh+36;
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(mx-3,my-3,mw+6,16,6);ctx.fill();
    ctx.fillStyle='#2a1a4a';ctx.fillRect(mx,my,mw,10);
    const fw=mw*f.meter/100,mg=ctx.createLinearGradient(0,my,0,my+10);mg.addColorStop(0,'#b8f1ff');mg.addColorStop(1,'#1d9fd6');
    ctx.fillStyle=mg;ctx.fillRect(L?mx:mx+mw-fw,my,fw,10);
    ctx.fillStyle='#160a26';ctx.fillRect(mx+mw/2-1,my,3,10);
    if(f.meter>=50){ctx.save();ctx.shadowColor='#3ec7ff';ctx.shadowBlur=12+Math.sin(tick/6)*6;ctx.strokeStyle='#bff3ff';ctx.lineWidth=2;ctx.strokeRect(mx-1,my-1,mw+2,12);ctx.restore();
      ctx.font='13px Bungee,Impact,sans-serif';ctx.textAlign=L?'left':'right';ctx.fillStyle='#bff3ff';ctx.fillText(f.side===0?'HOLD SPACE!':(mode===1?'HOLD F!':'SPECIAL READY'),L?mx+mw+10:mx-10,my+11);}

  ctx.fillStyle='#160a26';ctx.beginPath();ctx.arc(tx,ty,30,0,7);ctx.fill();

  }
}

  const SW=ROSTER[sel[selStage]].id;bg(SW);bgTop(SW);overlay(.55);rays(W/2,280,'rgba(62,199,255,.06)');
  const who=mode===2?`PICK 5 FIGHTERS  ${team.length}/5`:mode===3?'EXPERT · PICK YOUR FIGHTER':mode===0?'PICK YOUR FIGHTER':(selStage===0?'PLAYER 1 · PICK':'PLAYER 2 · PICK');
  bigText(who,W/2,68,40,'#ffffff',selStage===0?'#ffd23f':'#3ec7ff');
  const hl=selStage===0?'#ffd23f':'#3ec7ff';
  ROSTER.forEach((c,i)=>{
    const x=60+(i%4)*210,y=100+Math.floor(i/4)*165,on=sel[selStage]===i,taken=mode===1&&selStage===1&&sel[0]===i;
    const lift=on&&!reduce?-4+Math.sin(tick/10)*2:0;
    ctx.save();ctx.translate(0,lift);
    if(on){ctx.save();ctx.shadowColor=hl;ctx.shadowBlur=24;ctx.fillStyle=hl;ctx.beginPath();ctx.roundRect(x-4,y-4,198,163,18);ctx.fill();ctx.restore();}
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(x,y,190,155,14);ctx.fill();
    const g=ctx.createLinearGradient(0,y,0,y+120);g.addColorStop(0,hexA(c.col2,.9));g.addColorStop(1,hexA(c.bit,.9));
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x+5,y+5,180,110,10);ctx.fill();
    ctx.save();ctx.beginPath();ctx.roundRect(x+5,y+5,180,110,10);ctx.clip();
    ctx.globalAlpha=.25;for(let k=0;k<6;k++)drawBit(x+20+k*32,y+24+(k%2)*60,9,k%4,'#ffffff',k);ctx.globalAlpha=1;
    shadowAt(x+92,y+110,0,.55);
    renderFighter({ch:c,face:1,st:on?'walk':'idle',t:tick+i*13,hitT:0,atk:null,noGear:true},x+88,y+110,.5,'s'+i);
    ctx.restore();
    ctx.fillStyle=on?hl:'#2a1a4a';ctx.beginPath();ctx.roundRect(x+5,y+119,180,31,9);ctx.fill();
    ctx.font=`${c.name.length>13?13:15}px Bungee,Impact,sans-serif`;ctx.textAlign='center';ctx.fillStyle=on?'#160a26':'#fff7e8';ctx.fillText(c.name,x+95,y+141);
    const ti=mode===2?team.indexOf(i):-1;
    if(ti>=0){ctx.fillStyle='rgba(18,8,40,.45)';ctx.beginPath();ctx.roundRect(x+5,y+5,180,110,10);ctx.fill();ctx.fillStyle='#160a26';ctx.beginPath();ctx.arc(x+166,y+26,19,0,7);ctx.fill();ctx.fillStyle='#ff4f8b';ctx.beginPath();ctx.arc(x+166,y+26,16,0,7);ctx.fill();ctx.font='12px Bungee,Impact,sans-serif';ctx.fillStyle='#fff';ctx.fillText('R'+(ti+1),x+166,y+31);}
    if(taken){ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(x+148,y+10,34,22,7);ctx.fill();ctx.font='13px Bungee,Impact,sans-serif';ctx.fillStyle='#ffd23f';ctx.fillText('P1',x+165,y+26);}
    ctx.restore();
  });
  { const on=sel[selStage]===0&&selStage===0,pulse=on&&!reduce?Math.sin(tick/6)*3:0;
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(10+pulse,118,40,130,12);ctx.fill();
    ctx.fillStyle=on?'#ffd23f':'#4a2f7a';ctx.beginPath();ctx.roundRect(13+pulse,121,34,124,10);ctx.fill();
    ctx.fillStyle=on?'#160a26':'#fff7e8';ctx.beginPath();ctx.moveTo(22+pulse,150);ctx.lineTo(38+pulse,140);ctx.lineTo(38+pulse,160);ctx.fill();
    ctx.save();ctx.translate(30+pulse,206);ctx.rotate(-Math.PI/2);ctx.font='13px Bungee,Impact,sans-serif';ctx.textAlign='center';ctx.fillText('BACK',0,5);ctx.restore(); }
  const c=ROSTER[sel[selStage]];
  if(mode===2){drawSlots();}else{
  ctx.font='800 17px Nunito,sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff7e8';ctx.fillText(c.cereal+' · '+c.tag,W/2,462);
  txt('SPECIAL: '+c.special.toUpperCase(),W/2,492,20,'#ff6fa3');
  ctx.font='700 13px Nunito,sans-serif';ctx.fillStyle='#d9cff5';ctx.fillText('Arrows choose · Enter / tap again to lock in · ← on Maple Moose goes back',W/2,522);}
  vignette();
}


function addPick(i){
  if(team.includes(i)){beep(160,.12,'square',.05);return;}
  team.push(i);sfx.sel();
  if(team.length===5){
    const pool=[...Array(N).keys()];for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]];}
    cpuTeam=pool.slice(0,5);scene='lineup';lineupT=0;sfx.special();
  }
}
function drawSlots(){
  for(let k=0;k<5;k++){
    const x=W/2-203+k*84,y=436,has=k<team.length;
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(x,y,70,70,12);ctx.fill();
    ctx.fillStyle=has?hexA(ROSTER[team[k]].col2,.95):'#2a1a4a';ctx.beginPath();ctx.roundRect(x+4,y+4,62,62,9);ctx.fill();
    if(has){ctx.save();ctx.beginPath();ctx.roundRect(x+4,y+4,62,62,9);ctx.clip();
      renderFighter({ch:ROSTER[team[k]],face:1,st:'idle',t:tick+k*9,hitT:0,atk:null,noGear:true},x+33,y+86,.33,'slot'+k);ctx.restore();}
    else{ctx.font='22px Bungee,Impact,sans-serif';ctx.textAlign='center';ctx.fillStyle=k===team.length?'#ffd23f':'#5a4a7a';ctx.fillText('?',x+35,y+44);}
    ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(x+20,y-10,30,18,6);ctx.fill();
    ctx.font='11px Bungee,Impact,sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.fillText('R'+(k+1),x+35,y+4);
  }
  ctx.font='700 13px Nunito,sans-serif';ctx.textAlign='center';ctx.fillStyle='#d9cff5';
  ctx.fillText('Enter / tap a fighter twice to add · Backspace or tap a slot to remove',W/2,526);
}
function drawLineup(){
  bg(ROSTER[cpuTeam[0]].id);overlay(.6);rays(W/2,H/2,'rgba(255,79,139,.07)');
  bigText('BONUS CHALLENGE',W/2,62,44,'#ffffff','#ff4f8b');
  for(const [row,arr,label,col,face] of [[0,team,'YOU','#ffd23f',1],[1,cpuTeam,'CPU','#3ec7ff',-1]]){
    const gy=row?452:256;
    txt(row?'CPU':'YOU',72,gy-54,26,col);
    arr.forEach((ci,k)=>{const x=180+k*150,appear=Math.min(1,Math.max(0,(lineupT-k*8-row*40)/12));if(appear<=0)return;
      ctx.save();ctx.globalAlpha=appear;
      ctx.fillStyle='#160a26';ctx.beginPath();ctx.roundRect(x-22,gy-136,44,20,6);ctx.fill();
      ctx.font='12px Bungee,Impact,sans-serif';ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText('R'+(k+1),x,gy-121);
      shadowAt(x,gy,0,.6);
      renderFighter({ch:ROSTER[ci],face,st:'idle',t:tick+k*11,hitT:0,atk:null},x,gy-(1-appear)*30,.55,'lu'+row+k);
      ctx.restore();});
  }
  bigText('VS',72,318,36,'#ffffff','#ffd23f','Bungee',1+(reduce?0:Math.sin(tick/8)*.06));
  ctx.font='700 14px Nunito,sans-serif';ctx.textAlign='center';ctx.fillStyle='#d9cff5';ctx.fillText('Each round, your fighter faces the CPU fighter below them · Enter or tap to start',W/2,524);
  vignette();
}
function drawBonusOver(){
  const draw=wins[0]===wins[1],w=wins[0]>wins[1]?0:1;
  bigText(draw?"IT'S A DRAW!":w===0?'CHALLENGE COMPLETE!':'CPU WINS THE CHALLENGE',W/2,112,draw?70:w===0?58:50,'#ffffff','#ffd23f','Bungee',1+(reduce?0:Math.sin(tick/12)*.03));
  txt('YOU '+wins[0]+' - '+wins[1]+' CPU',W/2,166,30,'#fff7e8');
  const arr=draw||w===0?team:cpuTeam;
  arr.forEach((ci,k)=>{const x=180+k*150;shadowAt(x,420,0,.75);renderFighter({ch:ROSTER[ci],face:k<2?1:k>2?-1:1,st:'walk',t:tick+k*10,hitT:0,atk:null},x,420,.75,'bo'+k);});
  txt(draw?'EVERYBODY GETS SECOND BREAKFAST':w===0?'YOUR TEAM RULES THE BOWL':'THE CPU TEAM TAKES THE BOWL',W/2,476,20,'#fff7e8');
}

function drawOver(){
  const OW=ROSTER[sel[wins[0]>=wins[1]?0:1]].id;bg(OW);bgTop(OW);overlay(.5);rays(W/2,330,'rgba(255,210,63,.1)');
  for(let k=0;k<40;k++){const x=(k*137.5)%W,y=((tick*(1.2+(k%5)*.3)+k*53)%(H+40))-20;drawBit(x,y,6+(k%3)*2,k%4,ROSTER[k%N].bit,tick/20+k);}
  if(mode===2){drawBonusOver();}
  else if(wins[0]===wins[1]){
    bigText("IT'S A DRAW!",W/2,120,70,'#ffffff','#ffd23f');
    shadowAt(W/2-130,430,0,1.1);shadowAt(W/2+130,430,0,1.1);
    renderFighter({ch:ROSTER[sel[0]],face:1,st:'walk',t:tick,hitT:0,atk:null},W/2-130,430,1.1,'oA');
    renderFighter({ch:ROSTER[sel[1]],face:-1,st:'walk',t:tick+20,hitT:0,atk:null},W/2+130,430,1.1,'oB');
    txt('THE BOWL IS SHARED TODAY',W/2,474,20,'#fff7e8');
  }else{
    const w=wins[0]>wins[1]?0:1,c=ROSTER[sel[w]];
    const label=mode===0||mode===3?(w===0?(mode===3?'EXPERT CHAMPION!':'YOU WIN!'):'CPU WINS'):`PLAYER ${w+1} WINS!`;
    bigText(label,W/2,118,74,'#ffffff','#ffd23f','Bungee',1+(reduce?0:Math.sin(tick/12)*.03));
    txt(wins[w]+' - '+wins[1-w],W/2,168,30,'#fff7e8');
    shadowAt(W/2,440,0,1.3);
    renderFighter({ch:c,face:1,st:'walk',t:tick,hitT:0,atk:null},W/2,440,1.3,'oA');
    txt(c.name+' IS PART OF A BALANCED BREAKFAST',W/2,480,20,'#fff7e8');
  }
  ctx.font='700 15px Nunito,sans-serif';ctx.textAlign='center';ctx.fillStyle='#d9cff5';ctx.fillText('Enter or tap to play again',W/2,516);
  vignette();
}

const STEP_MS=1000/60;let lastT=0,acc=0;
function step(){
  frameNo++;
  update();
  if(scene!=='fight')tick++;
  if(scene==='lineup'){lineupT++;if(lineupT===300)startMatch();}
  if(flash>0)flash--;
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();
  if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(scene==='title')drawTitle();
  else if(scene==='select')drawSelect();
  else if(scene==='over')drawOver();
  else if(scene==='lineup')drawLineup();
  else{
    bg();
    for(const f of F)shadowAt(f.x,GROUND+2,GROUND-f.y,1);
    for(const s of shots)drawShot(s);
    const order=[...F].sort((p,q)=>(p.atk?1:0)-(q.atk?1:0));
    for(const f of order){if(f.charge>0)chargeAura(f,true);renderFighter(f,f.x,f.y,1,'f'+f.side);if(f.charge>0)chargeAura(f,false);}
    bgTop();
    drawParts();
    vignette();
    hud();
  }
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash/14})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}
/* the game always runs at 60 steps a second, whatever the screen's refresh rate or drawing speed */
function frame(now){
  if(!lastT)lastT=now;
  let dt=now-lastT;lastT=now;if(dt>200)dt=200;
  acc+=dt;let n=0;
  while(acc>=STEP_MS&&n<4){step();acc-=STEP_MS;n++;}
  if(n===4)acc=0;
  if(n>0)render();
  requestAnimationFrame(frame);
}
document.fonts&&document.fonts.ready.then(()=>{bgWall=null;});
cv.focus();
requestAnimationFrame(frame);
</script>
