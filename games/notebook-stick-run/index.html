<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Notebook Stick Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Layout: one screen — a sheet of notebook paper with the game canvas taped in the middle, touch pad below on phones. Single deliberate "paper" world. */
:root {
  --paper: #fbfaf4;
  --line: #b9d3ea;
  --margin: #e8a3a3;
  --ink: #23324a;
  --pencil: #5d6470;
  --marker: #e2552d;
  --high: #ffd84d;
  --display: "Gochi Hand", "Comic Sans MS", "Marker Felt", cursive;
  --body: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  background-image:
    linear-gradient(90deg, transparent 54px, var(--margin) 54px, var(--margin) 56px, transparent 56px),
    repeating-linear-gradient(var(--paper) 0 31px, var(--line) 31px 32px);
}
.wrap {
  height: 100%;
  box-sizing: border-box;
  padding-inline: 16px;
  padding-block: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  max-width: 1000px;
  margin: 0 auto;
}
header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 16px;
}
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(30px, 6vw, 46px);
  margin: 0;
  line-height: 1;
  transform: rotate(-1.5deg);
}
h1 span { background: linear-gradient(transparent 55%, var(--high) 55%, var(--high) 90%, transparent 90%); padding: 0 4px; }
.hint { color: var(--pencil); margin: 0; font-size: 17px; }
.hint kbd {
  font-family: var(--body);
  border: 1.5px solid var(--pencil);
  border-radius: 5px 7px 4px 6px;
  padding: 0 5px;
  background: var(--paper);
}
.stage {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 9;
  max-height: calc(100% - 150px);
  border: 2.5px solid var(--ink);
  border-radius: 8px 14px 10px 6px;
  box-shadow: 4px 5px 0 var(--ink);
  background: var(--paper);
  overflow: hidden;
  min-height: 200px;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.pad {
  display: none;
  width: 100%;
  justify-content: space-between;
  gap: 12px;
  user-select: none;
  -webkit-user-select: none;
}
.pad .grp { display: flex; gap: 12px; }
.pad button {
  font-family: var(--display);
  font-size: 26px;
  width: 72px;
  height: 64px;
  border: 2.5px solid var(--ink);
  border-radius: 12px 9px 14px 10px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  touch-action: none;
}
.pad button.jump { width: 110px; background: var(--high); }
.pad button.on { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible { outline: 3px dashed var(--marker); outline-offset: 3px; }
@media (hover: none) and (pointer: coarse) {
  .pad { display: flex; }
  .hint .keys { display: none; }
}
</style>

<div class="wrap">
  <header>
    <h1><span>Stick Run</span></h1>
    <p class="hint"><span class="keys"><kbd>←</kbd> <kbd>→</kbd> run · <kbd>Space</kbd> jump · <kbd>P</kbd> pause</span> · grab stars, dodge scribbles, reach the flag</p>
  </header>
  <div class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Stick Run game"></canvas></div>
  <div class="pad" aria-label="Touch controls">
    <div class="grp">
      <button id="bLeft" aria-label="Run left">◀</button>
      <button id="bRight" aria-label="Run right">▶</button>
    </div>
    <button id="bJump" class="jump" aria-label="Jump">jump!</button>
  </div>
</div>

<script>
(() => {
  const W = 960, H = 540;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const C = {
    paper: '#fbfaf4', line: '#b9d3ea', margin: '#e8a3a3', ink: '#23324a',
    pencil: '#5d6470', marker: '#e2552d', high: '#ffd84d', green: '#3e9a5b'
  };
  const FONT = '"Gochi Hand", "Comic Sans MS", cursive';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- input ----------
  const keys = { left: false, right: false, jump: false };
  let jumpQueued = false;
  const map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump' };
  addEventListener('keydown', e => {
    if (map[e.code]) {
      e.preventDefault();
      if (map[e.code] === 'jump' && !keys.jump) jumpQueued = true;
      keys[map[e.code]] = true;
      if (state === 'title' || state === 'over' || state === 'win') { if (map[e.code] === 'jump') startOrNext(); }
    }
    if (e.code === 'KeyP' && state === 'play') paused = !paused;
    if (e.code === 'Enter' && state !== 'play') startOrNext();
  });
  addEventListener('keyup', e => { if (map[e.code]) keys[map[e.code]] = false; });
  function bindBtn(id, k) {
    const b = document.getElementById(id);
    const down = e => { e.preventDefault(); if (k === 'jump') { jumpQueued = true; if (state !== 'play') startOrNext(); } keys[k] = true; b.classList.add('on'); };
    const up = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('pointercancel', up);
  }
  bindBtn('bLeft', 'left'); bindBtn('bRight', 'right'); bindBtn('bJump', 'jump');
  cv.addEventListener('pointerdown', () => { cv.focus(); if (state !== 'play') startOrNext(); });

  // ---------- seeded random so each page wobble is stable ----------
  function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  // ---------- level generation ----------
  const GROUND = 470;
  let level = 1, lives = 3, score = 0, best = 0;
  try { best = +localStorage.getItem('stickrun-best') || 0; } catch (e) {}
  let L; // current level data

  function buildLevel(n) {
    const r = rng(n * 977 + 13);
    const length = 2600 + n * 700;
    const ground = [], plats = [], spikes = [], stars = [], foes = [];
    let x = -200;
    ground.push({ x, w: 900 }); x += 900;
    while (x < length) {
      const gap = 90 + r() * (60 + n * 12);
      x += Math.min(gap, 210);
      const w = 260 + r() * 420;
      ground.push({ x, w });
      // spikes on ground segment
      if (r() < 0.35 + n * 0.06 && w > 300) spikes.push({ x: x + 100 + r() * (w - 220), w: 40 + (r() < 0.4 ? 30 : 0) });
      // enemy patrol
      if (r() < 0.3 + n * 0.08 && w > 320) foes.push({ x: x + w / 2, y: GROUND, minX: x + 20, maxX: x + w - 20, vx: (r() < .5 ? -1 : 1) * (1 + n * 0.25), alive: true, t: r() * 10 });
      // floating platform with stars
      if (r() < 0.6) {
        const pw = 110 + r() * 80, py = GROUND - 110 - r() * 90;
        const px = x + r() * Math.max(10, w - pw);
        plats.push({ x: px, y: py, w: pw });
        for (let i = 0; i < 3; i++) stars.push({ x: px + pw / 2 + (i - 1) * 32, y: py - 34, got: false });
      } else {
        for (let i = 0; i < 4; i++) stars.push({ x: x + 60 + i * 40, y: GROUND - 40 - Math.sin(i / 3 * Math.PI) * 30, got: false });
      }
      x += w;
    }
    // final pad and flag
    x += 120;
    ground.push({ x, w: 600 });
    const flag = { x: x + 260, y: GROUND };
    return { length: x + 600, ground, plats, spikes, stars, foes, flag, seed: n };
  }

  // ---------- player ----------
  const P = { x: 0, y: 0, vx: 0, vy: 0, w: 26, h: 64, onGround: false, coyote: 0, face: 1, run: 0, inv: 0, dead: 0, squash: 0 };
  function resetPlayer() {
    Object.assign(P, { x: 80, y: GROUND - 64, vx: 0, vy: 0, onGround: false, coyote: 0, face: 1, run: 0, dead: 0, squash: 0 });
  }

  let state = 'title', paused = false, cam = 0, msgT = 0, particles = [];
  function startOrNext() {
    if (state === 'title' || state === 'over') { level = 1; lives = 3; score = 0; }
    else if (state === 'win') { level++; }
    L = buildLevel(level); resetPlayer(); cam = 0; particles = []; state = 'play'; paused = false; msgT = 120;
  }

  function solidsAt() {
    const s = L.ground.map(g => ({ x: g.x, y: GROUND, w: g.w, h: 200, oneway: false }));
    L.plats.forEach(p => s.push({ x: p.x, y: p.y, w: p.w, h: 14, oneway: true }));
    return s;
  }

  function hurt() {
    if (P.inv > 0 || P.dead) return;
    lives--;
    burst(P.x + P.w / 2, P.y + 20, C.marker, 18);
    if (lives <= 0) { P.dead = 1; P.vy = -11; return; }
    P.inv = 100; P.vy = -9; P.vx = -P.face * 5;
  }
  function burst(x, y, col, n) {
    if (reduced) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 8, vy: -Math.random() * 7, life: 40 + Math.random() * 20, col });
  }

  // ---------- update ----------
  function update() {
    if (state !== 'play' || paused) return;
    if (msgT > 0) msgT--;

    if (P.dead) {
      P.vy += 0.6; P.y += P.vy;
      if (P.y > H + 300) { state = 'over'; saveBest(); }
      tickParticles(); return;
    }

    const acc = P.onGround ? 0.9 : 0.6, max = 6.2;
    if (keys.left) { P.vx -= acc; P.face = -1; }
    if (keys.right) { P.vx += acc; P.face = 1; }
    if (!keys.left && !keys.right) P.vx *= P.onGround ? 0.75 : 0.93;
    P.vx = Math.max(-max, Math.min(max, P.vx));

    if (P.onGround) P.coyote = 7; else if (P.coyote > 0) P.coyote--;
    if (jumpQueued && P.coyote > 0) { P.vy = -13.2; P.coyote = 0; P.onGround = false; P.squash = -6; }
    jumpQueued = false;
    if (!keys.jump && P.vy < -4) P.vy += 0.9; // short hop
    P.vy = Math.min(P.vy + 0.62, 16);

    // horizontal
    const solids = solidsAt();
    P.x += P.vx;
    if (P.x < -180) { P.x = -180; P.vx = 0; }
    for (const s of solids) {
      if (s.oneway) continue;
      if (P.x + P.w > s.x && P.x < s.x + s.w && P.y + P.h > s.y + 2 && P.y < s.y + s.h) {
        if (P.vx > 0) P.x = s.x - P.w; else if (P.vx < 0) P.x = s.x + s.w;
        P.vx = 0;
      }
    }
    // vertical
    const prevBottom = P.y + P.h;
    P.y += P.vy;
    const wasGround = P.onGround;
    P.onGround = false;
    for (const s of solids) {
      if (P.x + P.w > s.x + 2 && P.x < s.x + s.w - 2) {
        if (P.vy >= 0 && prevBottom <= s.y + 1 && P.y + P.h >= s.y) {
          P.y = s.y - P.h; P.vy = 0; P.onGround = true;
        } else if (!s.oneway && P.vy < 0 && P.y < s.y + s.h && P.y + P.h > s.y + s.h) {
          P.y = s.y + s.h; P.vy = 0;
        }
      }
    }
    if (P.onGround && !wasGround) P.squash = 6;
    if (P.squash > 0) P.squash--; else if (P.squash < 0) P.squash++;

    P.run += Math.abs(P.vx) * 0.09;
    if (P.inv > 0) P.inv--;

    // fell
    if (P.y > H + 60) {
      lives--;
      burst(P.x, H - 10, C.pencil, 10);
      if (lives <= 0) { state = 'over'; saveBest(); return; }
      // respawn at last ground before here
      let g = L.ground[0];
      for (const s of L.ground) if (s.x < P.x) g = s;
      P.x = g.x + 30; P.y = GROUND - P.h - 40; P.vx = 0; P.vy = 0; P.inv = 90;
    }

    // spikes
    for (const s of L.spikes) {
      if (P.x + P.w > s.x + 6 && P.x < s.x + s.w - 6 && P.y + P.h > GROUND - 22) hurt();
    }
    // stars
    for (const s of L.stars) {
      if (!s.got && Math.abs(P.x + P.w / 2 - s.x) < 26 && Math.abs(P.y + P.h / 2 - s.y) < 40) {
        s.got = true; score += 10; burst(s.x, s.y, C.high, 8);
      }
    }
    // foes
    for (const f of L.foes) {
      if (!f.alive) continue;
      f.x += f.vx; f.t += 0.15;
      if (f.x < f.minX || f.x > f.maxX) f.vx *= -1;
      const fw = 36, fh = 30;
      const fx = f.x - fw / 2, fy = f.y - fh;
      if (P.x + P.w > fx && P.x < fx + fw && P.y + P.h > fy && P.y < fy + fh) {
        if (P.vy > 0 && prevBottom <= fy + 12) {
          f.alive = false; P.vy = keys.jump ? -13 : -9; score += 25;
          burst(f.x, fy + 10, C.ink, 14);
        } else hurt();
      }
    }
    // flag
    if (P.x + P.w > L.flag.x - 10) {
      score += 100 + lives * 20;
      burst(L.flag.x, L.flag.y - 120, C.green, 26);
      state = 'win'; saveBest();
    }

    // camera
    const target = P.x - W * 0.38 + P.face * 60;
    cam += (target - cam) * 0.08;
    cam = Math.max(-200, Math.min(cam, L.length - W));

    tickParticles();
  }
  function tickParticles() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }
  function saveBest() {
    if (score > best) { best = score; try { localStorage.setItem('stickrun-best', best); } catch (e) {} }
  }

  // ---------- drawing helpers (wobbly pencil look) ----------
  let frame = 0;
  const jit = (i, a = 1.2) => reduced ? 0 : Math.sin(i * 12.9898 + Math.floor(frame / 8) * 78.233) * a;

  function wobLine(x1, y1, x2, y2, seed = 0, width = 2.5, col = C.ink) {
    ctx.strokeStyle = col; ctx.lineWidth = width; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1 + jit(seed), y1 + jit(seed + 1));
    const mx = (x1 + x2) / 2 + jit(seed + 2, 1.6), my = (y1 + y2) / 2 + jit(seed + 3, 1.6);
    ctx.quadraticCurveTo(mx, my, x2 + jit(seed + 4), y2 + jit(seed + 5));
    ctx.stroke();
  }

  function drawPaper() {
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
    const off = (cam * 0.2) % 32;
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    for (let y = 30; y < H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // margin line scrolls slowly, holes on the left
    const mx = 70 - cam * 0.2;
    if (mx > -10) {
      ctx.strokeStyle = C.margin; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, H); ctx.stroke();
    }
    // background doodles: little clouds and a sun drawn in pencil
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 12; i++) {
      const bx = i * 420 - (cam * 0.35) % (420 * 12) ;
      const x = ((bx % (420 * 12)) + 420 * 12) % (420 * 12) - 200, y = 70 + (i * 53) % 110;
      cloud(x, y, i);
    }
    ctx.restore();
  }
  function cloud(x, y, s) {
    ctx.strokeStyle = C.pencil; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 18, Math.PI, 0);
    ctx.arc(x + 28, y - 6, 22, Math.PI, 0);
    ctx.arc(x + 58, y, 16, Math.PI, 0);
    ctx.lineTo(x - 18, y);
    ctx.stroke();
  }

  function drawWorld() {
    ctx.save();
    ctx.translate(-Math.round(cam), 0);
    // ground: hatched pencil blocks
    L.ground.forEach((g, i) => {
      if (g.x + g.w < cam - 20 || g.x > cam + W + 20) return;
      ctx.fillStyle = C.paper; ctx.fillRect(g.x, GROUND, g.w, H - GROUND);
      ctx.save();
      ctx.beginPath(); ctx.rect(g.x, GROUND, g.w, H - GROUND); ctx.clip();
      ctx.strokeStyle = C.pencil; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.3;
      for (let hx = g.x - 80; hx < g.x + g.w; hx += 12) { ctx.beginPath(); ctx.moveTo(hx, H); ctx.lineTo(hx + 70, GROUND); ctx.stroke(); }
      ctx.restore();
      wobLine(g.x, GROUND, g.x + g.w, GROUND, i * 7, 3);
      wobLine(g.x, GROUND, g.x, H, i * 7 + 2, 2.5);
      wobLine(g.x + g.w, GROUND, g.x + g.w, H, i * 7 + 4, 2.5);
      // grass tufts
      for (let t = g.x + 20; t < g.x + g.w - 10; t += 47) {
        wobLine(t, GROUND, t - 4, GROUND - 9, t, 1.6, C.green);
        wobLine(t + 3, GROUND, t + 6, GROUND - 11, t + 1, 1.6, C.green);
      }
    });
    // platforms: torn sticky-note strips
    L.plats.forEach((p, i) => {
      if (p.x + p.w < cam - 20 || p.x > cam + W + 20) return;
      ctx.fillStyle = C.high; ctx.globalAlpha = 0.85;
      ctx.fillRect(p.x, p.y, p.w, 14); ctx.globalAlpha = 1;
      wobLine(p.x, p.y, p.x + p.w, p.y, i * 11, 2.5);
      wobLine(p.x, p.y + 14, p.x + p.w, p.y + 14, i * 11 + 3, 2);
    });
    // spikes: zigzag in red marker
    L.spikes.forEach((s, i) => {
      ctx.strokeStyle = C.marker; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, GROUND);
      const n = Math.round(s.w / 14);
      for (let k = 0; k < n; k++) {
        ctx.lineTo(s.x + (k + .5) * (s.w / n) + jit(i * 9 + k, .8), GROUND - 22 + jit(i * 9 + k + 3, 1));
        ctx.lineTo(s.x + (k + 1) * (s.w / n), GROUND);
      }
      ctx.stroke();
    });
    // stars
    L.stars.forEach((s, i) => {
      if (s.got) return;
      const bob = reduced ? 0 : Math.sin(frame / 15 + i) * 3;
      starShape(s.x, s.y + bob, 11, i);
    });
    // foes: angry scribble balls
    L.foes.forEach((f, i) => {
      if (!f.alive) return;
      const cx = f.x, cy = f.y - 16;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 7; a += 0.35) {
        const r = 13 + Math.sin(a * 3 + f.t) * 3;
        const px = cx + Math.cos(a) * r + Math.sin(a * 5 + f.t) * 2;
        const py = cy + Math.sin(a) * r * 0.9;
        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
      // eyes
      const d = Math.sign(f.vx);
      ctx.fillStyle = C.paper;
      ctx.beginPath(); ctx.arc(cx - 5 + d * 3, cy - 3, 5, 0, 7); ctx.arc(cx + 6 + d * 3, cy - 3, 5, 0, 7); ctx.fill();
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(cx - 4 + d * 5, cy - 2, 2.2, 0, 7); ctx.arc(cx + 7 + d * 5, cy - 2, 2.2, 0, 7); ctx.fill();
      wobLine(cx - 10, cy - 10, cx - 1, cy - 7, i, 2); wobLine(cx + 12, cy - 10, cx + 3, cy - 7, i + 2, 2);
      // little feet
      const st = Math.sin(f.t * 2) * 4;
      wobLine(cx - 6, cy + 12, cx - 8 + st, cy + 17, i + 4, 2); wobLine(cx + 6, cy + 12, cx + 8 - st, cy + 17, i + 5, 2);
    });
    // flag
    const fx = L.flag.x, fy = L.flag.y;
    wobLine(fx, fy, fx, fy - 170, 3, 3.5);
    const wave = reduced ? 0 : Math.sin(frame / 8) * 6;
    ctx.fillStyle = C.green;
    ctx.beginPath(); ctx.moveTo(fx, fy - 170); ctx.quadraticCurveTo(fx + 40, fy - 165 + wave, fx + 80, fy - 150);
    ctx.quadraticCurveTo(fx + 40, fy - 135 - wave, fx, fy - 125); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = C.ink; ctx.font = `26px ${FONT}`; ctx.fillText('finish!', fx + 14, fy - 185);

    drawStick();

    particles.forEach(p => {
      ctx.globalAlpha = Math.min(1, p.life / 30);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function starShape(x, y, r, seed) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r;
      const px = x + Math.cos(a) * rr + jit(seed + k, .6), py = y + Math.sin(a) * rr + jit(seed + k + 1, .6);
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = C.high; ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawStick() {
    if (P.inv > 0 && Math.floor(P.inv / 5) % 2 === 0 && !P.dead) return;
    const cx = P.x + P.w / 2;
    const sq = P.squash;
    const footY = P.y + P.h;
    const hipY = footY - 26 + Math.max(0, sq);
    const neckY = hipY - 24 + Math.max(0, sq) * 0.3;
    const headY = neckY - 12;
    const f = P.face;
    const moving = Math.abs(P.vx) > 0.5 && P.onGround;
    const sw = moving ? Math.sin(P.run) : 0;
    const air = !P.onGround;
    const lean = P.vx * 0.9;

    ctx.save();
    if (P.dead) { ctx.translate(cx, hipY); ctx.rotate(frame * 0.2); ctx.translate(-cx, -hipY); }
    // legs
    let l1x, l1y, l2x, l2y, k1x, k1y, k2x, k2y;
    if (air) {
      k1x = cx + f * 10; k1y = hipY + 10; l1x = cx + f * 4; l1y = footY - 4;
      k2x = cx - f * 6; k2y = hipY + 14; l2x = cx - f * 12; l2y = footY - 2;
    } else {
      l1x = cx + sw * 14; l1y = footY; l2x = cx - sw * 14; l2y = footY;
      k1x = cx + sw * 9 + f * 4; k1y = hipY + 13 - Math.max(0, sw) * 3;
      k2x = cx - sw * 9 + f * 4; k2y = hipY + 13 - Math.max(0, -sw) * 3;
    }
    wobLine(cx, hipY, k1x, k1y, 21, 3.2); wobLine(k1x, k1y, l1x, l1y, 22, 3.2);
    wobLine(cx, hipY, k2x, k2y, 23, 3.2); wobLine(k2x, k2y, l2x, l2y, 24, 3.2);
    // body
    wobLine(cx, hipY, cx + lean, neckY, 25, 3.4);
    // arms
    const ax = cx + lean * 0.8, ay = neckY + 5;
    if (air) {
      wobLine(ax, ay, ax + f * 12, ay - 16, 26, 3); wobLine(ax, ay, ax - f * 14, ay - 10, 27, 3);
    } else {
      wobLine(ax, ay, ax - sw * 13, ay + 18, 26, 3); wobLine(ax, ay, ax + sw * 13, ay + 18, 27, 3);
    }
    // head
    const hx = cx + lean * 1.1, hy = headY;
    ctx.fillStyle = C.paper; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(hx + jit(30, .5), hy, 12, 12.5, 0, 0, 7); ctx.fill(); ctx.stroke();
    // face
    ctx.fillStyle = C.ink;
    if (P.dead) {
      wobLine(hx + f * 2, hy - 5, hx + f * 8, hy + 1, 31, 2); wobLine(hx + f * 8, hy - 5, hx + f * 2, hy + 1, 32, 2);
    } else {
      ctx.beginPath(); ctx.arc(hx + f * 5, hy - 2, 1.9, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.8;
      ctx.arc(hx + f * 4, hy + 3, 4, f > 0 ? 0.1 : Math.PI * 0.5, f > 0 ? Math.PI * 0.5 : Math.PI - 0.1); ctx.stroke();
    }
    // red headband, trailing behind
    ctx.strokeStyle = C.marker; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(hx, hy, 12, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    const tail = reduced ? 0 : Math.sin(frame / 4) * 3;
    wobLine(hx - f * 11, hy - 6, hx - f * 24, hy - 2 + tail, 33, 3, C.marker);
    wobLine(hx - f * 11, hy - 6, hx - f * 21, hy + 5 - tail, 34, 3, C.marker);
    ctx.restore();
  }

  function drawHUD() {
    ctx.font = `30px ${FONT}`; ctx.fillStyle = C.ink; ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(`page ${level}`, 90, 14);
    // hearts
    for (let i = 0; i < 3; i++) heart(250 + i * 34, 30, i < lives);
    ctx.textAlign = 'right';
    ctx.fillText(`★ ${score}`, W - 24, 14);
    ctx.font = `20px ${FONT}`; ctx.fillStyle = C.pencil;
    ctx.fillText(`best ${best}`, W - 24, 46);
    // progress pencil
    if (L) {
      const pr = Math.max(0, Math.min(1, P.x / L.flag.x));
      ctx.strokeStyle = C.line; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(380, 32); ctx.lineTo(620, 32); ctx.stroke();
      ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.moveTo(380, 32); ctx.lineTo(380 + 240 * pr, 32); ctx.stroke();
      ctx.fillStyle = C.marker; ctx.beginPath(); ctx.arc(380 + 240 * pr, 32, 5, 0, 7); ctx.fill();
      ctx.fillStyle = C.green; ctx.fillRect(620, 22, 3, 18);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  function heart(x, y, full) {
    ctx.beginPath();
    ctx.moveTo(x, y + 8);
    ctx.bezierCurveTo(x - 16, y - 2, x - 8, y - 14, x, y - 5);
    ctx.bezierCurveTo(x + 8, y - 14, x + 16, y - 2, x, y + 8);
    if (full) { ctx.fillStyle = C.marker; ctx.fill(); }
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
  }

  function card(title, lines, cta) {
    ctx.save();
    ctx.translate(W / 2, H / 2 - 10);
    ctx.rotate(-0.02);
    ctx.fillStyle = C.high; ctx.globalAlpha = 0.95;
    ctx.fillRect(-250, -120, 500, 240);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.strokeRect(-250, -120, 500, 240);
    // tape
    ctx.fillStyle = 'rgba(185,211,234,0.7)'; ctx.fillRect(-40, -134, 80, 26);
    ctx.textAlign = 'center'; ctx.fillStyle = C.ink;
    ctx.font = `56px ${FONT}`; ctx.fillText(title, 0, -50);
    ctx.font = `26px ${FONT}`;
    lines.forEach((l, i) => ctx.fillText(l, 0, 0 + i * 32));
    ctx.fillStyle = C.marker; ctx.font = `30px ${FONT}`;
    const pulse = reduced ? 1 : 1 + Math.sin(frame / 10) * 0.04;
    ctx.save(); ctx.translate(0, 92); ctx.scale(pulse, pulse); ctx.fillText(cta, 0, 0); ctx.restore();
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function render() {
    drawPaper();
    if (!L) { L = buildLevel(1); resetPlayer(); }
    drawWorld();
    drawHUD();
    const tap = matchMedia('(pointer: coarse)').matches ? 'tap jump' : 'press space';
    if (state === 'title') card('Stick Run', ['Run across the notebook page.', 'Stomp scribbles, skip red spikes,', 'grab every star you can.'], `${tap} to start`);
    else if (state === 'over') card('Erased!', [`You made it to page ${level}.`, `Score: ${score}   Best: ${best}`], `${tap} to try again`);
    else if (state === 'win') card(`Page ${level} done!`, [`Score so far: ${score}`, `Lives left: ${lives}`], `${tap} for page ${level + 1}`);
    else if (paused) card('Paused', ['Doodle break.'], 'press P to keep going');
    else if (msgT > 0) {
      ctx.globalAlpha = Math.min(1, msgT / 30);
      ctx.font = `48px ${FONT}`; ctx.fillStyle = C.ink; ctx.textAlign = 'center';
      ctx.fillText(`Page ${level}`, W / 2, 150);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
  }

  // fixed-step loop
  let last = performance.now(), accT = 0;
  function loop(now) {
    accT += Math.min(100, now - last); last = now;
    while (accT >= 1000 / 60) { update(); frame++; accT -= 1000 / 60; }
    render();
    requestAnimationFrame(loop);
  }
  if (document.fonts && document.fonts.load) document.fonts.load(`30px ${FONT}`).catch(() => {});
  requestAnimationFrame(loop);
})();
</script>

</body></html>
