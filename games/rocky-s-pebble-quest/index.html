<style>
/* Layout: one arcade cabinet column — the pixel screen, then controls under it */
:root{

html,body{background:var(--bg);color:var(--fg)}

.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
canvas{display:block;width:100%;max-width:min(1000px,calc((100dvh - 150px) * 1.6));aspect-ratio:384/240;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid var(--edge);box-shadow:0 0 0 4px var(--panel);background:#000;touch-action:none;outline:none}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;align-items:center;font-size:9px;line-height:1.9;color:var(--muted);text-align:center}

.touch .pad{display:flex;gap:10px}

/* ---------- SOUND ---------- */
let actx=null, master, musicGain, sfxGain, muted=false, musicTimer=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function startAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC(); master=actx.createGain(); master.gain.value=muted?0:0.5; master.connect(actx.destination);
  musicGain=actx.createGain(); musicGain.gain.value=0.32; musicGain.connect(master);
  sfxGain=actx.createGain(); sfxGain.gain.value=0.7; sfxGain.connect(master);
  startMusic();
}
function tone(f,dur,type='square',vol=0.2,slide=0,when=0,dest){
  if(!actx) return; when=when||actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,when); if(slide) o.frequency.exponentialRampToValueAtTime(slide,when+dur);
  g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(when); o.stop(when+dur+0.03);
}
let noiseBuf=null;
function noise(dur,vol,freq=1200,when=0,dest){
  if(!actx) return; when=when||actx.currentTime;
  if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=actx.createBufferSource(); s.buffer=noiseBuf; const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  s.connect(f); f.connect(g); g.connect(dest||sfxGain); s.start(when); s.stop(when+dur+0.03);
}

let step=0, nextNote=0;
function startMusic(){
  nextNote=actx.currentTime+0.1;
  musicTimer=setInterval(()=>{
    if(!actx) return; const spb=0.19;
    while(nextNote<actx.currentTime+0.12){
      const m=MEL[step%64]; if(m) tone(mtof(m),0.17,'square',0.11,0,nextNote,musicGain);
      const r=ROOTS[Math.floor(step/8)%8], k=step%8; const bassPat=[0,-1,7,-1,12,-1,7,-1];
      if(bassPat[k]>=0) tone(mtof(r+bassPat[k]-12),0.17,'triangle',0.3,0,nextNote,musicGain);
      if(k%2===1) noise(0.03,0.06,8000,nextNote,musicGain);
      step++; nextNote+=spb;
    }

}

  const g=[];for(let y=0;y<15;y++)g.push(new Array(w).fill(' '));const movs=[];
  const set=(x,y,c)=>{if(x>=0&&x<w&&y>=0&&y<15)g[y][x]=c;};
  const a={
    box(x1,x2,y1,y2,c='#'){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)set(x,y,c);},
    ground(x1,x2){a.box(x1,x2,12,14);},
    plat(x,y,n,c='B'){a.box(x,x+n-1,y,y,c);},
    coins(x,y,n,s=1){for(let i=0;i<n;i++)set(x+i*s,y,'o');},
    spikes(x1,x2){a.box(x1,x2,11,11,'^');},
    lava(x1,x2){a.box(x1,x2,13,14,'~');},
    put:set,
    mov(x,y,range,axis='h',phase=0,n=3){movs.push({tx:x,ty:y,range,axis,phase,n});}
  };
  fn(a); return {g,movs};
}

function updatePlayer(jp,dp){

    for(let ty=Math.floor(p.y/16);ty<=Math.floor((p.y+p.h-0.01)/16);ty++){if(solid(tileAt(tx,ty))){p.x=mx>0?tx*16-p.w:(tx+1)*16;p.vx=0;break;}}}
  // Y axis

  const x1=Math.floor(p.x/16), x2=Math.floor((p.x+p.w-0.01)/16);

function land(y,wasGround){const p=player;p.y=y-p.h;

function updateEnemies(){

    if(e.dead){e.vy+=0.3;e.y+=e.vy;continue;}
    if(e.type==='beetle'){

      const ahead=e.vx>0?e.x+e.w:e.x, tx=Math.floor(ahead/16), ty=Math.floor((e.y+e.h-2)/16), c=tileAt(tx,ty);

function levelClear(){

function update(){
  tick++;

  if(state==='title'){ if(jp||pressed.enter||tap){state='select';sel=Math.min(save.unlocked-1,LEVELS.length-1);} }
  else if(state==='select'){
    if(pressed.arrowleft||pressed.a||tEdge.left)sel=(sel+LEVELS.length-1)%LEVELS.length;
    if(pressed.arrowright||pressed.d||tEdge.right)sel=(sel+1)%LEVELS.length;
    if(pressed.arrowup)sel=(sel+4)%8; if(pressed.arrowdown)sel=(sel+4)%8;
    if(tap){const i=boxAt(tap.x,tap.y);if(i>=0){if(i<save.unlocked)loadLevel(i);else sel=i;}}

  const th=THEMES.sky; drawBG(th,tick*0.6);
  for(let x=0;x<VW;x+=16){ctx.drawImage(th.tiles.top,x,208);ctx.drawImage(th.tiles.fill,x,224);}
  txt("ROCKY'S",VW/2,34,16,'#ffd23a','center'); txt('PEBBLE QUEST',VW/2,58,16,'#ffffff','center');
  txt('A ROCK BLOB ADVENTURE',VW/2,84,8,'#2a2450','center');
  const b=Math.abs(Math.sin(tick*0.08)), y=208-12-Math.round(b*34), sq=b<0.15?0.25:-0.1*b;
  const w=Math.round(28*(1+sq)),h=Math.round(24*(1-sq)); ctx.drawImage(rocky,Math.round(VW/2-w/2),208-h-Math.round(b*34),w,h);
  if(Math.floor(tick/30)%2===0)txt('PRESS JUMP TO START',VW/2,124,8,'#ffffff','center');
}
function drawSelect(){
  drawBG(THEMES.cave,tick*0.3);
  txt('PICK A LEVEL',VW/2,18,16,'#ffd23a','center');
  for(let i=0;i<LEVELS.length;i++){const r=boxRect(i),locked=i>=save.unlocked,on=i===sel;
    ctx.fillStyle=on?'#ffd23a':'#0b0918';ctx.fillRect(r.x-2,r.y-2,BOX.w+4,BOX.h+4);
    ctx.fillStyle=locked?'#1a1630':'#2a2450';ctx.fillRect(r.x,r.y,BOX.w,BOX.h);
    if(locked){ctx.fillStyle='#5a5288';ctx.fillRect(r.x+30,r.y+22,12,10);ctx.fillRect(r.x+32,r.y+14,2,8);ctx.fillRect(r.x+38,r.y+14,2,8);ctx.fillRect(r.x+32,r.y+14,8,2);}
    else{txt(String(i+1),r.x+BOX.w/2,r.y+9,16,on?'#ffd23a':'#ffffff','center');
      const best=save.best[i];const s=(best===undefined?'-':best)+'/'+LEVELS[i].total;
      drawCoin(r.x+BOX.w/2-s.length*4-8,r.y+35,tick);txt(s,r.x+BOX.w/2+6,r.y+35,8,'#ffd23a','center');}}
  const L=LEVELS[sel];
  txt(sel<save.unlocked?L.name.toUpperCase():'LOCKED - BEAT LEVEL '+sel,VW/2,186,8,'#ffffff','center');
  txt('ENTER OR TAP TO PLAY',VW/2,208,8,'#a59fc6','center');
}
function drawClear(){
  ctx.fillStyle='rgba(10,8,24,0.55)';ctx.fillRect(0,0,VW,VH);
  panel(72,60,240,112); txt('LEVEL CLEAR!',VW/2,74,16,'#ffd23a','center');
  txt('COINS '+coinsGot+'/'+level.coins.length,VW/2,104,8,'#ffffff','center');
  txt(newBest?'NEW BEST! PROGRESS SAVED':'PROGRESS SAVED',VW/2,124,8,'#3fd45c','center');
  if(clearT>40&&Math.floor(tick/25)%2===0)txt(cur<LEVELS.length-1?'PRESS JUMP: NEXT LEVEL':'PRESS JUMP',VW/2,148,8,'#f4ecd8','center');
}
function drawWin(){
  drawBG(THEMES.night,tick*0.4);
  for(let x=0;x<VW;x+=16){ctx.drawImage(THEMES.night.tiles.top,x,208);ctx.drawImage(THEMES.night.tiles.fill,x,224);}
  txt('YOU MADE IT!',VW/2,40,16,'#ffd23a','center'); txt('ROCKY REACHED THE SUMMIT',VW/2,70,8,'#ffffff','center');
  let got=0,tot=0;LEVELS.forEach((L,i)=>{got+=save.best[i]||0;tot+=L.total;}); txt('ALL COINS '+got+'/'+tot,VW/2,92,8,'#ffd23a','center');
  const b=Math.abs(Math.sin(tick*0.12));ctx.drawImage(rocky,VW/2-14,208-24-Math.round(b*20),28,24);
  if(tick%12===0)burst(40+Math.random()*300,40+Math.random()*60,['#ffd23a','#3fd45c','#ff7ac0','#6ac8ff'],14,2.5,2);
  updateParticles();for(const q of particles){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s);}
  if(clearT>60&&Math.floor(tick/30)%2===0)txt('PRESS JUMP',VW/2,130,8,'#f4ecd8','center');
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  if(state==='title')drawTitle(); else if(state==='select')drawSelect(); else if(state==='win')drawWin();
  else{drawWorld();drawHUD();if(state==='clear')drawClear();}
}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60;}draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
cv.focus();
})();
</script>
