<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ari and Tofu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-screen canvas, HUD floating top, overlay card for start / game over. Single dusk-sky look on purpose. */
:root{
  --sky-top:#1c2a5c; --sky-low:#f2a07b; --ink:#0f1430; --cream:#fff6e8;
  --blue:#2f8cff; --green:#36d17a; --purple:#8a3ff0;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sky-top);color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#score{font-family:var(--display);font-size:clamp(40px,8vw,64px);line-height:1;text-shadow:0 3px 0 var(--ink)}
#best{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;padding-top:8px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.card{background:rgba(15,20,48,.78);border:2px solid rgba(255,246,232,.2);border-radius:20px;padding:24px 28px;max-width:360px;width:100%;text-align:center;display:grid;gap:12px;backdrop-filter:blur(6px)}
.card h1{font-family:var(--display);font-weight:400;font-size:44px;margin:0;line-height:1;text-wrap:balance}
.card p{margin:0;line-height:1.5}
.bulbs{display:flex;justify-content:center;gap:10px;font-weight:800;font-size:13px}
.bulbs span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid #000}
button{font-family:var(--display);font-size:22px;background:var(--purple);color:var(--cream);border:0;border-radius:14px;padding:12px 20px;cursor:pointer;box-shadow:0 4px 0 #4b1b8f}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #4b1b8f}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.keys{font-size:13px;opacity:.75}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><div id="score">0</div><div id="best">Best 0</div></div>
  <div id="overlay">
    <div class="card" id="card">
      <h1 id="title">Ari and Tofu</h1>
      <p id="msg">She rides Ari high in the sky, dodging storm clouds while Tofu flies along. Every gap you pass is a point.</p>
      <div class="bulbs"><span><i class="dot" style="background:var(--blue)"></i>Ari</span><span><i class="dot" style="background:var(--green)"></i>Tofu</span></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button id="go" type="button">Fly!</button><button id="tofu" type="button" hidden style="background:#1f9a55;box-shadow:0 4px 0 #0e5a30">Ride Tofu</button></div>
      <p class="keys" id="keys">Tap, click, or press Space to flap upward</p>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'),titleEl=document.getElementById('title'),msgEl=document.getElementById('msg'),go=document.getElementById('go');
let W,H,S; // S = scale unit
function resize(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);S=Math.min(W,H)/600;}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('aritofu-best')||0}catch(e){}
bestEl.textContent='Best '+best;

let mount='Ari',state='ready',whale,rocks,score,t=0,spawn,speed,stars,clouds,bubbles;
function reset(){
  whale={x:W*0.28,y:H*0.45,vy:0,rot:0};
  rocks=[];score=0;spawn=0;speed=3.2;bubbles=[];
  scoreEl.textContent='0';
}
stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*0.55,r:Math.random()*1.6+0.4,p:Math.random()*6}));
clouds=Array.from({length:6},(_,i)=>({x:Math.random(),y:0.15+Math.random()*0.5,s:0.6+Math.random()*0.8,v:0.15+Math.random()*0.25}));
reset();

function flap(){
  if(state==='play'){whale.vy=-7.6*S;for(let i=0;i<4;i++)bubbles.push({x:whale.x-60*S,y:whale.y,vx:-1-Math.random()*2,vy:Math.random()*2-1,r:3+Math.random()*4,l:1});}
}
function start(){reset();state='play';overlay.hidden=true;flap();}
const tofuBtn=document.getElementById('tofu'),keysEl=document.getElementById('keys');
go.addEventListener('click',e=>{e.stopPropagation();mount=state==='over'?'Ari':mount;start();});
tofuBtn.addEventListener('click',e=>{e.stopPropagation();mount='Tofu';start();});
cv.addEventListener('pointerdown',()=>{state==='play'?flap():null;});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='play')flap();else{if(state==='over')mount='Tofu';start();}}});

function addRock(){
  const gap=Math.max(170*S,230*S-score*2*S);
  const margin=70*S;
  const gy=margin+Math.random()*(H-margin*2-gap);
  rocks.push({x:W+60*S,w:78*S,top:gy,bot:gy+gap,passed:false,seed:Math.random()});
}

function update(){
  t++;
  if(state!=='play')return;
  whale.vy+=0.42*S;whale.y+=whale.vy;
  whale.rot=Math.max(-0.45,Math.min(0.6,whale.vy/(14*S)));
  spawn-=speed;
  if(spawn<=0){addRock();spawn=Math.max(230*S,300*S-score*3*S);}
  speed=Math.min(6.5,3.2+score*0.08)*S;
  for(const r of rocks){
    r.x-=speed;
    if(!r.passed&&r.x+r.w<whale.x-50*S){r.passed=true;score++;scoreEl.textContent=score;}
  }
  rocks=rocks.filter(r=>r.x>-r.w-20);
  for(const b of bubbles){b.x+=b.vx;b.y+=b.vy+0.4;b.l-=0.02;}
  bubbles=bubbles.filter(b=>b.l>0);
  // collisions: whale body approx ellipse 62x30
  const hw=50*S,hh=24*S;
  if(whale.y+hh>H-4)return crash();
  for(const r of rocks){
    if(whale.x+hw>r.x&&whale.x-hw<r.x+r.w){
      if(whale.y-hh<r.top||whale.y+hh>r.bot)return crash();
    }
  }
  if(whale.y<-40*S)whale.y=-40*S,whale.vy=0;
}
function crash(){
  state='over';
  if(score>best){best=score;try{localStorage.setItem('aritofu-best',best)}catch(e){}}
  bestEl.textContent='Best '+best;
  titleEl.textContent='Zap!';
  msgEl.textContent=`Your bird passed ${score} storm cloud${score===1?'':'s'}. Best so far: ${best}.`;
  go.textContent='Ride Ari';tofuBtn.hidden=false;
  keysEl.textContent='Press Space to ride Tofu';
  overlay.hidden=false;go.focus();
}

/* ---------- drawing ---------- */
function sky(){
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3d9bff');g.addColorStop(0.6,'#8fd0ff');g.addColorStop(1,'#d8f0ff');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // sun
  const sx=W*0.84,sy=H*0.15,sr=40*S;
  const sg=cx.createRadialGradient(sx,sy,sr*0.6,sx,sy,sr*2.4);sg.addColorStop(0,'#fff6b0aa');sg.addColorStop(1,'#fff6b000');
  cx.fillStyle=sg;cx.beginPath();cx.arc(sx,sy,sr*2.4,0,7);cx.fill();
  cx.fillStyle='#ffe066';cx.beginPath();cx.arc(sx,sy,sr,0,7);cx.fill();
  // drifting background clouds
  for(const c of clouds){
    c.x-=c.v*0.0015*(state==='play'?2:1);if(c.x<-0.3)c.x=1.2;
    puff(c.x*W,c.y*H,c.s*S*0.9,'rgba(255,255,255,.55)');
  }
}
function puff(x,y,s,col){
  cx.fillStyle=col;cx.beginPath();
  cx.ellipse(x,y,70*s,24*s,0,0,7);cx.ellipse(x+38*s,y-16*s,42*s,26*s,0,0,7);cx.ellipse(x-34*s,y-8*s,36*s,20*s,0,0,7);
  cx.fill();
}
function rock(x,y,w,h,flip,seed){
  // a tall stack of storm cloud
  cx.save();
  cx.beginPath();cx.rect(x-30*S,y,w+60*S,h);cx.clip();
  const step=34*S;
  const lumps=[];
  if(!flip){for(let yy=h;yy>-step;yy-=step)lumps.push(yy);}
  else{for(let yy=0;yy<h+step;yy+=step)lumps.push(yy);}
  // outline layer
  cx.fillStyle='#4a5677';
  for(const yy of lumps){const k=Math.sin(yy*0.05+seed*10)*8*S;cx.beginPath();cx.arc(x+w*0.3+k,y+yy,w*0.42+3*S,0,7);cx.arc(x+w*0.72-k,y+yy+step*0.5,w*0.4+3*S,0,7);cx.fill();}
  cx.fillStyle='#8a95b5';
  for(const yy of lumps){const k=Math.sin(yy*0.05+seed*10)*8*S;cx.beginPath();cx.arc(x+w*0.3+k,y+yy,w*0.42,0,7);cx.arc(x+w*0.72-k,y+yy+step*0.5,w*0.4,0,7);cx.fill();}
  cx.fillStyle='#b4bdd6';
  for(const yy of lumps){const k=Math.sin(yy*0.05+seed*10)*8*S;cx.beginPath();cx.arc(x+w*0.25+k,y+yy-6*S,w*0.2,0,7);cx.fill();}
  cx.restore();
  // lightning bolt at the open end
  const ex=x+w*0.5,ey=flip?y:y+h,d=flip?-1:1;
  if(Math.sin(t*0.08+seed*20)>0.7){
    cx.strokeStyle='#ffe066';cx.lineWidth=4*S;cx.lineJoin='round';
    cx.beginPath();cx.moveTo(ex,ey);cx.lineTo(ex-8*S,ey+d*16*S);cx.lineTo(ex+4*S,ey+d*18*S);cx.lineTo(ex-6*S,ey+d*34*S);cx.stroke();
  }
}
function smallBird(x,y,col,dark,name,ph){
  const s=S,f=Math.sin(t*0.35+ph);
  cx.save();cx.translate(x,y);
  cx.strokeStyle='#000';cx.lineWidth=2.5*s;cx.lineJoin='round';
  // tail (black)
  cx.fillStyle='#000';cx.beginPath();cx.moveTo(-12*s,0);cx.lineTo(-24*s,-6*s);cx.lineTo(-22*s,6*s);cx.closePath();cx.fill();
  // body
  cx.fillStyle=col;cx.beginPath();cx.ellipse(0,0,15*s,12*s,0,0,7);cx.fill();cx.stroke();
  // belly
  cx.fillStyle=dark;cx.beginPath();cx.ellipse(3*s,5*s,9*s,5*s,0,0,7);cx.fill();
  // wing (black highlight)
  cx.fillStyle='#000';cx.save();cx.translate(-2*s,-2*s);cx.rotate(-0.3-f*0.6);
  cx.beginPath();cx.ellipse(-4*s,-4*s,10*s,5*s,0,0,7);cx.fill();cx.restore();
  // eye + black eye stripe
  cx.fillStyle='#000';cx.beginPath();cx.roundRect(4*s,-7*s,10*s,4*s,2*s);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(8*s,-5*s,1.6*s,0,7);cx.fill();
  // beak
  cx.fillStyle='#ffb43a';cx.beginPath();cx.moveTo(13*s,-2*s);cx.lineTo(21*s,0);cx.lineTo(13*s,3*s);cx.closePath();cx.fill();cx.stroke();
  // name tag
  cx.font=`800 ${12*s}px Nunito, system-ui, sans-serif`;cx.textAlign='center';
  cx.lineWidth=3*s;cx.strokeStyle='#0f1430';cx.strokeText(name,0,-18*s);
  cx.fillStyle='#fff6e8';cx.fillText(name,0,-18*s);
  cx.restore();
}
const BIRDS={Ari:{body:'#2f8cff',wing:'#1f5fb8',belly:'#cfe3ff',light:'#9cc8ff'},Tofu:{body:'#36d17a',wing:'#1f9a55',belly:'#d4f7e2',light:'#a6efc4'}};
function drawWhale(){
  const w=whale,s=S,C=BIRDS[mount],other=mount==='Ari'?'Tofu':'Ari',O=BIRDS[other];
  const flapA=Math.sin(t*(state==='play'?0.3:0.15));
  // Ari and Tofu fly just behind and around the big bird
  const lag=w.vy*1.5;
  cx.save();cx.translate(w.x,w.y);cx.rotate(w.rot);
  cx.strokeStyle='#0f1430';cx.lineWidth=3.5*s;cx.lineJoin='round';
  // tail feathers
  cx.fillStyle='#000';
  for(let i=-1;i<=1;i++){cx.beginPath();cx.moveTo(-40*s,0);cx.quadraticCurveTo(-62*s,i*12*s-6*s,-78*s,i*16*s);cx.quadraticCurveTo(-60*s,i*12*s+6*s,-38*s,6*s);cx.closePath();cx.fill();cx.stroke();}
  // back wing
  cx.fillStyle=C.wing;cx.save();cx.translate(-6*s,-10*s);cx.rotate(-0.4-flapA*0.7);
  cx.beginPath();cx.ellipse(-22*s,-6*s,34*s,12*s,0,0,7);cx.fill();cx.stroke();cx.restore();
  // body
  cx.fillStyle=C.body;cx.beginPath();cx.ellipse(0,0,48*s,28*s,0,0,7);cx.fill();cx.stroke();
  cx.fillStyle=C.belly;cx.beginPath();cx.ellipse(10*s,12*s,32*s,13*s,0,0,7);cx.fill();
  // head
  cx.fillStyle=C.body;cx.beginPath();cx.arc(44*s,-14*s,20*s,0,7);cx.fill();cx.stroke();
  // crest
  cx.fillStyle='#000';
  for(let i=0;i<3;i++){cx.beginPath();cx.ellipse(38*s+i*6*s,-36*s,4*s,10*s,-0.4+i*0.3,0,7);cx.fill();cx.stroke();}
  cx.fillStyle=C.body;cx.beginPath();cx.arc(44*s,-14*s,18.3*s,0,7);cx.fill();
  cx.fillStyle='#000';cx.beginPath();cx.roundRect(38*s,-22*s,22*s,8*s,4*s);cx.fill();
  // eye
  cx.fillStyle='#fff';cx.beginPath();cx.arc(50*s,-18*s,6*s,0,7);cx.fill();
  cx.fillStyle='#0f1430';cx.beginPath();cx.arc(52*s,-18*s,3.4*s,0,7);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(53*s,-19.5*s,1.2*s,0,7);cx.fill();
  // beak
  cx.fillStyle='#ffb43a';cx.beginPath();cx.moveTo(60*s,-16*s);cx.lineTo(82*s,-8*s);cx.lineTo(60*s,-3*s);cx.closePath();cx.fill();cx.stroke();
  // feet
  cx.strokeStyle='#ffb43a';cx.lineWidth=3*s;
  for(const fx of [-6,8]){cx.beginPath();cx.moveTo(fx*s,26*s);cx.lineTo(fx*s,36*s);cx.moveTo(fx*s-5*s,40*s);cx.lineTo(fx*s,36*s);cx.lineTo(fx*s+5*s,40*s);cx.stroke();}
  // rider
  drawRider(-14*s,-26*s,s);
  // front wing
  cx.strokeStyle='#0f1430';cx.lineWidth=3.5*s;
  cx.fillStyle=C.wing;cx.save();cx.translate(-4*s,0);cx.rotate(-0.2-flapA*0.8);
  cx.beginPath();cx.ellipse(-20*s,-4*s,32*s,12*s,0,0,7);cx.fill();cx.stroke();
  cx.strokeStyle='#000';cx.lineWidth=3*s;
  for(let i=0;i<3;i++){cx.beginPath();cx.moveTo(-40*s+i*12*s,-6*s);cx.lineTo(-30*s+i*12*s,4*s);cx.stroke();}
  cx.restore();
  cx.restore();
  cx.font=`800 ${14*s}px Nunito, system-ui, sans-serif`;cx.textAlign='center';cx.lineWidth=3*s;cx.strokeStyle='#0f1430';
  cx.strokeText(mount,w.x+44*s,w.y-80*s);cx.fillStyle='#fff6e8';cx.fillText(mount,w.x+44*s,w.y-80*s);
  smallBird(w.x+20*s,w.y+56*s-lag*0.6+Math.sin(t*0.07+2)*6*s,O.body,O.light,other,2);
}
function drawRider(x,y,s){
  cx.save();cx.translate(x,y);
  const bob=Math.sin(t*0.2)*1.5*s;
  cx.strokeStyle='#0f1430';cx.lineWidth=2.5*s;cx.lineJoin='round';
  // black pants (seated, legs over the side)
  cx.fillStyle='#111';
  cx.beginPath();cx.roundRect(-6*s,-4*s,24*s,12*s,4*s);cx.fill();cx.stroke();
  cx.beginPath();cx.roundRect(-2*s,2*s,7*s,22*s,3*s);cx.fill();cx.stroke();
  cx.beginPath();cx.roundRect(9*s,2*s,7*s,20*s,3*s);cx.fill();cx.stroke();
  // shoes
  cx.fillStyle='#fff6e8';
  cx.beginPath();cx.ellipse(3*s,25*s,5.5*s,3*s,0,0,7);cx.fill();cx.stroke();
  cx.beginPath();cx.ellipse(14*s,23*s,5.5*s,3*s,0,0,7);cx.fill();cx.stroke();
  cx.translate(0,bob);
  // ponytail (behind head, blowing in wind)
  cx.fillStyle='#3b2416';
  cx.beginPath();cx.moveTo(-2*s,-40*s);cx.quadraticCurveTo(-18*s,-42*s+Math.sin(t*0.25)*4*s,-24*s,-30*s+Math.sin(t*0.25)*5*s);cx.quadraticCurveTo(-12*s,-32*s,-2*s,-32*s);cx.closePath();cx.fill();cx.stroke();
  // purple shirt
  cx.fillStyle='#8a3ff0';
  cx.beginPath();cx.roundRect(-4*s,-26*s,18*s,24*s,6*s);cx.fill();cx.stroke();
  // arms: one holding on, one waving (purple sleeves)
  cx.fillStyle='#8a3ff0';
  cx.beginPath();cx.roundRect(10*s,-20*s,5*s,10*s,2*s);cx.fill();cx.stroke();
  cx.fillStyle='#e8b48a';cx.beginPath();cx.roundRect(10.5*s,-11*s,4*s,8*s,2*s);cx.fill();cx.stroke();
  cx.save();cx.translate(-2*s,-22*s);cx.rotate(-2.4+Math.sin(t*0.15)*0.3);
  cx.fillStyle='#8a3ff0';cx.beginPath();cx.roundRect(-2.5*s,0,5*s,9*s,2*s);cx.fill();cx.stroke();
  cx.fillStyle='#e8b48a';cx.beginPath();cx.roundRect(-2*s,8*s,4*s,8*s,2*s);cx.fill();cx.stroke();cx.restore();
  // head
  cx.fillStyle='#e8b48a';cx.beginPath();cx.arc(5*s,-34*s,9*s,0,7);cx.fill();cx.stroke();
  // hair with bangs
  cx.fillStyle='#3b2416';cx.beginPath();cx.arc(5*s,-35*s,9.5*s,Math.PI*0.95,Math.PI*2.05);cx.quadraticCurveTo(10*s,-38*s,4*s,-36*s);cx.quadraticCurveTo(0,-38*s,-4*s,-33*s);cx.closePath();cx.fill();
  // hair bow
  cx.fillStyle='#ff6fae';cx.beginPath();cx.ellipse(-2*s,-42*s,4*s,2.5*s,0.5,0,7);cx.ellipse(-6*s,-39*s,4*s,2.5*s,0.5,0,7);cx.fill();
  // face
  cx.fillStyle='#0f1430';cx.beginPath();cx.arc(9*s,-33*s,1.4*s,0,7);cx.fill();
  cx.lineWidth=1.5*s;cx.beginPath();cx.moveTo(10.5*s,-35*s);cx.lineTo(12*s,-36.5*s);cx.stroke();
  cx.beginPath();cx.arc(9*s,-30*s,3*s,0.2,1.5);cx.stroke();
  cx.fillStyle='#ff9bb0aa';cx.beginPath();cx.ellipse(5*s,-30*s,2.5*s,1.5*s,0,0,7);cx.fill();
  cx.restore();
}
function render(){
  sky();
  for(const r of rocks){rock(r.x,0,r.w,r.top,false,r.seed);rock(r.x,r.bot,r.w,H-r.bot,true,r.seed);}
  for(const b of bubbles){cx.globalAlpha=b.l;cx.fillStyle='#ffffff';cx.beginPath();cx.ellipse(b.x,b.y,b.r*1.6,b.r*0.6,b.x*0.05,0,7);cx.fill();}
  cx.globalAlpha=1;
  if(state==='ready'){whale.x=W*0.28;whale.y=H*0.45+Math.sin(t*0.05)*12*S;whale.rot=Math.sin(t*0.05)*0.08;}
  drawWhale();
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){update();render();requestAnimationFrame(loop);}
loop();
</script>

</body></html>
