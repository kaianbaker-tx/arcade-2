<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaian's Arcade 2</title>
<style>
  body { margin:0; background:#14111f; color:#f3f0ff; font:16px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:32px 16px 64px; }
  h1 { text-align:center; font-size:40px; margin:0; letter-spacing:1px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:22px; }
  .grid a { position:relative; display:flex; flex-direction:column; border-radius:18px; overflow:hidden; background:#221d33; border:2px solid #3a3354; color:inherit; text-decoration:none; transition:transform .12s, border-color .12s; }
  .grid a:hover { border-color:#7c5cff; transform:translateY(-3px); }
  .thumb { display:block; width:100%; aspect-ratio:16/10; object-fit:cover; background:#2e2848; }
  .info { padding:12px 14px 14px; display:flex; flex-direction:column; gap:3px; }
  .name { font-weight:800; font-size:19px; line-height:1.2; }
  .by { font-size:13px; font-weight:600; color:#b3abcf; }
  .blurb { font-size:14px; line-height:1.4; color:#ddd6f5; margin-top:4px; }
  .new { position:absolute; top:10px; right:10px; background:#ffd166; color:#3a2a00; font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .empty { text-align:center; color:#b3abcf; }
  footer { text-align:center; margin-top:40px; }
  footer a { color:#b9a7ff; }
</style>
</head>
<body>
<main>
  <h1>Kaian's Arcade 2</h1>
  <div class="grid" id="games"></div>
  <p class="empty" id="empty" hidden>New games show up here soon!</p>
  <footer><a href="https://kaianbaker-tx.github.io/arcade/">← Kaian's first arcade</a></footer>
</main>
<script>
  // The cards come from games.json. The nightly sweep only updates games.json and games/, never this page.
  fetch('games.json').then(r => r.json()).then(d => {
    const games = (d.games || []).slice().sort((a, b) => (b.added || '').localeCompare(a.added || ''));
    document.getElementById('empty').hidden = games.length > 0;
    const recent = new Date(Date.now() - 2 * 864e5).toISOString().slice(0, 10);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
    for (const g of games) {
      const a = el('a');
      a.href = 'games/' + g.slug + '/';
      if (g.thumb) {
        const img = el('img', 'thumb');
        img.src = g.thumb; img.alt = ''; img.loading = 'lazy';
        a.append(img);
      } else {
        a.append(el('div', 'thumb'));
      }
      const info = el('div', 'info');
      info.append(el('span', 'name', g.name));
      if (g.creator) info.append(el('span', 'by', 'by ' + g.creator));
      if (g.blurb) info.append(el('span', 'blurb', g.blurb));
      a.append(info);
      if ((g.added || '') >= recent) a.append(el('span', 'new', 'NEW'));
      document.getElementById('games').append(a);
    }
    window.dispatchEvent(new Event('arcade:cards'));
  });
</script>
<!-- KEEP THIS LINE: it adds the visit counter, play counts and comments. -->
<script src="extras.js" defer></script>
</body>
</html>
